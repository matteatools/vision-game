<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="パーツを組み合わせて生きものロボを開発し、荒廃した工場を復興させるゲームです。"
    />
    <meta name="theme-color" content="#061d26" />
    <link rel="icon" href="./assets/parts/star_yellow.png" />
    <title>ロボット工場</title>
    <script type="module" crossorigin src="./assets/index-CssSGbBg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B5iJTvrJ.css">
    <style>
      /* Mobile fallback: older browsers ignore dvh, which can collapse the game board. */
      .game-shell {
        min-height: 100vh;
        height: 100vh;
      }

      .game-board,
      .game-titlebar {
        width: 96vw;
        width: min(96vw, 163.484vh);
      }

      @media (orientation: landscape) and (max-height: 650px) and (pointer: coarse) {
        .game-board {
          width: 100%;
          width: min(100%, 177.7vh);
        }
      }

      @supports (height: 100dvh) {
        .game-shell {
          min-height: 0;
          height: 100dvh;
        }

        .game-board,
        .game-titlebar {
          width: min(96vw, 163.48dvh);
        }

        @media (orientation: landscape) and (max-height: 650px) and (pointer: coarse) {
          .game-board {
            width: min(100%, 177.7dvh);
          }
        }
      }

      /* Chrome on Android can report a stale dvh while entering fullscreen and rotating. */
      .game-shell {
        height: var(--game-viewport-height, 100vh);
      }

      .game-board,
      .game-titlebar {
        width: min(96vw, var(--game-board-width, 163.484vh));
      }

      @media (orientation: landscape) and (max-height: 650px) and (pointer: coarse) {
        .game-board {
          width: min(100%, var(--game-landscape-board-width, 177.7vh));
        }
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var frameId = 0;

        function updateGameViewport() {
          var viewport = window.visualViewport;
          var height = viewport && viewport.height ? viewport.height : window.innerHeight;

          if (!height || height < 1) return;

          root.style.setProperty('--game-viewport-height', height + 'px');
          root.style.setProperty('--game-board-width', height * 1.63484 + 'px');
          root.style.setProperty('--game-landscape-board-width', height * 1.777 + 'px');
        }

        function scheduleGameViewportUpdate() {
          if (frameId) window.cancelAnimationFrame(frameId);
          frameId = window.requestAnimationFrame(updateGameViewport);
          window.setTimeout(updateGameViewport, 120);
          window.setTimeout(updateGameViewport, 500);
        }

        updateGameViewport();
        window.addEventListener('resize', scheduleGameViewportUpdate, { passive: true });
        window.addEventListener('orientationchange', scheduleGameViewportUpdate, { passive: true });
        document.addEventListener('fullscreenchange', scheduleGameViewportUpdate);

        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', scheduleGameViewportUpdate, { passive: true });
        }

        if (
          window.screen &&
          window.screen.orientation &&
          typeof window.screen.orientation.addEventListener === 'function'
        ) {
          window.screen.orientation.addEventListener('change', scheduleGameViewportUpdate);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML =
          '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;background:#061d26;color:white;font-family:Meiryo,sans-serif;text-align:center"><section><h1 style="color:#fff2a7">ロボット工場</h1><p style="line-height:1.8">この公開用HTMLは、直接ダブルクリックでは起動できません。<br>ひとつ上のフォルダにある「GitHub公開版を確認.bat」を使ってください。</p></section></main>';
      }
    </script>
  </body>
</html>
