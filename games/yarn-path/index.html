<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6c66f">
    <title>このいっぽん！｜こねこの けいとあそび</title>
    <meta name="description" content="絡まった毛糸を目でたどる。同じ色につながる一本、見つけられる？">
    <link rel="canonical" href="https://matteatools.github.io/vision-game/games/yarn-path/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="めとあたまのゲームパーク">
    <meta property="og:title" content="こねこと けいとあそび このいっぽん！｜めとあたまのゲームパーク">
    <meta property="og:description" content="絡まった毛糸を目でたどる。同じ色につながる一本、見つけられる？">
    <meta property="og:url" content="https://matteatools.github.io/vision-game/games/yarn-path/">
    <meta property="og:image" content="https://matteatools.github.io/vision-game/assets/og/yarn-path.jpg">
    <meta property="og:image:secure_url" content="https://matteatools.github.io/vision-game/assets/og/yarn-path.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="こねこと けいとあそび このいっぽん！のゲーム紹介画像">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="こねこと けいとあそび このいっぽん！｜めとあたまのゲームパーク">
    <meta name="twitter:description" content="絡まった毛糸を目でたどる。同じ色につながる一本、見つけられる？">
    <meta name="twitter:image" content="https://matteatools.github.io/vision-game/assets/og/yarn-path.jpg">
    <meta name="twitter:image:alt" content="こねこと けいとあそび このいっぽん！のゲーム紹介画像">
    <style>
        :root {
            --ink: #573f36;
            --cream: #fff8e8;
            --mint: #50bbaa;
            --mint-dark: #278d82;
            --coral: #f57667;
            --yellow: #ffd45f;
            --panel: rgba(255, 252, 242, 0.96);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            background: #f8ddb0;
            font-family:
                "Hiragino Maru Gothic ProN",
                "Yu Gothic",
                "Meiryo",
                system-ui,
                sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        button {
            touch-action: manipulation;
        }

        [hidden] {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .screen {
            position: fixed;
            inset: 0;
            width: 100%;
            min-height: 100%;
            min-height: 100svh;
        }

        .sound-button {
            position: fixed;
            z-index: 300;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            display: grid;
            width: 46px;
            height: 46px;
            place-items: center;
            padding: 0;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 5px 0 rgba(98, 67, 48, 0.22);
            font-size: 23px;
            cursor: pointer;
        }

        /* タイトル */
        .title-screen {
            isolation: isolate;
            overflow: hidden;
            background: #eed0a0;
        }

        .title-art {
            position: absolute;
            z-index: -3;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 50%;
        }

        .title-shade {
            position: absolute;
            z-index: -2;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(72, 42, 25, 0.16), transparent 32%),
                linear-gradient(0deg, rgba(71, 42, 25, 0.55), transparent 54%);
            pointer-events: none;
        }

        .title-best {
            position: absolute;
            z-index: 4;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            min-width: 112px;
            padding: 8px 13px;
            color: #6b5141;
            background: rgba(255, 253, 245, 0.94);
            border: 3px solid #fff;
            border-radius: 17px;
            box-shadow: 0 6px 18px rgba(75, 43, 24, 0.2);
            text-align: center;
            font-size: 11px;
            font-weight: 900;
        }

        .title-best strong {
            display: block;
            color: #ec6b5c;
            font-size: 25px;
            line-height: 1.05;
        }

        .title-logo {
            position: absolute;
            z-index: 2;
            top: max(29vh, calc(env(safe-area-inset-top) + 150px));
            left: 50%;
            width: min(96vw, 820px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .title-logo-art {
            display: block;
            width: 100%;
            height: auto;
            max-height: min(34vh, 260px);
            object-fit: contain;
            filter: drop-shadow(0 9px 13px rgba(72, 41, 24, 0.32));
        }

        .title-menu {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
            display: grid;
            grid-template-columns: 0.9fr 0.9fr 1.18fr 1fr;
            width: min(98vw, 760px);
            gap: 8px;
            transform: translateX(-50%);
        }

        .title-button,
        .title-link {
            display: grid;
            min-height: 46px;
            place-items: center;
            padding: 7px 10px;
            border: 0;
            border-radius: 15px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 1000;
            cursor: pointer;
            transition: transform 120ms ease;
        }

        .title-button:active,
        .title-link:active {
            transform: translateY(4px);
        }

        .practice-button {
            color: #20766e;
            background: #effff9;
            border: 3px solid #fff;
            box-shadow: 0 7px 0 #8ecfbf, 0 12px 22px rgba(70, 48, 31, 0.18);
        }

        .training-button {
            color: #8b5618;
            background: #fff4c9;
            border: 3px solid #fff;
            box-shadow: 0 7px 0 #e5b657, 0 12px 22px rgba(70, 48, 31, 0.18);
        }

        .start-button {
            min-height: 52px;
            color: #fff;
            background: linear-gradient(180deg, #67d3bc, #36ad9b);
            border: 3px solid #dffff7;
            box-shadow: 0 6px 0 #25887d, 0 11px 20px rgba(70, 48, 31, 0.22);
            font-size: 22px;
            text-shadow: 0 2px 0 rgba(31, 109, 99, 0.5);
        }

        .start-button small {
            display: block;
            font-size: 12px;
            line-height: 1;
        }

        .title-link {
            min-height: 46px;
            color: #684f42;
            background: rgba(255, 253, 245, 0.93);
            border: 2px solid #fff;
            box-shadow: 0 5px 0 rgba(99, 75, 58, 0.25);
            font-size: 12px;
        }

        .training-picker {
            position: absolute;
            z-index: 20;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(73, 49, 32, 0.56);
        }

        .training-card {
            width: min(92vw, 470px);
            padding: 24px 22px 20px;
            background: rgba(255, 252, 242, 0.98);
            border: 5px solid #fff;
            border-radius: 28px;
            box-shadow: 0 16px 0 rgba(111, 75, 48, 0.22), 0 24px 48px rgba(63, 39, 25, 0.28);
            text-align: center;
        }

        .training-card h2 {
            margin: 0;
            color: #4d8378;
            font-size: clamp(26px, 8vw, 40px);
            line-break: strict;
            line-height: 1.15;
            overflow-wrap: normal;
            word-break: keep-all;
        }

        .training-card p {
            margin: 8px 0 17px;
            font-size: 17px;
            font-weight: 900;
            line-break: strict;
            overflow-wrap: normal;
            word-break: keep-all;
        }

        .training-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .training-choice,
        .training-close {
            min-height: 58px;
            border: 3px solid #fff;
            border-radius: 16px;
            font-weight: 1000;
            cursor: pointer;
        }

        .training-choice {
            color: #fff;
            background: linear-gradient(180deg, #f3bd58, #df8f36);
            box-shadow: 0 6px 0 #af672b;
            font-size: 20px;
        }

        .training-choice:active,
        .training-close:active {
            transform: translateY(4px);
        }

        .training-close {
            width: min(65%, 230px);
            min-height: 43px;
            margin-top: 18px;
            color: #665248;
            background: #eee9e0;
            box-shadow: 0 5px 0 #d2c7b9;
            font-size: 15px;
        }

        /* ゲーム */
        .game-screen {
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
            background:
                radial-gradient(circle at 14% 18%, rgba(255,255,255,0.75) 0 3%, transparent 3.2%),
                linear-gradient(180deg, #f5d79c 0%, #fff4d4 48%, #bce3d2 100%);
        }

        .hud {
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: 88px 1fr 88px;
            gap: 8px;
            align-items: center;
            padding:
                max(9px, env(safe-area-inset-top))
                max(9px, env(safe-area-inset-right))
                8px
                max(9px, env(safe-area-inset-left));
            background: rgba(255, 253, 245, 0.94);
            border-bottom: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(83, 59, 43, 0.14);
        }

        .hud-card {
            min-width: 0;
            padding: 6px 7px;
            background: #fff;
            border: 2px solid #f1dfbf;
            border-radius: 14px;
            text-align: center;
            font-size: 10px;
            font-weight: 900;
        }

        .hud-card strong {
            display: block;
            margin-top: 1px;
            color: #e46d61;
            font-size: 20px;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .hud-rule {
            min-width: 0;
            color: #654a3b;
            text-align: center;
            font-size: clamp(12px, 3.4vw, 18px);
            font-weight: 1000;
            line-break: strict;
            line-height: 1.25;
            overflow-wrap: normal;
            text-wrap: balance;
            word-break: keep-all;
        }

        .exit-button {
            min-height: 46px;
            color: #6b574d;
            background: #f1ebe1;
            border: 0;
            border-radius: 14px;
            box-shadow: 0 4px 0 #d4c9bb;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
        }

        .play-area {
            position: relative;
            min-height: 0;
            overflow: hidden;
        }

        .workshop {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background-color: #f3dfb7;
            background-image: url("assets/yarn-rug-board-v1.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        #yarn-canvas {
            position: absolute;
            z-index: 3;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .difficulty-chip {
            position: absolute;
            z-index: 5;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 5px 14px;
            color: #735846;
            background: rgba(255, 253, 245, 0.9);
            border: 2px solid #fff;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(89, 61, 43, 0.12);
            font-size: 12px;
            font-weight: 900;
            pointer-events: none;
        }

        .feedback {
            position: absolute;
            z-index: 40;
            top: 49%;
            left: 50%;
            min-width: 180px;
            padding: 11px 22px;
            color: #fff;
            background: #eb7167;
            border: 4px solid #fff;
            border-radius: 22px;
            box-shadow: 0 10px 24px rgba(91, 58, 42, 0.25);
            opacity: 0;
            transform: translate(-50%, -40%) scale(0.8);
            text-align: center;
            font-size: clamp(21px, 6vw, 31px);
            font-weight: 1000;
            pointer-events: none;
        }

        .feedback.show {
            animation: feedbackPop 660ms ease-out both;
        }

        .feedback.good {
            background: #45b98a;
        }

        @keyframes feedbackPop {
            0% { opacity: 0; transform: translate(-50%, -35%) scale(0.72); }
            25% { opacity: 1; transform: translate(-50%, -53%) scale(1.07); }
            70% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -80%) scale(0.94); }
        }

        /* 説明・結果 */
        .overlay {
            position: absolute;
            z-index: 100;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            background: rgba(90, 63, 42, 0.35);
            backdrop-filter: blur(4px);
        }

        .guide-card,
        .result-card {
            width: min(89vw, 430px);
            padding: 19px;
            background: var(--panel);
            border: 5px solid #fff;
            border-radius: 30px;
            box-shadow: 0 18px 45px rgba(77, 51, 34, 0.25);
            text-align: center;
        }

        .kitten-portrait {
            width: 112px;
            height: 112px;
            margin: -77px auto 6px;
            background-color: #f7d99d;
            background-image: url("assets/koneko-yarn-title-v2.png");
            background-position: 79% 0%;
            background-size: 340%;
            border: 5px solid #fff;
            border-radius: 50%;
            box-shadow: 0 7px 20px rgba(78, 54, 37, 0.2);
        }

        .guide-card h2,
        .result-card h2 {
            margin: 3px 0 8px;
            color: #2d9384;
            font-size: clamp(26px, 8vw, 37px);
            font-weight: 1000;
            line-break: strict;
            overflow-wrap: normal;
            text-wrap: balance;
            word-break: keep-all;
        }

        #guide-heading {
            white-space: nowrap;
        }

        .guide-card p {
            margin: 0;
            color: #614b3f;
            font-size: clamp(15px, 4.4vw, 19px);
            font-weight: 900;
            line-break: strict;
            line-height: 1.65;
            overflow-wrap: normal;
            text-align: left;
            word-break: keep-all;
        }

        .meaning-line {
            display: block;
            white-space: nowrap;
        }

        .guide-card b {
            color: #ec6d60;
        }

        .guide-button,
        .result-button {
            min-height: 51px;
            padding: 9px 18px;
            color: #fff;
            background: linear-gradient(180deg, #65cfb7, #39aa98);
            border: 0;
            border-radius: 16px;
            box-shadow: 0 6px 0 #27887c;
            font-size: 18px;
            font-weight: 1000;
            cursor: pointer;
        }

        .countdown {
            color: #fff7d2;
            font-size: min(30vw, 150px);
            font-weight: 1000;
            -webkit-text-stroke: 3px #9c5e38;
            paint-order: stroke fill;
            text-shadow: 0 9px 0 #df7755, 0 18px 30px rgba(65, 39, 24, 0.3);
        }

        .result-screen {
            display: grid;
            place-items: center;
            padding:
                max(68px, calc(env(safe-area-inset-top) + 55px))
                15px
                max(18px, env(safe-area-inset-bottom));
            overflow: hidden;
            background:
                radial-gradient(circle at 12% 18%, rgba(255,255,255,0.9) 0 4%, transparent 4.2%),
                radial-gradient(circle at 86% 30%, rgba(255,255,255,0.7) 0 5%, transparent 5.2%),
                linear-gradient(180deg, #f6d9a4, #fff3d0 60%, #b9dfce);
        }

        .result-card {
            width: min(92vw, 470px);
        }

        .result-score-label {
            margin-top: 4px;
            color: #816554;
            font-size: 14px;
            font-weight: 900;
            line-break: strict;
            overflow-wrap: normal;
            word-break: keep-all;
        }

        .result-score {
            color: #ee7063;
            font-size: clamp(62px, 19vw, 88px);
            font-weight: 1000;
            line-height: 1;
            text-shadow: 0 5px 0 #ffd0b7;
        }

        .result-score small {
            font-size: 22px;
        }

        .result-best {
            min-height: 2em;
            margin: 8px 0 15px;
            color: #6f584c;
            font-size: 15px;
            font-weight: 900;
            line-break: strict;
            overflow-wrap: normal;
            word-break: keep-all;
        }

        .result-best.new {
            color: #db9200;
            font-size: 19px;
        }

        .result-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px;
        }

        .result-title-button {
            color: #705d53;
            background: #eee9e0;
            box-shadow: 0 6px 0 #d3c9ba;
        }

        @media (orientation: landscape) and (max-height: 620px) {
            .title-logo {
                top: max(24vh, calc(env(safe-area-inset-top) + 60px));
                left: 30%;
                width: 53vw;
            }

            .title-logo-art {
                max-height: 44vh;
            }

            .title-menu {
                right: auto;
                bottom: max(13px, env(safe-area-inset-bottom));
                left: 50%;
                width: min(94vw, 760px);
                transform: translateX(-50%);
            }

            .title-button {
                min-height: 42px;
                font-size: 14px;
            }

            .start-button {
                min-height: 47px;
                font-size: 20px;
            }

            .title-link {
                min-height: 42px;
            }

            .hud {
                grid-template-columns: 78px 1fr 76px;
                padding-top: max(6px, env(safe-area-inset-top));
                padding-bottom: 5px;
            }

            .hud-card {
                padding: 3px 5px;
            }

            .hud-card strong {
                font-size: 18px;
            }

            .exit-button {
                min-height: 38px;
            }

            .guide-card,
            .result-card {
                width: min(66vw, 520px);
                padding: 13px 18px;
            }

            .kitten-portrait {
                position: absolute;
                width: 92px;
                height: 92px;
                margin: 0;
                transform: translate(-245px, -18px);
            }

            .guide-card h2,
            .result-card h2 {
                font-size: 27px;
            }

            .guide-card p {
                font-size: 14px;
                line-height: 1.45;
            }

            .result-screen {
                padding-top: max(52px, calc(env(safe-area-inset-top) + 42px));
            }

            .result-score {
                font-size: 55px;
            }
        }

        @media (max-width: 370px) {
            .title-logo {
                width: 97vw;
            }

            .title-menu {
                width: 98vw;
                gap: 5px;
            }

            .title-button {
                min-height: 42px;
                padding: 6px 2px;
                font-size: 13px;
            }

            .start-button {
                min-height: 47px;
                font-size: 17px;
            }

            .title-link {
                min-height: 42px;
                padding: 5px 2px;
                font-size: 10px;
            }

            .hud {
                grid-template-columns: 76px 1fr 70px;
                gap: 5px;
            }

            .hud-rule {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <button class="sound-button" id="sound-button" type="button" aria-label="音を切り替える" aria-pressed="true">🔊</button>
    <img id="pom-sprite" src="assets/pom-pom-white-v1.png" alt="" hidden>

    <section class="screen title-screen" id="screen-title" aria-labelledby="game-title">
        <img class="title-art" src="assets/koneko-yarn-title-v2.png" alt="">
        <div class="title-shade" aria-hidden="true"></div>

        <div class="title-best">
            さいこうタイム
            <strong id="title-best">--.-びょう</strong>
        </div>

        <div class="title-logo">
            <h1 class="sr-only" id="game-title">こねこと けいとあそび このいっぽん！</h1>
            <img class="title-logo-art" src="assets/title-logo-yarn-v1.png" alt="" aria-hidden="true">
        </div>

        <div class="title-menu">
            <button class="title-button practice-button" id="practice-button" type="button">れんしゅう</button>
            <button class="title-button training-button" id="training-button" type="button">とっくん</button>
            <button class="title-button start-button" id="start-button" type="button">
                スタート
                <small>10ぽん タイムアタック</small>
            </button>
            <a class="title-link" href="../../index.html">ゲームパークへ もどる</a>
        </div>

        <div class="training-picker" id="training-picker" hidden>
            <div class="training-card" role="dialog" aria-modal="true" aria-labelledby="training-heading">
                <h2 id="training-heading">とっくんニャ！</h2>
                <p>からまりの ほんすうを えらぶニャ</p>
                <div class="training-options">
                    <button class="training-choice" type="button" data-count="3">3ぼん</button>
                    <button class="training-choice" type="button" data-count="4">4ほん</button>
                    <button class="training-choice" type="button" data-count="5">5ほん</button>
                    <button class="training-choice" type="button" data-count="6">6ぽん</button>
                </div>
                <button class="training-close" id="training-close" type="button">もどる</button>
            </div>
        </div>
    </section>

    <section class="screen game-screen" id="screen-game" aria-label="ゲーム画面" hidden>
        <header class="hud">
            <div class="hud-card">
                <span id="score-label">みつけたニャ！</span>
                <strong id="score-display">0ほん</strong>
            </div>
            <div class="hud-rule" id="hud-rule">おなじいろを つなぐ けいとを タッチするニャ！</div>
            <button class="exit-button" id="exit-button" type="button">やめる</button>
        </header>

        <main class="play-area" id="play-area">
            <div class="workshop" aria-hidden="true"></div>
            <canvas id="yarn-canvas" role="img" aria-label="絡まった毛糸。左右で同じ色のポンポンをつなぐ毛糸を探します"></canvas>
            <div class="difficulty-chip" id="difficulty-chip">けいと 3ぼん</div>
            <div class="feedback" id="feedback" aria-hidden="true">みつけたニャ！</div>

            <div class="overlay" id="guide-overlay" hidden>
                <div class="guide-card" id="guide-card">
                    <div class="kitten-portrait" role="img" aria-label="毛糸屋さんのこねこ"></div>
                    <h2 id="guide-heading">れんしゅうニャ！</h2>
                    <p id="guide-copy">
                        <span class="meaning-line">ポンポンから けいとを</span>
                        <span class="meaning-line">ゆっくり たどるニャ。</span>
                        <span class="meaning-line"><b>おなじいろ</b>に つながる いっぽんを</span>
                        <span class="meaning-line">タッチするニャ！</span>
                    </p>
                    <button class="guide-button" id="guide-button" type="button">わかったニャ！</button>
                </div>
                <div class="countdown" id="countdown" hidden>3</div>
            </div>
        </main>
    </section>

    <section class="screen result-screen" id="screen-result" aria-labelledby="result-heading" hidden>
        <div class="result-card">
            <div class="kitten-portrait" role="img" aria-label="毛糸屋さんのこねこ"></div>
            <h2 id="result-heading">10ぽん みつけたニャ！</h2>
            <div class="result-score-label">かかった じかん</div>
            <div class="result-score"><span id="result-score">0.0</span><small>びょう</small></div>
            <div class="result-best" id="result-best">さいこう：--.-びょう</div>
            <div class="result-actions">
                <button class="result-button" id="retry-button" type="button">もういちどニャ！</button>
                <button class="result-button result-title-button" id="result-title-button" type="button">タイトルへ</button>
            </div>
        </div>
    </section>

    <script>
        (() => {
            "use strict";

            const COLORS = [
                { fill: "#ef5d55", dark: "#a93236", light: "#ffb1a6", name: "あか" },
                { fill: "#3e9fe6", dark: "#1762a1", light: "#a6d9ff", name: "あお" },
                { fill: "#f3bd32", dark: "#a96d10", light: "#ffe68b", name: "きいろ" },
                { fill: "#65b84f", dark: "#347c35", light: "#b9e89e", name: "みどり" },
                { fill: "#9b68d5", dark: "#653b9a", light: "#d8b9f5", name: "むらさき" },
                { fill: "#ee79ad", dark: "#a83a6f", light: "#ffc0db", name: "ピンク" },
                { fill: "#32bdc1", dark: "#177b84", light: "#a5f0eb", name: "みずいろ" }
            ];
            const BEST_KEY = "rope_yarn_best_time_v2";
            const CHALLENGE_COUNTS = [3, 3, 4, 4, 5, 5, 6, 6, 7, 7];
            const PRACTICE_COUNTS = [3, 3, 4];

            const elements = {
                title: document.querySelector("#screen-title"),
                game: document.querySelector("#screen-game"),
                result: document.querySelector("#screen-result"),
                sound: document.querySelector("#sound-button"),
                pomSprite: document.querySelector("#pom-sprite"),
                titleBest: document.querySelector("#title-best"),
                practice: document.querySelector("#practice-button"),
                training: document.querySelector("#training-button"),
                trainingPicker: document.querySelector("#training-picker"),
                trainingChoices: [...document.querySelectorAll(".training-choice")],
                trainingClose: document.querySelector("#training-close"),
                start: document.querySelector("#start-button"),
                exit: document.querySelector("#exit-button"),
                playArea: document.querySelector("#play-area"),
                canvas: document.querySelector("#yarn-canvas"),
                scoreLabel: document.querySelector("#score-label"),
                score: document.querySelector("#score-display"),
                hudRule: document.querySelector("#hud-rule"),
                difficulty: document.querySelector("#difficulty-chip"),
                feedback: document.querySelector("#feedback"),
                guide: document.querySelector("#guide-overlay"),
                guideCard: document.querySelector("#guide-card"),
                guideHeading: document.querySelector("#guide-heading"),
                guideCopy: document.querySelector("#guide-copy"),
                guideButton: document.querySelector("#guide-button"),
                countdown: document.querySelector("#countdown"),
                resultScore: document.querySelector("#result-score"),
                resultBest: document.querySelector("#result-best"),
                retry: document.querySelector("#retry-button"),
                resultTitle: document.querySelector("#result-title-button")
            };

            const context = elements.canvas.getContext("2d");
            const pomCache = new Map();
            const state = {
                screen: "title",
                mode: "practice",
                playing: false,
                locked: true,
                soundOn: true,
                audioContext: null,
                score: 0,
                practiceStep: 0,
                trainingCount: 3,
                puzzle: null,
                width: 0,
                height: 0,
                dpr: 1,
                startedAt: 0,
                finishedAt: 0,
                animationFrame: null,
                timers: [],
                resizeTimer: null
            };

            function schedule(callback, delay) {
                const timer = window.setTimeout(callback, delay);
                state.timers.push(timer);
                return timer;
            }

            function clearTimers() {
                state.timers.forEach(window.clearTimeout);
                state.timers = [];
                if (state.animationFrame !== null) {
                    cancelAnimationFrame(state.animationFrame);
                    state.animationFrame = null;
                }
            }

            function showScreen(name) {
                elements.title.hidden = name !== "title";
                elements.game.hidden = name !== "game";
                elements.result.hidden = name !== "result";
                elements.sound.hidden = name === "game";
                state.screen = name;
            }

            function readBest() {
                const value = Number(localStorage.getItem(BEST_KEY));
                return Number.isFinite(value) && value > 0 ? value : 0;
            }

            function formatSeconds(milliseconds) {
                return (Math.max(0, milliseconds) / 1000).toFixed(1);
            }

            function formatYarnCount(count) {
                const lastDigit = Math.abs(count) % 10;
                const suffix = lastDigit === 3
                    ? "ぼん"
                    : [0, 1, 6, 8].includes(lastDigit)
                        ? "ぽん"
                        : "ほん";
                return `${count}${suffix}`;
            }

            function updateBest() {
                const best = readBest();
                elements.titleBest.textContent = best
                    ? `${formatSeconds(best)}びょう`
                    : "--.-びょう";
            }

            function saveBest(elapsed) {
                const previous = readBest();
                const isNew = previous === 0 || elapsed < previous;
                if (isNew) localStorage.setItem(BEST_KEY, String(elapsed));
                return { previous, isNew };
            }

            function initAudio() {
                if (!state.soundOn) return null;
                if (!state.audioContext) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) state.audioContext = new AudioContext();
                }
                if (state.audioContext?.state === "suspended") state.audioContext.resume();
                return state.audioContext;
            }

            function playSound(kind) {
                const audio = initAudio();
                if (!audio) return;
                const now = audio.currentTime;
                const notes = kind === "correct"
                    ? [659.25, 783.99, 987.77]
                    : kind === "finish"
                        ? [523.25, 659.25, 783.99, 1046.5]
                        : [185];

                notes.forEach((frequency, index) => {
                    const oscillator = audio.createOscillator();
                    const gain = audio.createGain();
                    oscillator.connect(gain);
                    gain.connect(audio.destination);
                    oscillator.type = kind === "wrong" ? "square" : "sine";
                    oscillator.frequency.setValueAtTime(frequency, now);
                    const start = now + index * (kind === "finish" ? 0.11 : 0.065);
                    const duration = kind === "wrong" ? 0.12 : 0.18;
                    gain.gain.setValueAtTime(kind === "wrong" ? 0.08 : 0.15, start);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
                    oscillator.start(start);
                    oscillator.stop(start + duration + 0.02);
                });
            }

            function shuffle(items) {
                for (let index = items.length - 1; index > 0; index -= 1) {
                    const other = Math.floor(Math.random() * (index + 1));
                    [items[index], items[other]] = [items[other], items[index]];
                }
                return items;
            }

            function makeDerangement(count, fixedIndex) {
                const mapping = Array.from({ length: count }, (_, index) => index);
                const others = mapping.filter((_, index) => index !== fixedIndex);
                let shuffled = [...others];
                let attempts = 0;
                do {
                    shuffled = shuffle([...others]);
                    attempts += 1;
                } while (shuffled.some((value, index) => value === others[index]) && attempts < 80);
                if (shuffled.some((value, index) => value === others[index])) {
                    shuffled = [...others.slice(1), others[0]];
                }
                others.forEach((ropeIndex, index) => {
                    mapping[ropeIndex] = shuffled[index];
                });
                return mapping;
            }

            function everyRopeCrosses(order) {
                return order.every((endSlot, ropeIndex) => (
                    order.some((otherEndSlot, otherIndex) => (
                        ropeIndex !== otherIndex &&
                        (ropeIndex - otherIndex) * (endSlot - otherEndSlot) < 0
                    ))
                ));
            }

            function makeDestinationOrder(count, tangle) {
                const reversed = Array.from({ length: count }, (_, index) => count - index - 1);
                if (!tangle) return reversed;

                for (let attempt = 0; attempt < 80; attempt += 1) {
                    const candidate = shuffle(Array.from({ length: count }, (_, index) => index));
                    if (everyRopeCrosses(candidate)) return candidate;
                }

                return reversed;
            }

            function ropesCross(firstIndex, secondIndex, destinationOrder) {
                return (
                    (firstIndex - secondIndex) *
                    (destinationOrder[firstIndex] - destinationOrder[secondIndex]) < 0
                );
            }

            function makeDrawOrder(count, correctIndex, destinationOrder) {
                const drawOrder = shuffle(Array.from({ length: count }, (_, index) => index));
                const crossingPartners = drawOrder.filter((ropeIndex) => (
                    ropeIndex !== correctIndex &&
                    ropesCross(correctIndex, ropeIndex, destinationOrder)
                ));
                const correctPosition = drawOrder.indexOf(correctIndex);
                const hasCoveringPartner = crossingPartners.some((ropeIndex) => (
                    drawOrder.indexOf(ropeIndex) > correctPosition
                ));

                if (!hasCoveringPartner) {
                    const coveringPartner = crossingPartners[
                        Math.floor(Math.random() * crossingPartners.length)
                    ];
                    drawOrder.splice(drawOrder.indexOf(coveringPartner), 1);
                    drawOrder.push(coveringPartner);
                }

                return drawOrder;
            }

            function createPuzzle(count, options = {}) {
                const correctIndex = Math.floor(Math.random() * count);
                const colorIndices = shuffle(Array.from({ length: COLORS.length }, (_, index) => index)).slice(0, count);
                const localColorMap = makeDerangement(count, correctIndex);
                const endColorIndices = localColorMap.map((mappedIndex) => colorIndices[mappedIndex]);
                const destinationOrder = makeDestinationOrder(count, options.tangle !== false);
                const ropes = Array.from({ length: count }, (_, index) => {
                    const wave = options.easy
                        ? 0.02
                        : (Math.random() - 0.5) * 0.14;
                    return {
                        index,
                        startSlot: index,
                        endSlot: destinationOrder[index],
                        startColor: colorIndices[index],
                        endColor: endColorIndices[index],
                        correct: index === correctIndex,
                        bend1: Math.max(0.12, Math.min(0.88, (index + 0.5) / count + wave)),
                        bend2: Math.max(0.12, Math.min(0.88, (destinationOrder[index] + 0.5) / count - wave)),
                        samples: [],
                        state: "normal"
                    };
                });

                return {
                    count,
                    correctIndex,
                    ropes,
                    drawOrder: makeDrawOrder(count, correctIndex, destinationOrder),
                    highlightEndpoints: Boolean(options.highlightEndpoints)
                };
            }

            function cubicPoint(p0, p1, p2, p3, t) {
                const mt = 1 - t;
                const a = mt * mt * mt;
                const b = 3 * mt * mt * t;
                const c = 3 * mt * t * t;
                const d = t * t * t;
                return {
                    x: a * p0.x + b * p1.x + c * p2.x + d * p3.x,
                    y: a * p0.y + b * p1.y + c * p2.y + d * p3.y
                };
            }

            function buildGeometry() {
                if (!state.puzzle || state.width <= 0 || state.height <= 0) return;
                const width = state.width;
                const height = state.height;
                const count = state.puzzle.count;
                const side = Math.max(42, Math.min(72, width * 0.075));
                const top = Math.max(64, height * 0.13);
                const bottom = Math.max(38, height * 0.1);
                const usable = Math.max(80, height - top - bottom);

                state.puzzle.ropes.forEach((rope) => {
                    const startY = top + usable * ((rope.startSlot + 0.5) / count);
                    const endY = top + usable * ((rope.endSlot + 0.5) / count);
                    const p0 = { x: side, y: startY };
                    const p3 = { x: width - side, y: endY };
                    const p1 = {
                        x: width * 0.34,
                        y: top + usable * rope.bend1
                    };
                    const p2 = {
                        x: width * 0.66,
                        y: top + usable * rope.bend2
                    };
                    rope.points = { p0, p1, p2, p3 };
                    rope.samples = [];
                    for (let step = 0; step <= 72; step += 1) {
                        rope.samples.push(cubicPoint(p0, p1, p2, p3, step / 72));
                    }
                });
            }

            function traceRope(rope) {
                const { p0, p1, p2, p3 } = rope.points;
                context.beginPath();
                context.moveTo(p0.x, p0.y);
                context.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
            }

            function drawYarn(rope) {
                const isGood = rope.state === "good";
                const isBad = rope.state === "bad";
                const separator = Math.max(18, Math.min(25, state.width * 0.025));
                const outer = Math.max(13, Math.min(18, state.width * 0.018));
                const inner = Math.max(8, Math.min(12, state.width * 0.012));

                context.save();
                context.lineCap = "round";
                context.lineJoin = "round";

                traceRope(rope);
                context.strokeStyle = "rgba(255, 250, 236, 0.96)";
                context.lineWidth = separator;
                context.stroke();

                traceRope(rope);
                context.strokeStyle = isGood ? "#1f8f79" : isBad ? "#b83f42" : "#9a704c";
                context.lineWidth = outer;
                context.shadowColor = "rgba(84, 52, 33, 0.2)";
                context.shadowBlur = 5;
                context.shadowOffsetY = 3;
                context.stroke();

                context.shadowColor = "transparent";
                context.shadowBlur = 0;
                context.shadowOffsetY = 0;
                traceRope(rope);
                context.strokeStyle = isGood ? "#63d5b6" : isBad ? "#f0716c" : "#f3d5a1";
                context.lineWidth = inner;
                context.stroke();

                traceRope(rope);
                context.strokeStyle = isGood
                    ? "rgba(255,255,255,0.8)"
                    : "rgba(255,255,255,0.52)";
                context.lineWidth = Math.max(1.5, inner * 0.17);
                context.setLineDash([4, 6]);
                context.lineDashOffset = 1;
                context.stroke();
                context.setLineDash([]);
                context.restore();
            }

            function getColoredPom(tint) {
                if (!elements.pomSprite.complete || !elements.pomSprite.naturalWidth) return null;
                if (pomCache.has(tint)) return pomCache.get(tint);

                const sprite = document.createElement("canvas");
                const spriteContext = sprite.getContext("2d");
                sprite.width = 256;
                sprite.height = 256;
                spriteContext.drawImage(elements.pomSprite, 5, 5, 246, 246);
                spriteContext.globalCompositeOperation = "multiply";
                spriteContext.fillStyle = tint;
                spriteContext.fillRect(0, 0, 256, 256);
                spriteContext.globalCompositeOperation = "destination-in";
                spriteContext.drawImage(elements.pomSprite, 5, 5, 246, 246);
                spriteContext.globalCompositeOperation = "source-over";
                pomCache.set(tint, sprite);
                return sprite;
            }

            function drawFallbackPom(point, palette, radius, stateName) {
                const gradient = context.createRadialGradient(
                    point.x - radius * 0.32,
                    point.y - radius * 0.38,
                    radius * 0.12,
                    point.x,
                    point.y,
                    radius
                );
                gradient.addColorStop(0, palette.light);
                gradient.addColorStop(0.45, stateName === "bad" ? "#f0716c" : palette.fill);
                gradient.addColorStop(1, stateName === "bad" ? "#a92e37" : palette.dark);
                context.fillStyle = gradient;
                context.beginPath();
                context.arc(point.x, point.y, radius, 0, Math.PI * 2);
                context.fill();
            }

            function drawPom(point, colorIndex, highlighted, stateName) {
                const palette = COLORS[colorIndex];
                const radius = Math.max(18, Math.min(28, state.width * 0.033));
                context.save();

                if (highlighted) {
                    context.beginPath();
                    context.arc(point.x, point.y, radius + 10, 0, Math.PI * 2);
                    context.strokeStyle = "#fff25d";
                    context.lineWidth = 6;
                    context.shadowColor = "#ffe746";
                    context.shadowBlur = 12;
                    context.stroke();
                }

                context.shadowColor = "rgba(72, 43, 27, 0.28)";
                context.shadowBlur = 8;
                context.shadowOffsetY = 5;
                const tint = stateName === "bad" ? "#e85f5c" : palette.fill;
                const sprite = getColoredPom(tint);
                if (sprite) {
                    const size = radius * 2.62;
                    context.drawImage(sprite, point.x - size / 2, point.y - size / 2, size, size);
                } else {
                    drawFallbackPom(point, palette, radius, stateName);
                }
                context.restore();
            }

            function drawPuzzle() {
                const { width, height, dpr } = state;
                context.setTransform(dpr, 0, 0, dpr, 0, 0);
                context.clearRect(0, 0, width, height);
                if (!state.puzzle) return;

                state.puzzle.drawOrder.forEach((ropeIndex) => {
                    drawYarn(state.puzzle.ropes[ropeIndex]);
                });

                state.puzzle.ropes.forEach((rope) => {
                    const highlighted = state.puzzle.highlightEndpoints && rope.correct;
                    drawPom(rope.points.p0, rope.startColor, highlighted, rope.state);
                    drawPom(rope.points.p3, rope.endColor, highlighted, rope.state);
                });
            }

            function resizeCanvas() {
                const rect = elements.playArea.getBoundingClientRect();
                const width = Math.max(1, Math.round(rect.width));
                const height = Math.max(1, Math.round(rect.height));
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                if (width === state.width && height === state.height && dpr === state.dpr) return;
                state.width = width;
                state.height = height;
                state.dpr = dpr;
                elements.canvas.width = Math.round(width * dpr);
                elements.canvas.height = Math.round(height * dpr);
                buildGeometry();
                drawPuzzle();
            }

            function setPuzzle(count, options = {}) {
                state.puzzle = createPuzzle(count, options);
                elements.difficulty.textContent = `けいと ${formatYarnCount(count)}`;
                buildGeometry();
                drawPuzzle();
            }

            function distanceToSegment(point, start, end) {
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                const lengthSq = dx * dx + dy * dy;
                if (lengthSq === 0) return Math.hypot(point.x - start.x, point.y - start.y);
                const t = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / lengthSq));
                const x = start.x + t * dx;
                const y = start.y + t * dy;
                return Math.hypot(point.x - x, point.y - y);
            }

            function findHitRope(point) {
                if (!state.puzzle) return null;
                const tolerance = Math.max(22, Math.min(33, state.width * 0.032));
                let winner = null;
                let bestDistance = tolerance;
                state.puzzle.drawOrder.forEach((ropeIndex) => {
                    const rope = state.puzzle.ropes[ropeIndex];
                    for (let index = 1; index < rope.samples.length; index += 1) {
                        const distance = distanceToSegment(point, rope.samples[index - 1], rope.samples[index]);
                        if (distance <= bestDistance) {
                            bestDistance = distance;
                            winner = rope;
                        }
                    }
                });
                return winner;
            }

            function showFeedback(text, good = false) {
                elements.feedback.textContent = text;
                elements.feedback.classList.remove("show", "good");
                if (good) elements.feedback.classList.add("good");
                void elements.feedback.offsetWidth;
                elements.feedback.classList.add("show");
            }

            function nextChallengePuzzle() {
                const count = CHALLENGE_COUNTS[state.score];
                setPuzzle(count, { tangle: true });
                state.locked = false;
            }

            function nextTrainingPuzzle() {
                setPuzzle(state.trainingCount, { tangle: true });
                elements.difficulty.textContent = `とっくん ${formatYarnCount(state.trainingCount)}`;
                state.locked = false;
            }

            function nextPracticePuzzle() {
                const count = PRACTICE_COUNTS[state.practiceStep];
                setPuzzle(count, {
                    easy: state.practiceStep === 0,
                    tangle: state.practiceStep !== 0,
                    highlightEndpoints: state.practiceStep === 0
                });
                elements.score.textContent = `${state.practiceStep}/3`;
                elements.difficulty.textContent = `れんしゅう ${state.practiceStep + 1}/3`;
                state.locked = false;
            }

            function finishPractice() {
                state.playing = false;
                state.locked = true;
                playSound("finish");
                elements.guideHeading.textContent = "ばっちりニャ！";
                elements.guideCopy.innerHTML = '<span class="meaning-line">おなじいろを つなぐ <b>このいっぽん</b>を</span><span class="meaning-line">みつけたニャ！</span><span class="meaning-line">ほんばんも がんばるニャ！</span>';
                elements.guideButton.textContent = "スタートへ";
                elements.guideButton.dataset.action = "title";
                elements.guideCard.hidden = false;
                elements.countdown.hidden = true;
                elements.guide.hidden = false;
            }

            function handleCorrect(rope) {
                state.locked = true;
                rope.state = "good";
                drawPuzzle();
                playSound("correct");
                showFeedback(state.mode === "practice" ? "できたニャ！" : "みつけたニャ！", true);

                if (state.mode === "practice") {
                    state.practiceStep += 1;
                    elements.score.textContent = `${state.practiceStep}/3`;
                    if (state.practiceStep >= PRACTICE_COUNTS.length) {
                        schedule(finishPractice, 720);
                    } else {
                        schedule(nextPracticePuzzle, 720);
                    }
                    return;
                }

                state.score += 1;
                if (state.mode === "training") {
                    elements.score.textContent = formatYarnCount(state.score);
                    schedule(nextTrainingPuzzle, 560);
                    return;
                }

                elements.score.textContent = `${state.score}/10ほん`;
                if (state.score >= CHALLENGE_COUNTS.length) {
                    state.finishedAt = performance.now();
                    state.playing = false;
                    if (state.animationFrame !== null) {
                        cancelAnimationFrame(state.animationFrame);
                        state.animationFrame = null;
                    }
                    schedule(finishChallenge, 720);
                    return;
                }
                schedule(nextChallengePuzzle, 560);
            }

            function handleWrong(rope) {
                state.locked = true;
                rope.state = "bad";
                drawPuzzle();
                playSound("wrong");
                showFeedback(state.mode === "practice" ? "ちがうニャ！" : "もういちどニャ！");
                schedule(() => {
                    rope.state = "normal";
                    drawPuzzle();
                    state.locked = false;
                }, 480);
            }

            function handleCanvasPointer(event) {
                event.preventDefault();
                if (!state.playing || state.locked) return;
                const rect = elements.canvas.getBoundingClientRect();
                const point = {
                    x: event.clientX - rect.left,
                    y: event.clientY - rect.top
                };
                const rope = findHitRope(point);
                if (!rope) {
                    showFeedback("けいとを タッチするニャ！");
                    return;
                }
                if (rope.correct) handleCorrect(rope);
                else handleWrong(rope);
            }

            function startCountdown(callback) {
                elements.guide.hidden = false;
                elements.guideCard.hidden = true;
                elements.countdown.hidden = false;
                elements.countdown.textContent = "3";
                ["2", "1", "スタートニャ！"].forEach((text, index) => {
                    schedule(() => {
                        elements.countdown.textContent = text;
                        elements.countdown.style.fontSize = text.includes("スタート") ? "min(17vw, 96px)" : "";
                    }, (index + 1) * 650);
                });
                schedule(() => {
                    elements.countdown.hidden = true;
                    elements.countdown.style.fontSize = "";
                    elements.guideCard.hidden = false;
                    elements.guide.hidden = true;
                    callback();
                }, 2600);
            }

            function challengeLoop(now) {
                if (!state.playing || state.mode !== "challenge") return;
                const elapsed = Math.max(0, now - state.startedAt);
                elements.scoreLabel.textContent = `${formatSeconds(elapsed)}びょう`;
                state.animationFrame = requestAnimationFrame(challengeLoop);
            }

            function beginChallenge() {
                state.playing = true;
                state.locked = false;
                state.startedAt = performance.now();
                state.finishedAt = 0;
                state.animationFrame = requestAnimationFrame(challengeLoop);
            }

            function resetGame(mode) {
                clearTimers();
                initAudio();
                state.mode = mode;
                state.score = 0;
                state.practiceStep = 0;
                state.finishedAt = 0;
                state.playing = false;
                state.locked = true;
                elements.feedback.classList.remove("show", "good");
                elements.guide.hidden = true;
                elements.guideCard.hidden = false;
                elements.countdown.hidden = true;
                showScreen("game");
                requestAnimationFrame(() => {
                    resizeCanvas();
                    if (mode === "practice") nextPracticePuzzle();
                    else if (mode === "training") nextTrainingPuzzle();
                    else nextChallengePuzzle();
                });
            }

            function startPractice() {
                resetGame("practice");
                elements.scoreLabel.textContent = "できたニャ！";
                elements.score.textContent = "0/3";
                elements.hudRule.textContent = "おなじいろを つなぐ けいとを タッチするニャ！";
                elements.guideHeading.textContent = "れんしゅうニャ！";
                elements.guideCopy.innerHTML = '<span class="meaning-line">ポンポンから けいとを</span><span class="meaning-line">ゆっくり たどるニャ。</span><span class="meaning-line"><b>おなじいろ</b>に つながる いっぽんを</span><span class="meaning-line">タッチするニャ！</span>';
                elements.guideButton.textContent = "わかったニャ！";
                elements.guideButton.dataset.action = "practice";
                elements.guide.hidden = false;
            }

            function openTrainingPicker() {
                initAudio();
                elements.trainingPicker.hidden = false;
            }

            function closeTrainingPicker() {
                elements.trainingPicker.hidden = true;
            }

            function startTraining(count) {
                state.trainingCount = count;
                closeTrainingPicker();
                resetGame("training");
                elements.scoreLabel.textContent = `${formatYarnCount(count)} とっくん`;
                elements.score.textContent = "0ほん";
                elements.hudRule.textContent = `${formatYarnCount(count)}の からまりを ひたすら とくニャ！`;
                state.playing = true;
            }

            function startChallenge() {
                resetGame("challenge");
                elements.scoreLabel.textContent = "0.0びょう";
                elements.score.textContent = "0/10ほん";
                elements.hudRule.textContent = "おなじいろを つなぐ けいとを タッチするニャ！";
                startCountdown(beginChallenge);
            }

            function finishChallenge() {
                state.playing = false;
                state.locked = true;
                if (state.animationFrame !== null) {
                    cancelAnimationFrame(state.animationFrame);
                    state.animationFrame = null;
                }
                playSound("finish");
                const elapsed = Math.max(0, state.finishedAt - state.startedAt);
                const record = saveBest(elapsed);
                elements.resultScore.textContent = formatSeconds(elapsed);
                elements.resultBest.classList.toggle("new", record.isNew);
                elements.resultBest.textContent = record.isNew
                    ? "🏆 さいこうタイムニャ！"
                    : `さいこう：${formatSeconds(record.previous)}びょう`;
                updateBest();
                showScreen("result");
            }

            function returnToTitle() {
                clearTimers();
                state.playing = false;
                state.locked = true;
                state.puzzle = null;
                context.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
                elements.guide.hidden = true;
                closeTrainingPicker();
                updateBest();
                showScreen("title");
            }

            elements.practice.addEventListener("click", startPractice);
            elements.training.addEventListener("click", openTrainingPicker);
            elements.trainingClose.addEventListener("click", closeTrainingPicker);
            elements.trainingChoices.forEach((button) => {
                button.addEventListener("click", () => {
                    startTraining(Number(button.dataset.count));
                });
            });
            elements.start.addEventListener("click", startChallenge);
            elements.exit.addEventListener("click", returnToTitle);
            elements.canvas.addEventListener("pointerdown", handleCanvasPointer);
            elements.pomSprite.addEventListener("load", () => {
                pomCache.clear();
                drawPuzzle();
            });
            elements.guideButton.addEventListener("click", () => {
                initAudio();
                if (elements.guideButton.dataset.action === "title") {
                    returnToTitle();
                    return;
                }
                elements.guide.hidden = true;
                state.playing = true;
                state.locked = false;
            });
            elements.retry.addEventListener("click", startChallenge);
            elements.resultTitle.addEventListener("click", returnToTitle);
            elements.sound.addEventListener("click", () => {
                state.soundOn = !state.soundOn;
                elements.sound.textContent = state.soundOn ? "🔊" : "🔇";
                elements.sound.setAttribute("aria-pressed", String(state.soundOn));
                if (state.soundOn) playSound("correct");
            });

            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape" && !elements.trainingPicker.hidden) {
                    closeTrainingPicker();
                }
            });

            window.addEventListener("resize", () => {
                window.clearTimeout(state.resizeTimer);
                state.resizeTimer = window.setTimeout(resizeCanvas, 120);
            });

            updateBest();
            showScreen("title");
        })();
    </script>
</body>
</html>
