<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="../"><title>みんなで あんざんヒーロー</title><link rel="icon" href="assets/rangers/red-guide.webp"><link rel="stylesheet" href="effects.css"><link rel="stylesheet" href="finishers.css"><link rel="stylesheet" href="online/style.css"></head><body>
<main>
<header><h1>みんなで あんざんヒーロー</h1><button id="sound">おと OFF</button><button id="exit">きちへ もどる</button></header>
<p id="notice" role="status">最大6人で、ひとつの敵にたちむかおう！</p>
<section id="entry" class="card"><h2>へやに あつまろう</h2><p>盾はみんなで5つ。1問は最大10秒。時間切れのダメージはないよ。</p><button id="create">へやを つくる</button><form id="joinForm"><label>4けたの番号 <input id="code" maxlength="4" inputmode="numeric" autocomplete="off"></label><button>へやに はいる</button></form></section>
<section id="lobby" class="card" hidden><h2>へや <strong id="roomCode"></strong></h2><div class="invite"><button id="copy">参加リンクをコピー</button><button id="qrButton">QRコード</button><div id="qr" hidden></div></div><div id="settings"><label>コース <select id="course"></select></label><label>あそびかた <select id="mode"><option value="normal">計算</option><option value="vision">ビジョン</option></select></label><label>あいて <select id="enemy"></select></label><p id="enemyNote"></p></div><div class="equipment"><label>よびな <input id="nickname" maxlength="8" value="ヒーロー"></label><label>ヒーロー <select id="hero"></select></label><div id="equipment"></div></div><div id="roster"></div><button id="ready">じゅんび OK</button><button id="start">みんなで スタート</button><p id="waiting"></p></section>
<section id="battle" hidden><div class="hud"><b id="round"></b><b id="timer"></b><b id="shield"></b><span id="answered"></span></div><div class="arena"><div class="enemy-heading"><b id="enemyName"></b><progress id="hp" value="1" max="1"></progress><span id="hpText"></span></div><div id="sprite"></div><div id="team"></div><div id="attackNames" aria-live="polite"></div></div><div class="question-card"><b id="equation"></b><span id="digits"></span><p id="feedback" role="status"></p><b id="combo"></b><div id="answers"></div></div><div id="hostControls"><button id="pause">いったん とめる</button><button id="abort">バトルを中断</button></div></section>
<section id="result" class="card" hidden><h2 id="resultTitle"></h2><p id="teamResult"></p><p id="myResult"></p><p id="reward"></p><button id="again">もういちど</button></section>
</main><script src="core.js"></script><script src="game-model.js"></script><script src="effects.js"></script><script src="finishers.js"></script><script type="module" src="online/main.js"></script></body></html>
