<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SPEED COUNT! クラシック</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; overflow: hidden;
            background-color: #000; color: #fff;
            touch-action: none;
            font-family: 'Roboto Mono', monospace;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; }
        #ui-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        #top-panel {
            width: 100%; padding: 10px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            pointer-events: none; z-index: 5;
        }
        #bottom-panel {
            width: 100%; padding: 0 20px;
            background: rgba(0,0,0,0.9); border-top: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
            pointer-events: auto; z-index: 100;
            height: 80px; position: absolute; bottom: 0;
        }
        .screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: rgba(0,0,0,0.92); backdrop-filter: blur(5px);
            z-index: 200; pointer-events: auto; overflow-y: auto;
        }
        .hidden { display: none !important; pointer-events: none; }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 6vw !important; font-weight: 900 !important;
            text-transform: uppercase; letter-spacing: -0.05em;
            margin: 0 0 16px 0;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; line-height: 1.2 !important;
            width: 100%; display: block;
        }
        button {
            background: #fff; color: #000; border: none;
            font-family: 'Roboto Mono', monospace; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
            line-break: strict;
            overflow-wrap: normal;
            word-break: keep-all;
        }
        .menu-btn {
            padding: 10px 40px; font-size: 1.0rem; letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            clip-path: polygon(5% 0, 100% 0, 100% 90%, 95% 100%, 0 100%, 0 10%);
            margin: 5px; min-width: 260px;
            display: flex; flex-direction: column; align-items: center;
        }
        .menu-btn:hover { transform: scale(1.05); z-index: 10; }
        .sel-btn {
            padding: 8px 16px; font-size: 0.95rem;
            background: #333; color: #888; border: 2px solid #555; border-radius: 8px;
            min-width: 68px; font-family: 'Roboto Mono', monospace;
            font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .sel-btn.active {
            background: #fff; color: #000; border-color: #fff;
            box-shadow: 0 0 15px rgba(255,255,255,0.5); transform: scale(1.1);
        }
        #quit-btn {
            padding: 8px 20px; font-size: 0.95rem;
            background: rgba(255,50,50,0.8); color: #fff;
            border-radius: 4px; min-width: 76px; text-align: center;
            font-family: 'Roboto Mono', monospace; font-weight: bold;
        }
        #quit-btn:hover { background: #ff4444; box-shadow: 0 0 10px rgba(255,50,50,0.5); }
        #score-area { text-align: right; font-size: 0.9rem; color: #aaa; min-width: 120px; }
        .best-title { font-size: 0.65rem; color: #666; margin-bottom: 2px; }
        .score-list { display: flex; gap: 12px; justify-content: flex-end; }
        .score-item { font-family: 'Roboto Mono', monospace; }
        .score-rank { color: #00ff88; margin-right: 3px; font-size: 0.8rem; }
        .score-time { color: #fff; font-weight: bold; }
        #timer-display {
            font-size: 2.5rem; font-weight: bold; color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
            flex-grow: 1; text-align: center; line-height: 1;
        }
        #progress-bar {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 2px; width: 100%; max-width: 920px; margin: 0 auto;
        }
        .progress-item {
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #444; border-radius: 2px;
            color: #666; background: rgba(0,0,0,0.5);
        }
        .progress-item.done { background: #00ff88; color: #000; border-color: #00ff88; box-shadow: 0 0 5px #00ff88; }
        .progress-item.current {
            background: #fff; color: #000; border-color: #fff;
            transform: scale(1.2); font-weight: bold; box-shadow: 0 0 10px #fff; z-index: 5;
        }
        .mode-desc { font-size: 0.68rem; font-weight: normal; display: block; margin-top: 2px; opacity: 0.8; line-break: strict; overflow-wrap: normal; word-break: keep-all; }
        .section-label { font-size: 0.75rem; color: #888; font-weight: bold; letter-spacing: 1px; margin-bottom: 6px; margin-top: 4px; line-break: strict; overflow-wrap: normal; word-break: keep-all; }
        .selector-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
        /* Result screen */
        .result-btns { display: flex; gap: 15px; margin-top: 24px; flex-wrap: wrap; justify-content: center; }
        #best-comparison { margin-top: 8px; font-size: 1.05rem; min-height: 2.2em; text-align: center; }
        .new-record { color: #ffd700; font-size: 1.35rem; text-shadow: 0 0 15px rgba(255,215,0,0.7); }
        .not-record { color: #aaa; font-size: 0.95rem; line-height: 1.6; }
        @media (max-width: 600px) {
            h1 { font-size: 10vw !important; margin-bottom: 8px; }
            .menu-btn { padding: 8px 16px; font-size: 0.82rem; min-width: 210px; margin: 3px; }
            #bottom-panel { padding: 0 10px; height: 60px; }
            #quit-btn { padding: 6px 10px; font-size: 0.8rem; min-width: 60px; }
            #score-area { font-size: 0.7rem; min-width: 60px; }
            .best-title { display: none; }
            .score-list { flex-direction: column; gap: 0; }
            #timer-display { font-size: 1.8rem; }
            .sel-btn { padding: 6px 12px; font-size: 0.85rem; min-width: 56px; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="top-panel">
        <div id="progress-bar"></div>
    </div>
    <div id="bottom-panel" class="hidden">
        <button id="quit-btn">やめる</button>
        <div id="timer-display">0.000</div>
        <div id="score-area">
            <div class="best-title">じこベスト（<span id="current-mode-name"></span>）</div>
            <div class="score-list" id="score-list"></div>
        </div>
    </div>
</div>

<!-- タイトル画面 -->
<div id="start-screen" class="screen">
    <h1>SPEED COUNT!</h1>
    <div class="flex flex-col items-center" style="padding: 0 16px;">
        <p class="section-label">もじのしゅるい</p>
        <div class="selector-row" id="type-selector">
            <button class="sel-btn active" onclick="selectContent('num', this)">すうじ</button>
            <button class="sel-btn" onclick="selectContent('alpha', this)">アルファベット</button>
            <button class="sel-btn" onclick="selectContent('hira', this)">あいうえお</button>
        </div>
        <div id="count-wrapper">
            <p class="section-label" style="text-align:center;">こすう</p>
            <div class="selector-row" id="count-selector">
                <button class="sel-btn active" onclick="selectCount(20, this)">20</button>
                <button class="sel-btn" onclick="selectCount(30, this)">30</button>
            </div>
        </div>
        <p class="section-label" style="margin-top:8px;">モードをえらぶ</p>
        <button id="start-vanish-btn" class="menu-btn" style="background:#dcfce7;color:#14532d;">
            きえるモード
            <span class="mode-desc">タップするときえる</span>
        </button>
        <button id="start-classic-btn" class="menu-btn" style="background:#ffedd5;color:#7c2d12;">
            のこるモード
            <span class="mode-desc">タップしても残る（むずかしい）</span>
        </button>
        <button id="start-move-btn" class="menu-btn" style="background:#e0f2fe;color:#0369a1;">
            うごいてきえるモード
            <span class="mode-desc">うごいてきえる（とてもむずかしい）</span>
        </button>
        <button id="start-move-classic-btn" class="menu-btn" style="background:#fce7f3;color:#be185d;">
            うごいてのこるモード
            <span class="mode-desc">うごいて残る（ちょうむずかしい）</span>
        </button>
    </div>
</div>

<!-- けっか画面 -->
<div id="result-screen" class="screen hidden">
    <h1 style="font-size:15vw !important;">クリア！</h1>
    <div style="font-size:1.1rem;color:#aaa;margin-top:16px;">タイム</div>
    <div id="final-time" style="font-size:4rem;color:#00ff88;text-shadow:0 0 20px #00ff88;font-weight:bold;">0.000</div>
    <div id="best-comparison"></div>
    <div class="result-btns">
        <button id="retry-btn" class="menu-btn">もういちど</button>
        <button id="title-btn" class="menu-btn" style="background:#ddd;">タイトルへ</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const resultScreen = document.getElementById('result-screen');
    const timerDisplay = document.getElementById('timer-display');
    const bottomPanel = document.getElementById('bottom-panel');
    const progressBar = document.getElementById('progress-bar');
    const scoreList = document.getElementById('score-list');
    const currentModeName = document.getElementById('current-mode-name');
    const countWrapper = document.getElementById('count-wrapper');

    // ───── Audio ─────
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } else if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }
    function playPopSound() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
        osc.start(t); osc.stop(t + 0.1);
    }
    function playWrongSound() {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.start(t); osc.stop(t + 0.12);
    }
    function playClearSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const t = now + i * 0.08;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.6);
            osc.start(t); osc.stop(t + 0.6);
        });
    }

    // ───── 定数 ─────
    const SAFE_AREA_TOP = 80;
    const SAFE_AREA_BOTTOM = 90;

    // ───── ゲーム変数 ─────
    let gameState = 'menu';  // menu / countdown / playing / result
    let gameMode = 'vanish';
    let contentType = 'num'; // num / alpha / hira
    let maxNumber = 20;
    let sequence = [];       // タップする順番の配列
    let numbers = [];        // 画面上のオブジェクト
    let currentTargetIdx = 0;
    let startTime = 0;
    let animationFrameId = null;
    let particles = [], ripples = [];
    let wrongFlashTimer = 0;
    let countdownValue = 3;
    let targetRadius = 35;

    // ───── キャンバスリサイズ ─────
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ───── 選択UI ─────
    window.selectContent = function(type, btn) {
        contentType = type;
        document.querySelectorAll('#type-selector .sel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        countWrapper.style.display = type === 'num' ? '' : 'none';
        updateScoreUI();
    };
    window.selectCount = function(count, btn) {
        maxNumber = count;
        document.querySelectorAll('#count-selector .sel-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateScoreUI();
    };

    // ───── シーケンス生成 ─────
    function generateSequence() {
        if (contentType === 'num') {
            sequence = Array.from({ length: maxNumber }, (_, i) => String(i + 1));
        } else if (contentType === 'alpha') {
            sequence = Array.from({ length: 26 }, (_, i) => String.fromCharCode(65 + i));
        } else {
            sequence = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
        }
    }

    // ───── アイテム（円）生成 ─────
    function generateNumbers() {
        numbers = [];
        const seqLen = sequence.length;
        const padding = 10;

        if (seqLen <= 20) targetRadius = 35;
        else if (seqLen <= 26) targetRadius = 30;
        else if (seqLen <= 30) targetRadius = 27;
        else targetRadius = 21;

        if (canvas.width < 600) {
            targetRadius = Math.max(targetRadius - 7, 14);
        }

        const minDist = targetRadius * 2 + 5;
        const speed = seqLen >= 46 ? 0.9 : 1.5;

        for (let i = 0; i < seqLen; i++) {
            let x, y, valid;
            let attempts = 0;
            do {
                valid = true;
                x = Math.random() * (canvas.width - 2 * (targetRadius + padding)) + targetRadius + padding;
                y = Math.random() * (canvas.height - SAFE_AREA_TOP - SAFE_AREA_BOTTOM - 2 * targetRadius) + targetRadius + SAFE_AREA_TOP;
                for (let n of numbers) {
                    if (Math.hypot(n.x - x, n.y - y) < minDist) { valid = false; break; }
                }
                attempts++;
                if (attempts > 2000) break;
            } while (!valid);

            numbers.push({
                value: sequence[i],
                x, y,
                vx: (Math.random() - 0.5) * 2 * speed,
                vy: (Math.random() - 0.5) * 2 * speed,
                r: targetRadius,
                cleared: false
            });
        }
    }

    // ───── スコア ─────
    function getScoreKey() {
        return `speedcount_${contentType}_${gameMode}_${sequence.length}`;
    }
    function getBestScores() {
        const d = localStorage.getItem(getScoreKey());
        return d ? JSON.parse(d) : [];
    }
    function saveScoreAndGetPrev(time) {
        const scores = getBestScores();
        const prevBest = scores.length > 0 ? scores[0] : null;
        scores.push(parseFloat(time));
        scores.sort((a, b) => a - b);
        localStorage.setItem(getScoreKey(), JSON.stringify(scores.slice(0, 3)));
        return prevBest;
    }

    const TYPE_NAMES = { num: 'すうじ', alpha: 'ABC', hira: 'あいうえお' };
    const MODE_NAMES = { vanish: 'きえる', classic: 'のこる', move: 'うごきえ', 'move-classic': 'うごのこ' };

    function updateScoreUI() {
        const scores = getBestScores();
        currentModeName.textContent = `${TYPE_NAMES[contentType]} ${MODE_NAMES[gameMode]}`;
        let html = '';
        for (let i = 0; i < 3; i++) {
            const t = scores[i] !== undefined ? scores[i].toFixed(3) : '--.---';
            html += `<div class="score-item"><span class="score-rank">${i + 1}</span><span class="score-time">${t}</span></div>`;
        }
        scoreList.innerHTML = html;
    }

    // ───── プログレスバー ─────
    function initProgressBar() {
        progressBar.innerHTML = '';
        const seqLen = sequence.length;
        let sz = 22;
        if (seqLen > 20) sz = 19;
        if (seqLen > 26) sz = 16;
        if (seqLen >= 46) sz = 12;

        for (let i = 0; i < seqLen; i++) {
            const div = document.createElement('div');
            div.className = 'progress-item';
            div.style.width = sz + 'px';
            div.style.height = sz + 'px';
            div.style.fontSize = Math.max(sz * 0.52, 7) + 'px';
            div.textContent = sequence[i];
            div.id = `prog-${i}`;
            progressBar.appendChild(div);
        }
        updateProgressBar();
    }

    function updateProgressBar() {
        for (let i = 0; i < sequence.length; i++) {
            const el = document.getElementById(`prog-${i}`);
            if (!el) continue;
            el.className = 'progress-item';
            if (i < currentTargetIdx) el.classList.add('done');
            else if (i === currentTargetIdx) el.classList.add('current');
        }
    }

    // ───── ゲーム開始（カウントダウン付き） ─────
    function startGame(mode) {
        initAudio();
        gameMode = mode;
        gameState = 'countdown';
        currentTargetIdx = 0;
        particles = []; ripples = [];
        wrongFlashTimer = 0;

        generateSequence();
        generateNumbers();
        initProgressBar();
        updateScoreUI();

        startScreen.classList.add('hidden');
        resultScreen.classList.add('hidden');
        bottomPanel.classList.remove('hidden');

        countdownValue = 3;
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
        loop();

        // 3, 2, 1 → GO! → プレイ開始
        [1000, 2000, 3000].forEach((ms, i) => {
            setTimeout(() => { countdownValue = 2 - i; }, ms);
        });
        setTimeout(() => {
            gameState = 'playing';
            startTime = Date.now();
        }, 3700);
    }

    function quitGame() {
        gameState = 'menu';
        if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
        startScreen.classList.remove('hidden');
        resultScreen.classList.add('hidden');
        bottomPanel.classList.add('hidden');
    }

    function gameClear() {
        gameState = 'result';
        playClearSound();
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(3);
        document.getElementById('final-time').textContent = elapsed;

        const prevBest = saveScoreAndGetPrev(elapsed);
        const comp = document.getElementById('best-comparison');
        if (!prevBest || parseFloat(elapsed) <= prevBest) {
            comp.innerHTML = '<span class="new-record">🏆 じこしんきろく！</span>';
        } else {
            const diff = (parseFloat(elapsed) - prevBest).toFixed(3);
            comp.innerHTML = `<span class="not-record">ベスト: ${prevBest.toFixed(3)}びょう<br>さ: +${diff}びょう</span>`;
        }

        setTimeout(() => {
            bottomPanel.classList.add('hidden');
            resultScreen.classList.remove('hidden');
        }, 1000);
    }

    // ───── パーティクル ─────
    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 5 + 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed;
            this.life = 1.0; this.color = color;
            this.size = Math.random() * 3 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.life -= 0.025; this.size *= 0.95; }
        draw(ctx) {
            ctx.globalAlpha = this.life;
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }
    class Ripple {
        constructor(x, y) { this.x = x; this.y = y; this.radius = targetRadius; this.alpha = 1.0; }
        update() { this.radius += 2.5; this.alpha -= 0.035; }
        draw(ctx) {
            ctx.strokeStyle = `rgba(0,255,136,${this.alpha})`;
            ctx.lineWidth = 3; ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.stroke();
        }
    }

    // ───── 入力処理 ─────
    function handleInput(e) {
        if (gameState !== 'playing') return;
        if (e.target.closest('#bottom-panel')) return;
        e.preventDefault();

        const rect = canvas.getBoundingClientRect();
        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        for (let num of numbers) {
            if (num.cleared) continue;
            if (Math.hypot(num.x - x, num.y - y) < num.r * 1.5) {
                if (num.value === sequence[currentTargetIdx]) {
                    // 正解
                    num.cleared = true;
                    playPopSound();
                    for (let i = 0; i < 5; i++) particles.push(new Particle(num.x, num.y, '#00ff88'));
                    ripples.push(new Ripple(num.x, num.y));
                    currentTargetIdx++;
                    updateProgressBar();
                    if (currentTargetIdx >= sequence.length) gameClear();
                } else {
                    // まちがい → 赤フラッシュ
                    wrongFlashTimer = 18;
                    playWrongSound();
                }
                break;
            }
        }
    }

    // ───── メインループ ─────
    function loop() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (gameState === 'menu') return;

        if (gameState === 'playing') {
            timerDisplay.textContent = ((Date.now() - startTime) / 1000).toFixed(3);
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // アイテム描画
        numbers.forEach(num => {
            if ((gameMode === 'vanish' || gameMode === 'move') && num.cleared) return;

            // 移動（プレイ中のみ）
            if ((gameMode === 'move' || gameMode === 'move-classic') && gameState === 'playing') {
                num.x += num.vx; num.y += num.vy;
                if (num.x - num.r < 0) { num.x = num.r; num.vx *= -1; }
                else if (num.x + num.r > canvas.width) { num.x = canvas.width - num.r; num.vx *= -1; }
                if (num.y - num.r < SAFE_AREA_TOP) { num.y = SAFE_AREA_TOP + num.r; num.vy *= -1; }
                else if (num.y + num.r > canvas.height - SAFE_AREA_BOTTOM) { num.y = canvas.height - SAFE_AREA_BOTTOM - num.r; num.vy *= -1; }
            }

            ctx.beginPath();
            ctx.arc(num.x, num.y, num.r, 0, Math.PI * 2);
            ctx.strokeStyle = num.cleared ? '#2a2a2a' : '#444';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = num.cleared ? '#3a3a3a' : '#fff';
            ctx.font = `bold ${Math.round(num.r * 0.9)}px 'Roboto Mono', monospace`;
            ctx.fillText(num.value, num.x, num.y + 1);
        });

        // パーティクル・リップル
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(ctx); });
        ripples = ripples.filter(r => r.alpha > 0);
        ripples.forEach(r => { r.update(); r.draw(ctx); });

        // まちがいフラッシュ（赤）
        if (wrongFlashTimer > 0) {
            ctx.fillStyle = `rgba(255,0,0,${(wrongFlashTimer / 18) * 0.35})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            wrongFlashTimer--;
        }

        // カウントダウンオーバーレイ
        if (gameState === 'countdown') {
            ctx.fillStyle = 'rgba(0,0,0,0.58)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const isGo = countdownValue === 0;
            const txt = isGo ? 'GO!' : String(countdownValue);
            const fs = Math.round(Math.min(canvas.width, canvas.height) * 0.28);
            ctx.font = `900 ${fs}px 'Montserrat', sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = isGo ? '#00ff88' : '#fff';
            ctx.shadowColor = isGo ? '#00ff88' : 'rgba(255,255,255,0.6)';
            ctx.shadowBlur = 30;
            ctx.fillText(txt, canvas.width / 2, canvas.height / 2);
            ctx.shadowBlur = 0;
        }

        if (gameState === 'playing' || gameState === 'countdown' || gameState === 'result' || ripples.length > 0 || particles.length > 0) {
            animationFrameId = requestAnimationFrame(loop);
        } else {
            animationFrameId = null;
        }
    }

    // ───── イベント ─────
    document.getElementById('start-vanish-btn').addEventListener('click', () => startGame('vanish'));
    document.getElementById('start-classic-btn').addEventListener('click', () => startGame('classic'));
    document.getElementById('start-move-btn').addEventListener('click', () => startGame('move'));
    document.getElementById('start-move-classic-btn').addEventListener('click', () => startGame('move-classic'));
    document.getElementById('quit-btn').addEventListener('click', e => { e.stopPropagation(); quitGame(); });
    document.getElementById('retry-btn').addEventListener('click', () => startGame(gameMode));
    document.getElementById('title-btn').addEventListener('click', quitGame);
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });

    // 初期描画
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    updateScoreUI();
</script>
</body>
</html>
