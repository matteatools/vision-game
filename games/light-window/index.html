<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#174c6d">
    <title>クジャーロせんせいのひかりのまど</title>
    <meta name="description" content="ブロックを回して、裏返して、すき間なくぴったりはめよう！">
    <link rel="canonical" href="https://matteatools.github.io/vision-game/games/light-window/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="めとあたまのゲームパーク">
    <meta property="og:title" content="クジャーロせんせいの ひかりのまど｜めとあたまのゲームパーク">
    <meta property="og:description" content="ブロックを回して、裏返して、すき間なくぴったりはめよう！">
    <meta property="og:url" content="https://matteatools.github.io/vision-game/games/light-window/">
    <meta property="og:image" content="https://matteatools.github.io/vision-game/assets/og/light-window.jpg">
    <meta property="og:image:secure_url" content="https://matteatools.github.io/vision-game/assets/og/light-window.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="クジャーロせんせいの ひかりのまどのゲーム紹介画像">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="クジャーロせんせいの ひかりのまど｜めとあたまのゲームパーク">
    <meta name="twitter:description" content="ブロックを回して、裏返して、すき間なくぴったりはめよう！">
    <meta name="twitter:image" content="https://matteatools.github.io/vision-game/assets/og/light-window.jpg">
    <meta name="twitter:image:alt" content="クジャーロせんせいの ひかりのまどのゲーム紹介画像">
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap");

        :root {
            --ink: #184d68;
            --cream: #fff8d7;
            --cell-size: 42px;
            --tray-cell: 18px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            color: var(--ink);
            background: #4d3422;
            font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        button,
        a {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            cursor: pointer;
        }

        .screen {
            position: absolute;
            inset: 0;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- title ---------- */

        .title-screen {
            overflow: hidden;
            isolation: isolate;
            background: #79502a;
        }

        .title-picture,
        .title-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .title-picture {
            z-index: -3;
        }

        .title-art {
            object-fit: cover;
            object-position: center;
        }

        .title-screen::after {
            position: absolute;
            z-index: -2;
            inset: 0;
            content: "";
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(44, 24, 11, 0.22), transparent 29%),
                linear-gradient(0deg, rgba(35, 19, 8, 0.55), transparent 36%),
                radial-gradient(circle at 50% 43%, rgba(255, 248, 211, 0.2), transparent 48%);
        }

        .title-logo {
            position: absolute;
            z-index: 5;
            top: max(38%, calc(env(safe-area-inset-top) + 8px));
            left: 42%;
            width: min(65vw, 780px);
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
        }

        .title-logo h1 {
            margin: 0;
            line-height: 1;
        }

        .title-wordmark {
            display: block;
            width: 100%;
            height: auto;
            filter:
                drop-shadow(0 2px 1px rgba(255, 250, 199, 0.75))
                drop-shadow(0 8px 6px rgba(55, 32, 12, 0.46));
        }

        .title-best {
            position: absolute;
            z-index: 6;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            min-width: 142px;
            padding: 8px 13px;
            color: #174d69;
            background: rgba(255, 250, 222, 0.93);
            border: 3px solid rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            box-shadow: 0 5px 0 rgba(78, 50, 25, 0.35);
            font-size: 12px;
            font-weight: 900;
            line-height: 1.35;
            text-align: center;
            backdrop-filter: blur(3px);
        }

        .title-best strong {
            display: block;
            color: #a84948;
            font-size: 18px;
        }

        .title-actions {
            position: absolute;
            z-index: 6;
            bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px));
            left: 50%;
            display: grid;
            width: min(98vw, 760px);
            grid-template-columns: 0.9fr 0.9fr 1.1fr 1fr;
            gap: 8px;
            transform: translateX(-50%);
        }

        .title-button,
        .title-link,
        .collection-open-button {
            display: grid;
            min-width: 0;
            min-height: 48px;
            padding: 7px 8px;
            place-items: center;
            border-radius: 16px;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-align: center;
            text-decoration: none;
            white-space: normal;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .title-button {
            border: 3px solid rgba(255, 255, 255, 0.95);
            font-size: clamp(15px, 2.4vw, 21px);
        }

        .practice-button {
            color: #174d69;
            background: linear-gradient(#d8fbff, #7ce4ec);
            box-shadow: 0 7px 0 #23849a, 0 11px 20px rgba(47, 28, 11, 0.34);
        }

        .start-button {
            color: #693452;
            background: linear-gradient(#fff2a7, #ff9e62);
            box-shadow: 0 7px 0 #bd5b3e, 0 11px 20px rgba(47, 28, 11, 0.34);
        }

        .title-link {
            min-height: 48px;
            color: #fff9dc;
            background: rgba(32, 69, 75, 0.88);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 0 rgba(36, 31, 20, 0.52);
            font-size: clamp(10px, 1.8vw, 14px);
        }

        .collection-open-button {
            display: flex;
            min-height: 48px;
            align-items: center;
            justify-content: center;
            color: #fffbe8;
            background: linear-gradient(#8f70d7, #5b469d);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 0 #3b2c73, 0 9px 18px rgba(47, 28, 11, 0.3);
            font-size: clamp(10px, 1.8vw, 14px);
        }

        .collection-open-button span {
            margin-left: 0.4em;
            padding: 1px 8px 2px;
            color: #554192;
            background: #fff8d9;
            border-radius: 999px;
            font-size: 11px;
        }

        .title-button:active,
        .title-link:active,
        .collection-open-button:active,
        .pop-button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(45, 37, 24, 0.55);
        }

        /* ---------- collection ---------- */

        .collection-screen {
            display: flex;
            overflow: hidden;
            flex-direction: column;
            background: #39261b;
            isolation: isolate;
        }

        .collection-screen::before {
            position: absolute;
            z-index: -2;
            inset: 0;
            content: "";
            background:
                linear-gradient(rgba(36, 22, 14, 0.48), rgba(36, 22, 14, 0.7)),
                url("assets/gameplay-workshop-landscape-v1.jpg") center / cover;
        }

        .collection-header {
            display: grid;
            min-height: 72px;
            padding: max(9px, env(safe-area-inset-top)) 12px 8px;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            color: #fff9dc;
            background: rgba(26, 62, 72, 0.94);
            border-bottom: 3px solid #eac97c;
            box-shadow: 0 5px 16px rgba(24, 14, 8, 0.35);
        }

        .collection-back-button {
            min-width: 58px;
            min-height: 40px;
            color: #194f67;
            background: #fff8d9;
            border: 2px solid #fff;
            border-radius: 14px;
            box-shadow: 0 4px 0 #9b6a39;
            font-size: 12px;
            font-weight: 900;
        }

        .collection-heading {
            min-width: 0;
            text-align: center;
        }

        .collection-heading h1 {
            overflow: hidden;
            margin: 0;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: clamp(20px, 5vw, 30px);
            letter-spacing: 0.07em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .collection-heading p {
            margin: 1px 0 0;
            font-size: 11px;
            font-weight: 900;
        }

        .collection-header-mark {
            display: grid;
            width: 43px;
            height: 43px;
            place-items: center;
            color: #fff6b8;
            background: #7459bb;
            border: 2px solid #dfcaff;
            border-radius: 50%;
            font-size: 22px;
            box-shadow: 0 4px 0 #3c2b70;
        }

        .collection-body {
            position: relative;
            min-height: 0;
            padding: 14px;
            flex: 1;
            overflow-y: auto;
        }

        .collection-grid {
            display: grid;
            width: min(1180px, 100%);
            margin: 0 auto;
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 13px;
        }

        .collection-card {
            display: flex;
            min-width: 0;
            padding: 10px;
            flex-direction: column;
            align-items: stretch;
            color: #184d68;
            background:
                linear-gradient(rgba(255, 251, 226, 0.97), rgba(242, 218, 171, 0.97)),
                repeating-linear-gradient(8deg, rgba(111, 66, 35, 0.08) 0 2px, transparent 2px 18px);
            border: 4px solid #f0cf83;
            border-radius: 22px;
            box-shadow:
                inset 0 0 0 2px rgba(117, 70, 34, 0.2),
                0 6px 0 rgba(77, 45, 24, 0.62),
                0 10px 20px rgba(32, 18, 8, 0.28);
            text-align: center;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        .collection-card:active {
            transform: translateY(4px);
            box-shadow: inset 0 0 0 2px rgba(117, 70, 34, 0.2), 0 2px 0 rgba(77, 45, 24, 0.62);
        }

        .collection-window {
            display: grid;
            min-height: 116px;
            padding: 9px;
            place-items: center;
            background: linear-gradient(135deg, #8c572f, #e0a758 45%, #704126);
            border: 3px solid #ffe0a0;
            border-radius: 46% 46% 14px 14px / 15% 15% 14px 14px;
            box-shadow: inset 0 0 0 3px #6f4127, 0 4px 9px rgba(73, 42, 22, 0.3);
        }

        .collection-window canvas {
            display: block;
            width: 100%;
            height: 98px;
            background: #173f55;
            border: 2px solid #2a6b82;
            border-radius: 42% 42% 8px 8px / 10% 10% 8px 8px;
        }

        .collection-card h2 {
            overflow: hidden;
            margin: 9px 0 2px;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: 16px;
            letter-spacing: 0.04em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .collection-card p {
            margin: 0;
            color: #80523a;
            font-size: 10px;
            font-weight: 900;
            line-height: 1.5;
        }

        .collection-retry {
            display: block;
            margin-top: 8px;
            padding: 6px 8px;
            color: #fffbe7;
            background: linear-gradient(#886bd0, #5e499f);
            border: 2px solid #e7dcff;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 900;
        }

        .collection-empty {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(86vw, 430px);
            padding: 24px;
            color: #184d68;
            background: rgba(255, 250, 220, 0.95);
            border: 4px solid #f0cf83;
            border-radius: 26px;
            box-shadow: 0 7px 0 #875731;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: 16px;
            font-weight: 700;
            line-height: 1.7;
            text-align: center;
            transform: translate(-50%, -50%);
        }

        /* ---------- game ---------- */

        .game-screen {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #4b3424;
            isolation: isolate;
            touch-action: none;
        }

        .game-screen::before {
            position: absolute;
            z-index: -2;
            inset: 0;
            content: "";
            background:
                linear-gradient(rgba(37, 24, 16, 0.38), rgba(37, 24, 16, 0.56)),
                url("assets/gameplay-workshop-landscape-v1.jpg") center / cover;
            filter: saturate(0.94);
        }

        .game-screen::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            content: "";
            pointer-events: none;
            background:
                radial-gradient(circle at 43% 44%, rgba(255, 235, 154, 0.12), transparent 48%),
                linear-gradient(90deg, rgba(20, 12, 7, 0.14), transparent 15%, transparent 85%, rgba(20, 12, 7, 0.18));
        }

        .game-hud {
            z-index: 5;
            display: grid;
            min-height: 58px;
            padding: max(7px, env(safe-area-inset-top)) 10px 7px;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: center;
            color: #fff8d7;
            background: rgba(19, 57, 70, 0.93);
            border-bottom: 3px solid rgba(255, 229, 132, 0.72);
            box-shadow: 0 4px 14px rgba(28, 15, 7, 0.35);
        }

        .hud-button,
        .tool-button,
        .small-button {
            color: var(--ink);
            background: linear-gradient(#fffdf0, #ffe8a8);
            border: 2px solid #fff;
            border-radius: 14px;
            box-shadow: 0 4px 0 #9d6b35;
            font-weight: 900;
        }

        .hud-button {
            min-width: 48px;
            min-height: 38px;
            padding: 5px 9px;
            font-size: 12px;
        }

        .hud-center {
            min-width: 0;
            text-align: center;
        }

        .hud-center strong {
            display: block;
            overflow: hidden;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: clamp(14px, 3.4vw, 20px);
            letter-spacing: 0.05em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .hud-center span {
            font-size: 11px;
            opacity: 0.9;
        }

        .timer-box {
            min-width: 70px;
            padding: 5px 9px;
            color: #184d68;
            background: #fff8d7;
            border: 2px solid #fff;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 4px 0 #9d6b35;
        }

        .game-layout {
            display: grid;
            min-height: 0;
            padding: 10px;
            flex: 1;
            grid-template-columns: minmax(0, 1fr) minmax(260px, 350px);
            gap: 10px;
        }

        .window-panel,
        .workbench {
            position: relative;
            min-width: 0;
            min-height: 0;
            border: 4px solid rgba(255, 242, 184, 0.95);
            box-shadow: 0 7px 0 rgba(72, 43, 22, 0.5), 0 12px 25px rgba(32, 18, 8, 0.32);
        }

        .window-panel {
            display: flex;
            overflow: hidden;
            padding: 8px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(145deg, rgba(255, 252, 229, 0.5), rgba(255, 235, 179, 0.23)),
                repeating-linear-gradient(90deg, rgba(116, 70, 34, 0.06) 0 2px, transparent 2px 34px);
            border-radius: 28px;
            backdrop-filter: blur(1.2px);
        }

        .window-panel::before {
            position: absolute;
            inset: 7px;
            content: "";
            pointer-events: none;
            border: 2px solid rgba(255, 235, 164, 0.62);
            border-radius: 22px;
            box-shadow: inset 0 0 24px rgba(255, 230, 136, 0.12);
        }

        .artist-line {
            position: relative;
            z-index: 30;
            width: min(92%, 620px);
            max-width: min(92%, 620px);
            margin: 7px 0 25px;
            padding: 10px 15px 8px;
            flex: 0 0 auto;
            color: #174d69;
            background: #fffdf1;
            border: 3px solid #79cad8;
            border-radius: 16px;
            box-shadow: 0 4px 0 #347b8e, 0 7px 14px rgba(47, 30, 17, 0.22);
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: clamp(11px, 2vw, 15px);
            font-weight: 700;
            letter-spacing: 0.05em;
            line-height: 1.4;
            text-align: left;
            text-wrap: pretty;
        }

        .artist-line::before {
            position: absolute;
            top: -11px;
            left: 13px;
            padding: 1px 9px 2px;
            color: #fffbe8;
            background: linear-gradient(#bb7835, #80502c);
            border: 2px solid #f5d18a;
            border-radius: 999px;
            content: "げいじゅつか クジャーロ";
            font-family: "Zen Maru Gothic", sans-serif;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 0.02em;
        }

        .window-frame {
            position: relative;
            display: grid;
            padding: 19px 13px 13px;
            flex: 0 0 auto;
            place-items: center;
            background:
                linear-gradient(135deg, #8a552f, #d69a4c 32%, #6f4026 67%, #dca65e);
            border: 6px solid #f8d58e;
            border-radius: 48% 48% 20px 20px / 16% 16% 20px 20px;
            box-shadow:
                inset 0 0 0 4px #704126,
                inset 0 0 18px rgba(45, 24, 12, 0.5),
                0 7px 18px rgba(55, 33, 16, 0.32),
                0 0 26px rgba(255, 217, 103, 0.2);
        }

        .window-frame::before {
            position: absolute;
            top: -19px;
            left: 50%;
            width: 36px;
            height: 24px;
            content: "";
            pointer-events: none;
            background: linear-gradient(135deg, #ffe4a1, #b86c2d 55%, #f4c674);
            clip-path: polygon(50% 0, 100% 52%, 72% 100%, 28% 100%, 0 52%);
            filter: drop-shadow(0 3px 0 #704126);
            transform: translateX(-50%);
        }

        .board {
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(rgba(24, 56, 75, 0.25), rgba(24, 56, 75, 0.25)),
                repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.05) 0 8px, transparent 8px 16px),
                #153c54;
            border: 3px solid #2a647c;
            border-radius: 45% 45% 11px 11px / 9% 9% 11px 11px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.42);
        }

        .board::after {
            position: absolute;
            z-index: 20;
            inset: 0;
            content: "";
            pointer-events: none;
            border-radius: inherit;
            background:
                linear-gradient(120deg, rgba(255, 255, 255, 0.12), transparent 24%, transparent 70%, rgba(255, 231, 153, 0.08)),
                radial-gradient(circle at 24% 12%, rgba(255, 255, 255, 0.13), transparent 22%);
        }

        .board-cell,
        .piece-cell {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
        }

        .board-cell {
            border: 1px solid rgba(255, 255, 255, 0.045);
        }

        .board-cell.target {
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(0, 0, 0, 0.12)),
                #315f70;
            border: 2px solid rgba(255, 239, 170, 0.52);
            box-shadow: inset 0 0 10px rgba(5, 22, 31, 0.32);
        }

        .board-cell.hint {
            z-index: 4;
            animation: hintPulse 0.65s ease-in-out infinite alternate;
        }

        @keyframes hintPulse {
            from {
                background-color: rgba(255, 239, 94, 0.3);
                box-shadow: inset 0 0 5px #fff19a, 0 0 4px #ffe969;
            }
            to {
                background-color: rgba(255, 239, 94, 0.76);
                box-shadow: inset 0 0 12px #fff, 0 0 16px #ffe34c;
            }
        }

        .placed-piece {
            position: absolute;
            z-index: 5;
            cursor: grab;
            touch-action: none;
        }

        .piece-cell {
            border: 2px solid rgba(255, 251, 218, 0.88);
            border-radius: 18%;
            background:
                radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.75), transparent 23%),
                linear-gradient(145deg, rgba(255, 255, 255, 0.25), rgba(0, 0, 0, 0.16)),
                var(--piece-color);
            box-shadow:
                inset 0 -5px 0 rgba(0, 0, 0, 0.17),
                inset 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .placed-piece.selected .piece-cell {
            border-color: #fff;
            box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.17), 0 0 0 3px #ffe85e, 0 0 12px #fff17a;
        }

        .placed-piece.turn-feedback,
        .tray-piece.turn-feedback {
            animation: quickTurnFeedback 130ms ease-out;
        }

        @keyframes quickTurnFeedback {
            0% { transform: scale(0.94); }
            65% { transform: scale(1.035); }
            100% { transform: scale(1); }
        }

        .window-message {
            min-height: 26px;
            margin: 7px 0 0;
            color: #7a4429;
            font-size: clamp(12px, 2.2vw, 15px);
            font-weight: 900;
            text-align: center;
        }

        .workbench {
            display: flex;
            overflow: hidden;
            padding: 10px;
            flex-direction: column;
            background:
                linear-gradient(rgba(255, 249, 218, 0.9), rgba(239, 210, 155, 0.88)),
                repeating-linear-gradient(8deg, rgba(104, 59, 29, 0.1) 0 2px, transparent 2px 20px);
            border-color: #edc77c;
            border-radius: 24px;
            box-shadow:
                inset 0 0 0 3px rgba(116, 70, 34, 0.25),
                0 7px 0 rgba(72, 43, 22, 0.55),
                0 12px 25px rgba(32, 18, 8, 0.32);
        }

        .workbench h2 {
            margin: 0 0 7px;
            color: #7a4429;
            font-size: 17px;
            text-align: center;
        }

        .block-controls-hint {
            margin: -2px 0 7px;
            color: #7a4429;
            font-size: 11px;
            font-weight: 900;
            text-align: center;
        }

        .piece-tray {
            display: grid;
            min-height: 0;
            padding: 8px;
            flex: 1;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            align-content: center;
            overflow-y: auto;
            background: rgba(108, 68, 36, 0.13);
            border: 3px dashed rgba(115, 70, 36, 0.42);
            border-radius: 18px;
        }

        .tray-piece {
            display: grid;
            min-width: 0;
            min-height: 82px;
            padding: 8px;
            place-items: center;
            background: rgba(255, 255, 255, 0.84);
            border: 3px solid transparent;
            border-radius: 15px;
            box-shadow: 0 4px 0 rgba(95, 58, 31, 0.25);
            cursor: grab;
            touch-action: none;
        }

        .tray-piece.selected {
            border-color: #ffd84d;
            background: #fffbe0;
            box-shadow: 0 4px 0 #d69a34, 0 0 11px #ffdf5d;
        }

        .tray-piece.used {
            display: none;
        }

        .tray-piece.hinted {
            animation: trayHint 0.6s ease-in-out infinite alternate;
        }

        @keyframes trayHint {
            to {
                transform: scale(1.06);
                border-color: #ffad32;
                box-shadow: 0 4px 0 #c87523, 0 0 16px #ffcb55;
            }
        }

        .piece-preview {
            position: relative;
            pointer-events: none;
        }

        .preview-cell {
            position: absolute;
            width: var(--tray-cell);
            height: var(--tray-cell);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 3px;
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.4), rgba(0, 0, 0, 0.15)),
                var(--piece-color);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
        }

        .tool-row {
            display: grid;
            margin-top: 9px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        .tool-button {
            min-height: 46px;
            padding: 6px 5px;
            font-size: 13px;
        }

        .tool-button:disabled {
            opacity: 0.42;
            cursor: default;
        }

        .action-row {
            display: grid;
            margin-top: 8px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 7px;
        }

        .small-button {
            min-height: 39px;
            padding: 5px 4px;
            font-size: 11px;
        }

        .hint-button {
            background: linear-gradient(#fff9bb, #ffd75d);
        }

        .reset-button {
            background: linear-gradient(#e5f8ff, #9bdeef);
        }

        .sample-button {
            background: linear-gradient(#f4e8ff, #ceb0f1);
        }

        .drag-proxy {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            opacity: 0.9;
            filter: drop-shadow(0 7px 5px rgba(34, 20, 9, 0.38));
        }

        .drag-proxy .piece-cell {
            position: absolute;
        }

        /* ---------- guide / results ---------- */

        .overlay {
            position: absolute;
            z-index: 200;
            inset: 0;
            display: grid;
            padding: 18px;
            place-items: center;
            background: rgba(16, 31, 40, 0.72);
            backdrop-filter: blur(4px);
        }

        .result-card {
            width: min(91vw, 520px);
            padding: 21px;
            color: #184d68;
            background: #fff9dd;
            border: 5px solid #ffe285;
            border-radius: 30px;
            box-shadow: 0 9px 0 #9f6632, 0 18px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .artist-badge {
            width: 88px;
            height: 88px;
            margin: -4px auto 7px;
            background-image: url("assets/light-window-title-portrait-v2.jpg");
            background-position: 76% 54%;
            background-size: 450%;
            border: 5px solid #fff;
            border-radius: 50%;
            box-shadow: 0 4px 0 #29738c;
        }

        .result-card h2 {
            margin: 5px 0;
            color: #994c42;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: clamp(24px, 6vw, 34px);
        }

        .result-card p {
            min-height: 52px;
            margin: 9px 0 17px;
            font-family: "Kaisei Decol", "Yu Mincho", "Hiragino Mincho ProN", serif;
            font-size: clamp(14px, 3.5vw, 18px);
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1.65;
            text-align: left;
            text-wrap: pretty;
        }

        .title-link,
        .collection-empty,
        .hud-center strong,
        .hud-center span,
        .artist-line,
        .window-message,
        .block-controls-hint,
        .result-card h2,
        .result-card p {
            overflow-wrap: normal;
            word-break: keep-all;
            line-break: strict;
        }

        .result-button {
            min-width: min(78vw, 280px);
            min-height: 54px;
            color: #683e2c;
            background: linear-gradient(#fff3a9, #ffae64);
            border: 3px solid #fff;
            border-radius: 18px;
            box-shadow: 0 6px 0 #b85c38;
            font-size: 19px;
            font-weight: 900;
        }

        .new-record {
            color: #d43f67;
            animation: recordPop 0.65s ease-in-out infinite alternate;
        }

        @keyframes recordPop {
            to {
                transform: scale(1.08);
            }
        }

        @media (max-width: 760px), (max-aspect-ratio: 4 / 5) {
            .title-picture .title-art {
                object-position: center;
            }

            .title-logo {
                top: max(29%, calc(env(safe-area-inset-top) + 96px));
                left: 50%;
                width: min(95vw, 540px);
            }

            .title-best {
                padding: 6px 10px;
                font-size: 10px;
            }

            .title-best strong {
                font-size: 15px;
            }

            .title-actions {
                width: min(98vw, 500px);
                gap: 5px;
            }

            .title-button {
                min-height: 47px;
                padding-inline: 4px;
                font-size: clamp(11px, 3vw, 16px);
            }

            .collection-open-button {
                min-height: 47px;
                padding-inline: 3px;
                flex-direction: column;
                font-size: clamp(8px, 2.2vw, 11px);
                line-height: 1.1;
            }

            .collection-open-button span {
                margin-top: 2px;
                margin-left: 0;
                padding-inline: 5px;
                font-size: 9px;
            }

            .title-link {
                min-height: 47px;
                padding-inline: 3px;
                font-size: clamp(9px, 2.6vw, 12px);
            }

            .collection-screen::before {
                background:
                    linear-gradient(rgba(36, 22, 14, 0.48), rgba(36, 22, 14, 0.72)),
                    url("assets/gameplay-workshop-portrait-v1.jpg") center / cover;
            }

            .collection-body {
                padding: 10px;
            }

            .collection-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 9px;
            }

            .collection-card {
                padding: 7px;
                border-width: 3px;
                border-radius: 17px;
            }

            .collection-window {
                min-height: 96px;
                padding: 6px;
            }

            .collection-window canvas {
                height: 82px;
            }

            .collection-card h2 {
                font-size: 13px;
            }

            .game-screen::before {
                background:
                    linear-gradient(rgba(37, 24, 16, 0.4), rgba(37, 24, 16, 0.58)),
                    url("assets/gameplay-workshop-portrait-v1.jpg") center / cover;
            }

            .game-layout {
                display: flex;
                padding: 7px;
                flex-direction: column;
                gap: 7px;
            }

            .window-panel {
                padding: 5px;
                flex: 1 1 auto;
                border-width: 3px;
                border-radius: 21px;
            }

            .artist-line {
                margin-bottom: 18px;
                padding: 4px 10px;
            }

            .window-frame {
                padding: 13px 8px 8px;
                border-width: 4px;
                border-radius: 46% 46% 14px 14px / 12% 12% 14px 14px;
            }

            .window-frame::before {
                top: -13px;
                width: 27px;
                height: 18px;
            }

            .window-message {
                min-height: 21px;
                margin-top: 4px;
                font-size: 11px;
            }

            .workbench {
                flex: 0 0 auto;
                max-height: 34vh;
                padding: 7px;
                border-width: 3px;
                border-radius: 18px;
            }

            .workbench h2 {
                display: none;
            }

            .piece-tray {
                display: flex;
                min-height: 74px;
                padding: 6px;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                justify-content: flex-start;
            }

            .tray-piece {
                min-width: 96px;
                min-height: 78px;
                flex: 0 0 96px;
            }

            .tool-row {
                margin-top: 6px;
            }

            .tool-button {
                min-height: 39px;
                font-size: 11px;
            }

            .action-row {
                margin-top: 6px;
            }

            .small-button {
                min-height: 34px;
                font-size: 10px;
            }
        }

        @media (max-height: 570px) and (min-aspect-ratio: 4 / 5) {
            .title-logo {
                top: 34%;
                width: min(48vw, 560px);
            }

            .title-actions {
                bottom: max(9px, env(safe-area-inset-bottom));
            }

            .title-button {
                min-height: 48px;
                padding: 5px 10px;
            }

            .title-link {
                min-height: 36px;
                padding: 5px 10px;
            }

            .collection-open-button {
                min-height: 38px;
                padding: 5px 10px;
            }

            .game-layout {
                grid-template-columns: minmax(0, 1fr) minmax(245px, 320px);
            }

            .game-hud {
                min-height: 49px;
                padding-top: 5px;
            }

            .artist-line {
                margin-bottom: 14px;
                padding-block: 3px;
            }

            .workbench {
                padding: 7px;
            }

            .tray-piece {
                min-height: 72px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body>
    <main id="app">
        <section class="screen title-screen" id="screen-title" aria-labelledby="game-title">
            <picture class="title-picture" aria-hidden="true">
                <source media="(max-aspect-ratio: 4/5)" srcset="assets/light-window-title-portrait-v2.jpg">
                <img class="title-art" src="assets/light-window-title-landscape-v2.jpg" alt="">
            </picture>

            <div class="title-logo">
                <h1 id="game-title">
                    <img class="title-wordmark" src="assets/title-wordmark-kujaro-v1.png" alt="クジャーロせんせいの ひかりのまど">
                </h1>
            </div>

            <div class="title-best">
                10まどの さいこう
                <strong id="title-best">まだないよ</strong>
            </div>

            <div class="title-actions">
                <button class="title-button practice-button" id="practice-button" type="button">れんしゅう</button>
                <button class="title-button start-button" id="start-button" type="button">スタート</button>
                <button class="collection-open-button" id="collection-button" type="button">
                    まどコレクション
                    <span><b id="title-collection-count">0</b>まい</span>
                </button>
                <a class="title-link" href="../../index.html">ゲームパークへ もどる</a>
            </div>
        </section>

        <section class="screen collection-screen hidden" id="screen-collection" aria-labelledby="collection-title">
            <header class="collection-header">
                <button class="collection-back-button" id="collection-back-button" type="button">タイトル</button>
                <div class="collection-heading">
                    <h1 id="collection-title">まどコレクション</h1>
                    <p id="collection-count">0まいの さくひん</p>
                </div>
                <div class="collection-header-mark" aria-hidden="true">◇</div>
            </header>
            <div class="collection-body">
                <div class="collection-grid" id="collection-grid"></div>
                <div class="collection-empty" id="collection-empty">
                    まだ まどは ありません。<br>
                    スタートから まどを かんせいさせよう。
                </div>
            </div>
        </section>

        <section class="screen game-screen hidden" id="screen-game" aria-label="ひかりのまどの ゲームがめん">
            <header class="game-hud">
                <button class="hud-button pop-button" id="title-button" type="button">タイトル</button>
                <div class="hud-center">
                    <strong id="stage-label">まど 1／10</strong>
                    <span id="difficulty-label">やさしい まど</span>
                </div>
                <div class="timer-box" id="timer-label">00:00</div>
            </header>

            <div class="game-layout">
                <section class="window-panel">
                    <p class="artist-line" id="artist-line">すきまなく ひかりを はめるのさ</p>
                    <div class="window-frame">
                        <div class="board" id="board" aria-label="ひかりのまど"></div>
                    </div>
                    <p class="window-message" id="window-message">ブロックを えらんで まどへ はこぼう</p>
                </section>

                <aside class="workbench">
                    <h2>ひかりブロック</h2>
                    <p class="block-controls-hint">クリックで回転／ダブルクリックで裏返し<br>長押しでドラッグ</p>
                    <div class="piece-tray" id="piece-tray"></div>

                    <div class="tool-row">
                        <button class="tool-button pop-button" id="rotate-button" type="button">↻ くるっと</button>
                        <button class="tool-button pop-button" id="flip-button" type="button">↔ うらがえす</button>
                        <button class="tool-button pop-button" id="return-button" type="button">↩ もどす</button>
                    </div>

                    <div class="action-row">
                        <button class="small-button hint-button pop-button" id="hint-button" type="button">ヒント</button>
                        <button class="small-button reset-button pop-button" id="reset-button" type="button">やりなおす</button>
                        <button class="small-button sample-button pop-button" id="sample-button" type="button">おてほん</button>
                    </div>
                </aside>
            </div>

            <div class="drag-proxy hidden" id="drag-proxy" aria-hidden="true"></div>
        </section>

        <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
            <div class="result-card">
                <div class="artist-badge" aria-hidden="true"></div>
                <h2 id="overlay-title">うつくしい！</h2>
                <p id="overlay-message"></p>
                <button class="result-button pop-button" id="overlay-button" type="button">つぎへ</button>
            </div>
        </div>
    </main>

    <script src="puzzle-shapes.js"></script>
    <script src="puzzle-bank.js"></script>
    <script src="game.js"></script>
</body>
</html>
