        .color-dot.red { background: var(--red); }

        .review-overlay {

            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 6px;
            align-items: center;
            padding: 5px;
            opacity: 0.14;
            background: #f2ead4;
            border: 2px solid #e4d6bd;
            border-radius: 14px;
            transform: translateY(7px);
            transition: opacity 190ms ease, transform 190ms ease, background 190ms ease;

            background: #fff;
            transform: translateY(0);

        .review-row-label {
            text-align: center;
            font-size: 12px;
            font-weight: 1000;

        .review-chip {

            display: grid;
            min-width: 0;
            min-height: 52px;
            grid-template-columns: auto 1fr;
            gap: 3px;
            align-items: center;
            padding: 4px;
            background: #f8f4e8;
            border: 2px solid #e5d9bf;
            border-radius: 11px;
            text-align: center;

        .review-chip strong {
            color: #d6504e;
            font-size: 21px;
            line-height: 1;

            display: block;
            overflow: hidden;
            font-size: 9px;
            font-weight: 1000;
            white-space: nowrap;
        }

            background: #fff2a8;
            border-color: #e8a938;
            box-shadow: 0 0 0 4px rgba(255, 224, 107, 0.5);
            animation: winnerPulse 650ms ease-in-out infinite alternate;
        }

        .review-chip.picked::after {
            content: "えらんだ";

            top: -8px;
            right: -4px;
            padding: 2px 5px;
            color: #fff;
            background: #438fc7;
            border: 1px solid #fff;
            border-radius: 999px;
            box-shadow: 0 2px 4px rgba(51, 63, 86, 0.25);
            font-size: 7px;
            font-weight: 1000;
        }

            display: grid;
            min-height: 62px;
            place-items: center;
            padding: 7px 10px;
            opacity: 0;
            color: #fff;
            background: #6a5a50;
            border-radius: 15px;
            text-align: left;
            font-size: clamp(13px, 3.6vw, 17px);
            font-weight: 1000;
            line-height: 1.35;
            transform: scale(0.92);
            transition: opacity 200ms ease, transform 200ms ease;
        }

        .final-answer.shown {
            opacity: 1;
            transform: scale(1);
        }

        .final-answer.correct {
            background: linear-gradient(180deg, #5fbd82, #3e9864);
        }

        .final-answer.wrong {
            background: linear-gradient(180deg, #ef786d, #d45450);
        }

        .next-button {

            box-shadow: 0 5px 0 #2c6d5c;
            font-size: 17px;
            font-weight: 1000;
            pointer-events: none;
            transform: translateY(6px);
            transition: opacity 180ms ease, transform 180ms ease;
            cursor: pointer;
        }

        .next-button.shown {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

            inset: 0;

            place-items: center;

            word-break: keep-all;
            line-break: strict;
        }

        .guide-action,
        .result-action {
            min-height: 48px;
            padding: 8px 14px;
            color: #fff;
            background: linear-gradient(180deg, #72cdb0, #41977e);
            border: 3px solid #dcfff2;
            border-radius: 14px;
            box-shadow: 0 6px 0 #2d6c5b;
            font-size: 17px;
            font-weight: 1000;
            cursor: pointer;
        }

        .result-screen {
            display: grid;
            place-items: center;
            padding: 14px;
            background:
                linear-gradient(rgba(255, 244, 204, 0.72), rgba(121, 199, 171, 0.76)),
                url("assets/candy-factory-title-v1.jpg") center / cover no-repeat;
        }

        .result-score {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }

        .result-stat {
            padding: 6px 4px;
            background: #fff;
            border: 2px solid #ead9bc;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 1000;
        }

        .result-stat strong {
            display: block;
            margin-top: 2px;
            color: #d55250;
            font-size: 19px;
        }

        .result-best {
            margin-bottom: 10px;
            color: #9b663e;
            font-size: 11px;
            font-weight: 1000;
        }

        .result-best.new {
            color: #e04f4c;
            animation: winnerPulse 600ms ease-in-out infinite alternate;
        }

        .result-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .result-title {
            color: #6b594e;
            background: #eee5d5;
            border-color: #fff;
            box-shadow: 0 6px 0 #c1b3a0;
        }

        @keyframes candyPop {
            0% { opacity: 0; transform: rotate(var(--rotation, 0deg)) scale(0); }
            100% { opacity: 1; transform: rotate(var(--rotation, 0deg)) scale(var(--candy-scale, 0.78)); }
        }

        @keyframes winnerPulse {
            from { transform: scale(1); }
            to { transform: scale(1.035); }
        }

        @media (orientation: landscape) and (max-height: 620px) {
            .title-logo {
                top: max(11px, env(safe-area-inset-top));
                left: 55%;
                width: min(56vw, 590px);
            }

            .title-menu {
                bottom: max(10px, env(safe-area-inset-bottom));
                width: min(70vw, 590px);
            }

            .title-button,
            .title-link {
                min-height: 40px;
                padding: 4px 6px;
                font-size: 13px;
            }

            .start-button {
                min-height: 47px;
                font-size: 19px;
            }

            .game-header {
                padding-top: max(4px, env(safe-area-inset-top));
                padding-bottom: 4px;
            }

            .play-layout {
                grid-template-columns: minmax(0, 1fr) minmax(260px, 36vw);
                grid-template-rows: minmax(0, 1fr);
            }

            .candy-tray {
                width: min(53vw, 76svh, 500px);
                padding: 8px;
                gap: 5px;
            }

            .answer-panel {
                align-content: center;
            }

            .option-group {
                grid-template-columns: 45px repeat(3, 1fr);
            }

            .option-button {
                min-height: 39px;
                font-size: 9px;
            }

            .review-card {
                width: min(80vw, 640px);
                grid-template-columns: 1fr;
                gap: 4px;
                padding: 8px 10px;
            }

            .review-title {
                font-size: 20px;
            }

            .review-row {
                padding: 3px;
            }

            .review-chip {
                min-height: 42px;
            }

            .final-answer {
                min-height: 48px;
            }

            .guide-card,
            .result-card {
                width: min(76vw, 620px);
                grid-template-columns: minmax(100px, 27%) 1fr;
                padding: 9px 13px 9px 4px;
            }

            .guide-content h2,
            .result-content h2 {
                margin-bottom: 4px;
                font-size: 25px;
            }

            .guide-content p,
            .result-content p {

                line-height: 1.4;
            }

            .guide-action,
            .result-action {
                min-height: 40px;
                font-size: 14px;
            }
        }

        @media (min-width: 900px) and (min-height: 620px) {
            .play-layout {
                grid-template-columns: minmax(0, 1fr) minmax(310px, 360px);
                grid-template-rows: minmax(0, 1fr);
                gap: 12px;
            }

            .candy-tray {
                width: min(100%, calc(100svh - 105px), 670px);
            }

            .answer-panel {
                align-content: center;
                gap: 10px;
                padding: 12px;
                border-radius: 23px;
            }

            .hamster-line {
                display: grid;
                grid-template-columns: 88px 1fr;
                gap: 7px;
                align-items: center;
                margin-bottom: 2px;
            }

            .hamster-line img {
                width: 88px;

                object-fit: cover;
                object-position: center;

            .hamster-line p {

                width: 97vw;

            }

            .candy-tray {

            }

            .option-group {
                grid-template-columns: 44px repeat(3, 1fr);
            }

                font-size: 9px;

            }

            }

            .guide-card,

                padding: 12px 10px 12px 3px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 1ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 1ms !important;
            }
        }
    </style>
</head>
<body>
    <button class="sound-button" id="sound-button" type="button" aria-label="おとを きりかえる" aria-pressed="true">🔊</button>

    <section class="screen title-screen" id="screen-title" aria-labelledby="game-title">

        <div class="title-menu">
            <button class="title-button practice-button" id="practice-button" type="button">れんしゅう</button>
            <button class="title-button start-button" id="start-button" type="button">

    <section class="screen game-screen" id="screen-game" aria-label="ゲームがめん" hidden>

            <div class="hud">
                <div class="hud-card">
                    <span id="round-label">もんだい</span>

                </div>
                <div class="hud-card" id="time-card">

                </div>

        </header>

        <main class="game-main">
            <div class="play-layout">
                <div class="factory-stage">
                    <div class="candy-tray" id="candy-tray" aria-label="9この キャンディ"></div>
                </div>

                <aside class="answer-panel" aria-label="こたえをえらぶ">
                    <div class="hamster-line">
                        <img src="assets/hamster-guide-v1.jpg" alt="">
                        <p>いちばんおおい びんを きっちり えらぶのです！</p>
                    </div>

                    <div class="option-group" data-type="size">
                        <div class="group-name">おおきさ</div>
                        <button class="option-button" type="button" data-type="size" data-value="L">
                            <span class="option-mark"><span class="size-mark L"></span></span><span>おおきい</span>
                        </button>
                        <button class="option-button" type="button" data-type="size" data-value="M">
                            <span class="option-mark"><span class="size-mark M"></span></span><span>ふつう</span>
                        </button>
                        <button class="option-button" type="button" data-type="size" data-value="S">
                            <span class="option-mark"><span class="size-mark S"></span></span><span>ちいさい</span>
                        </button>
                    </div>

                    <div class="option-group" data-type="color">
                        <div class="group-name">いろ</div>
                        <button class="option-button" type="button" data-type="color" data-value="red">
                            <span class="option-mark"><span class="color-dot red"></span></span><span>あか</span>
                        </button>
                        <button class="option-button" type="button" data-type="color" data-value="blue">
                            <span class="option-mark"><span class="color-dot blue"></span></span><span>あお</span>
                        </button>
                        <button class="option-button" type="button" data-type="color" data-value="yellow">
                            <span class="option-mark"><span class="color-dot yellow"></span></span><span>きいろ</span>
                        </button>
                    </div>

                    <div class="option-group" data-type="shape">
                        <div class="group-name">かたち</div>
                        <button class="option-button" type="button" data-type="shape" data-value="circle">
                            <span class="option-mark"><span class="shape-mark circle"></span></span><span>まる</span>
                        </button>
                        <button class="option-button" type="button" data-type="shape" data-value="star">
                            <span class="option-mark"><span class="shape-mark star"></span></span><span>ほし</span>
                        </button>
                        <button class="option-button" type="button" data-type="shape" data-value="diamond">
                            <span class="option-mark"><span class="shape-mark diamond"></span></span><span>ひしがた</span>
                        </button>
                    </div>
                </aside>
            </div>

            <div class="review-overlay" id="review-overlay" hidden>
                <div class="review-card" role="dialog" aria-modal="true" aria-labelledby="review-title">
                    <h2 class="review-title" id="review-title"><span>きっちり</span> なかまわけ！</h2>
                    <div class="review-rows" id="review-rows"></div>
                    <div class="final-answer" id="final-answer" aria-live="polite"></div>

        </main>
    </section>

    <div class="overlay" id="guide-overlay" hidden>
        <div class="guide-card" role="dialog" aria-modal="true" aria-labelledby="guide-heading">
            <img class="guide-hamster" src="assets/hamster-guide-v1.jpg" alt="">
            <div class="guide-content">
                <h2 id="guide-heading">れんしゅうです！</h2>
                <p id="guide-copy"></p>
                <button class="guide-action" id="guide-action" type="button">わかった！</button>
            </div>
        </div>
    </div>

    <section class="screen result-screen" id="screen-result" aria-labelledby="result-heading" hidden>
        <div class="result-card">
            <img class="result-hamster" src="assets/hamster-guide-v1.jpg" alt="">
            <div class="result-content">
                <h2 id="result-heading">おとくに もらえた！</h2>
                <p id="result-copy">きっちり なかまわけ できたのです！</p>
                <div class="result-score">
                    <div class="result-stat">せいかい<strong id="result-correct">0/10</strong></div>
                    <div class="result-stat">キャンディ<strong id="result-candies">0こ</strong></div>
                    <div class="result-stat">じかん<strong id="result-time">0:00</strong></div>
                </div>
                <div class="result-best" id="result-best"></div>
                <div class="result-actions">
                    <button class="result-action" id="retry-button" type="button">もういちど</button>
                    <button class="result-action result-title" id="result-title-button" type="button">タイトルへ</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        (() => {
            "use strict";

            const VALUES = {
                size: ["L", "M", "S"],
                color: ["red", "blue", "yellow"],
                shape: ["circle", "star", "diamond"]
            };
            const REVIEW_ORDER = ["size", "color", "shape"];
            const LABELS = {
                size: "おおきさ",
                color: "いろ",
                shape: "かたち",
                L: "おおきい",
                M: "ふつう",
                S: "ちいさい",
                red: "あか",
                blue: "あお",
                yellow: "きいろ",
                circle: "まる",
                star: "ほし",
                diamond: "ひしがた"
            };
            const PRACTICE_TYPES = ["color", "shape", "size", null];
            const CHALLENGE_ROUNDS = 10;
            const BEST_KEY = "mostCandy_best_v1";

            const elements = {
                title: document.querySelector("#screen-title"),
                game: document.querySelector("#screen-game"),
                result: document.querySelector("#screen-result"),
                sound: document.querySelector("#sound-button"),
                titleBest: document.querySelector("#title-best"),
                practice: document.querySelector("#practice-button"),
                start: document.querySelector("#start-button"),
                quit: document.querySelector("#quit-button"),
                headerMessage: document.querySelector("#header-message"),
                roundLabel: document.querySelector("#round-label"),
                roundDisplay: document.querySelector("#round-display"),
                timeCard: document.querySelector("#time-card"),
                timeDisplay: document.querySelector("#time-display"),
                tray: document.querySelector("#candy-tray"),
                optionGroups: [...document.querySelectorAll(".option-group")],
                optionButtons: [...document.querySelectorAll(".option-button")],
                review: document.querySelector("#review-overlay"),
                reviewRows: document.querySelector("#review-rows"),
                finalAnswer: document.querySelector("#final-answer"),
                next: document.querySelector("#next-button"),
                guide: document.querySelector("#guide-overlay"),
                guideHeading: document.querySelector("#guide-heading"),
                guideCopy: document.querySelector("#guide-copy"),
                guideAction: document.querySelector("#guide-action"),
                resultHeading: document.querySelector("#result-heading"),
                resultCopy: document.querySelector("#result-copy"),
                resultCorrect: document.querySelector("#result-correct"),
                resultCandies: document.querySelector("#result-candies"),
                resultTime: document.querySelector("#result-time"),
                resultBest: document.querySelector("#result-best"),
                retry: document.querySelector("#retry-button"),
                resultTitle: document.querySelector("#result-title-button")
            };

            const state = {
                screen: "title",
                mode: "challenge",
                phase: "idle",
                roundIndex: 0,
                practiceIndex: 0,
                correct: 0,
                candies: 0,
                elapsed: 0,
                level: null,
                selection: null,
                best: null,
                soundOn: true,
                audioContext: null,
                timer: null,
                timeouts: []
            };

            const Sound = {
                init() {
                    if (!state.soundOn) return null;
                    if (!state.audioContext) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) state.audioContext = new AudioContext();
                    }
                    if (state.audioContext?.state === "suspended") state.audioContext.resume();
                    return state.audioContext;
                },
                tones(notes, type = "sine", volume = 0.08, spacing = 0.07, duration = 0.18) {
                    const audio = this.init();
                    if (!audio) return;
                    const now = audio.currentTime;
                    notes.forEach((frequency, index) => {
                        const oscillator = audio.createOscillator();
                        const gain = audio.createGain();
                        const start = now + index * spacing;
                        oscillator.type = type;
                        oscillator.frequency.setValueAtTime(frequency, start);
                        gain.gain.setValueAtTime(volume, start);
                        gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
                        oscillator.connect(gain);
                        gain.connect(audio.destination);
                        oscillator.start(start);
                        oscillator.stop(start + duration + 0.02);
                    });
                },
                click() {
                    this.tones([760], "sine", 0.045, 0, 0.09);
                },
                sort(step) {
                    this.tones([420 + step * 130, 560 + step * 150], "triangle", 0.055, 0.05, 0.13);
                },
                correct() {
                    this.tones([523, 659, 784, 1046], "triangle", 0.08, 0.07, 0.25);
                },
                wrong() {
                    this.tones([330, 294], "sine", 0.07, 0.1, 0.27);
                },
                finish() {
                    this.tones([523, 659, 784, 1046, 1318], "triangle", 0.075, 0.09, 0.38);
                }
            };

            function schedule(callback, delay) {
                const id = window.setTimeout(() => {
                    state.timeouts = state.timeouts.filter((value) => value !== id);
                    callback();
                }, delay);
                state.timeouts.push(id);
                return id;
            }

            function clearTiming() {
                if (state.timer !== null) {
                    window.clearInterval(state.timer);
                    state.timer = null;
                }
                state.timeouts.forEach(window.clearTimeout);
                state.timeouts = [];
            }

            function randomItem(items) {
                return items[Math.floor(Math.random() * items.length)];
            }

            function shuffle(items) {
                for (let index = items.length - 1; index > 0; index -= 1) {
                    const other = Math.floor(Math.random() * (index + 1));
                    [items[index], items[other]] = [items[other], items[index]];
                }
                return items;
            }

            function countItems(items) {
                const counts = {};
                REVIEW_ORDER.forEach((type) => {
                    VALUES[type].forEach((value) => {
                        counts[`${type}:${value}`] = items.filter((item) => item[type] === value).length;
                    });
                });
                return counts;
            }

            function generateLevel(forcedType = null) {
                for (let attempt = 0; attempt < 800; attempt += 1) {
                    const items = Array.from({ length: 9 }, (_, index) => ({
                        id: `${Date.now()}-${attempt}-${index}`,
                        size: randomItem(VALUES.size),
                        color: randomItem(VALUES.color),
                        shape: randomItem(VALUES.shape),
                        rotation: Math.floor(Math.random() * 31) - 15
                    }));
                    const counts = countItems(items);
                    const candidates = REVIEW_ORDER.flatMap((type) => (
                        VALUES[type].map((value) => ({
                            type,
                            value,
                            count: counts[`${type}:${value}`]
                        }))
                    )).sort((a, b) => b.count - a.count);

                    const winner = candidates[0];
                    const runnerUp = candidates[1];
                    const unique = winner.count > runnerUp.count;
                    const usefulRange = winner.count >= 4 && winner.count <= 7;
                    if (unique && usefulRange && (!forcedType || winner.type === forcedType)) {
                        return { items: shuffle(items), counts, answer: winner };
                    }
                }

                return generateLevel(null);
            }

            function formatTime(seconds) {
                const minutes = Math.floor(seconds / 60);
                const rest = seconds % 60;
                return `${minutes}:${String(rest).padStart(2, "0")}`;
            }

            function readBest() {
                try {
                    const value = JSON.parse(localStorage.getItem(BEST_KEY));
                    if (
                        value
                        && Number.isInteger(value.correct)
                        && Number.isInteger(value.time)
                    ) {
                        return value;
                    }
                } catch {
                    return null;
                }
                return null;
            }

            function isBetterRecord(result, best) {
                if (!best) return true;
                if (result.correct !== best.correct) return result.correct > best.correct;
                return result.time < best.time;
            }

            function updateBest(result = null) {
                if (result && isBetterRecord(result, state.best)) {
                    state.best = result;
                    localStorage.setItem(BEST_KEY, JSON.stringify(result));
                }
                elements.titleBest.textContent = state.best
                    ? `${state.best.correct}/10　${formatTime(state.best.time)}`
                    : "まだないよ";
            }

            function showScreen(name) {
                elements.title.hidden = name !== "title";
                elements.game.hidden = name !== "game";
                elements.result.hidden = name !== "result";
                state.screen = name;
            }

            function startTimer() {
                if (state.timer !== null) window.clearInterval(state.timer);
                state.timer = window.setInterval(() => {
                    if (state.phase !== "choose" || state.mode !== "challenge") return;
                    state.elapsed += 1;
                    elements.timeDisplay.textContent = formatTime(state.elapsed);
                }, 1000);
            }

            function candyMarkup(item, index) {
                return `
                    <div class="candy-cell">
                        <span
                            class="candy color-${item.color} size-${item.size} shape-${item.shape}"
                            style="--rotation:${item.rotation}deg;animation-delay:${index * 28}ms"
                            role="img"
                            aria-label="${LABELS[item.size]} ${LABELS[item.color]} ${LABELS[item.shape]}の キャンディ"
                        >
                            <span class="candy-core"></span>
                        </span>
                    </div>
                `;
            }

            function renderLevel() {
                elements.tray.innerHTML = state.level.items
                    .map((item, index) => candyMarkup(item, index))
                    .join("");

                const practiceType = state.mode === "practice"
                    ? PRACTICE_TYPES[state.practiceIndex]
                    : null;
                elements.optionGroups.forEach((group) => {
                    group.hidden = Boolean(practiceType && group.dataset.type !== practiceType);
                });
                elements.optionButtons.forEach((button) => {
                    button.disabled = false;
                    button.classList.remove("selected");
                });

                if (state.mode === "practice") {
                    elements.roundLabel.textContent = "れんしゅう";
                    elements.roundDisplay.textContent = `${state.practiceIndex + 1}/${PRACTICE_TYPES.length}`;
                    elements.timeCard.hidden = true;
                    elements.headerMessage.textContent = practiceType
                        ? `${LABELS[practiceType]}の なかで いちばんおおいのは？`
                        : "ぜんぶの とくちょうで いちばんおおいのは？";
                } else {
                    elements.roundLabel.textContent = "もんだい";
                    elements.roundDisplay.textContent = `${state.roundIndex + 1}/${CHALLENGE_ROUNDS}`;
                    elements.timeCard.hidden = false;
                    elements.headerMessage.textContent = "いちばん おおい とくちょうは どれ？";
                }

                elements.review.hidden = true;
                elements.reviewRows.innerHTML = "";
                elements.finalAnswer.className = "final-answer";
                elements.finalAnswer.innerHTML = "";
                elements.next.classList.remove("shown");
                state.selection = null;
                state.phase = "choose";
            }

            function markerMarkup(type, value) {
                if (type === "color") {
                    return `<span class="option-mark"><span class="color-dot ${value}"></span></span>`;
                }
                if (type === "shape") {
                    return `<span class="option-mark"><span class="shape-mark ${value}"></span></span>`;
                }
                return `<span class="option-mark"><span class="size-mark ${value}"></span></span>`;
            }

            function buildReviewRows() {
                elements.reviewRows.innerHTML = REVIEW_ORDER.map((type) => {
                    const chips = VALUES[type].map((value) => {
                        const count = state.level.counts[`${type}:${value}`];
                        return `
                            <div class="review-chip" data-type="${type}" data-value="${value}">
                                ${markerMarkup(type, value)}
                                <span><small>${LABELS[value]}</small><strong>${count}</strong></span>
                            </div>
                        `;
                    }).join("");
                    return `
                        <div class="review-row" data-review-type="${type}">
                            <div class="review-row-label">${LABELS[type]}で<br>なかまわけ</div>
                            <div class="review-groups">${chips}</div>
                        </div>
                    `;
                }).join("");
            }

            function chooseAnswer(type, value, button) {
                if (state.phase !== "choose") return;
                state.phase = "review";
                state.selection = { type, value };
                elements.optionButtons.forEach((option) => {
                    option.disabled = true;
                    option.classList.toggle("selected", option === button);
                });
                showReview();
            }

            function showReview() {
                buildReviewRows();
                elements.review.hidden = false;
                elements.headerMessage.textContent = "きっちり なかまわけ しています…";

                REVIEW_ORDER.forEach((type, index) => {
                    schedule(() => {
                        const row = elements.reviewRows.querySelector(`[data-review-type="${type}"]`);
                        row?.classList.add("shown");
                        Sound.sort(index);
                    }, index * 390 + 130);
                });

                schedule(showFinalAnswer, 1370);
            }

            function showFinalAnswer() {
                const answer = state.level.answer;
                const selected = state.selection;
                const correct = answer.type === selected.type && answer.value === selected.value;
                const winningChip = elements.reviewRows.querySelector(
                    `[data-type="${answer.type}"][data-value="${answer.value}"]`
                );
                const selectedChip = elements.reviewRows.querySelector(
                    `[data-type="${selected.type}"][data-value="${selected.value}"]`
                );
                selectedChip?.classList.add("picked");
                winningChip?.classList.add("winner");

                if (correct) {
                    state.correct += 1;
                    state.candies += answer.count;
                    Sound.correct();
                    elements.finalAnswer.classList.add("correct");
                    elements.finalAnswer.innerHTML = `
                        <div>せいかい！　${LABELS[answer.value]}が <b>${answer.count}こ</b>で いちばんおおい！ この びんを まるごと もらえるのです！</div>
                    `;
                } else {
                    Sound.wrong();
                    elements.finalAnswer.classList.add("wrong");
                    elements.finalAnswer.innerHTML = `
                        <div>おしい！　いちばんおおいのは <b>${LABELS[answer.type]}の「${LABELS[answer.value]}」 ${answer.count}こ</b>でした。</div>
                    `;
                }

                elements.finalAnswer.classList.add("shown");
                elements.next.textContent = nextButtonText();
                schedule(() => elements.next.classList.add("shown"), 260);
            }

            function nextButtonText() {
                if (state.mode === "practice") {
                    return state.practiceIndex >= PRACTICE_TYPES.length - 1 ? "れんしゅう おわり" : "つぎの れんしゅう";
                }
                return state.roundIndex >= CHALLENGE_ROUNDS - 1 ? "けっかを みる" : "つぎの もんだい";
            }

            function nextRound() {
                if (!elements.next.classList.contains("shown")) return;
                Sound.click();
                if (state.mode === "practice") {
                    state.practiceIndex += 1;
                    if (state.practiceIndex >= PRACTICE_TYPES.length) {
                        showGuide(
                            "ばっちりなのです！",
                            "おおきさ・いろ・かたちを くらべると、 いちばんおとくな びんが わかるのです！ ほんばんも きっちり いきましょう！",
                            "タイトルへ",
                            "practice-finish"
                        );
                        return;
                    }
                    loadRound(PRACTICE_TYPES[state.practiceIndex]);
                    return;
                }

                state.roundIndex += 1;
                if (state.roundIndex >= CHALLENGE_ROUNDS) {
                    finishChallenge();
                } else {
                    loadRound();
                }
            }

            function loadRound(forcedType = null) {
                state.level = generateLevel(forcedType);
                renderLevel();
            }

            function resetSession(mode) {
                clearTiming();
                Sound.init();
                state.mode = mode;
                state.phase = "idle";
                state.roundIndex = 0;
                state.practiceIndex = 0;
                state.correct = 0;
                state.candies = 0;
                state.elapsed = 0;
                state.level = null;
                state.selection = null;
                elements.timeDisplay.textContent = "0:00";
                elements.guide.hidden = true;
                elements.review.hidden = true;
                showScreen("game");
            }

            function showGuide(heading, copy, buttonText, action) {
                elements.guideHeading.textContent = heading;
                elements.guideCopy.innerHTML = copy;
                elements.guideAction.textContent = buttonText;
                elements.guideAction.dataset.action = action;
                elements.guide.hidden = false;
            }

            function startPractice() {
                resetSession("practice");
                loadRound(PRACTICE_TYPES[0]);
                showGuide(
                    "れんしゅうです！",
                    "キャンディは <b>きっちり</b> なかまわけしたいのです！<br><br>いちばんおおい なかまの びんを えらぶと、 その びんを まるごと もらえるのです。 とっても おとくなのです！",
                    "やってみる！",
                    "practice-start"
                );
            }

            function startChallenge() {
                resetSession("challenge");
                loadRound();
                startTimer();
            }

            function finishChallenge() {
                clearTiming();
                state.phase = "finished";
                const result = { correct: state.correct, time: state.elapsed };
                const isNew = isBetterRecord(result, state.best);
                updateBest(result);
                Sound.finish();

                elements.resultCorrect.textContent = `${state.correct}/${CHALLENGE_ROUNDS}`;
                elements.resultCandies.textContent = `${state.candies}こ`;
                elements.resultTime.textContent = formatTime(state.elapsed);
                elements.resultBest.classList.toggle("new", isNew);
                elements.resultBest.textContent = isNew
                    ? "🏆 さいこうきろくなのです！"
                    : `さいこう：${state.best.correct}/10　${formatTime(state.best.time)}`;

                if (state.correct === CHALLENGE_ROUNDS) {
                    elements.resultHeading.textContent = "きっちり ぜんもんせいかい！";
                    elements.resultCopy.textContent = `${state.candies}この キャンディを おとくに もらえたのです！`;
                } else {
                    elements.resultHeading.textContent = "たくさん もらえた！";
                    elements.resultCopy.textContent = `${state.candies}この キャンディを もらえたのです！ つぎは もっと おとくにいけそうです！`;
                }
                showScreen("result");
            }

            function returnToTitle() {
                clearTiming();
                state.phase = "idle";
                elements.guide.hidden = true;
                elements.review.hidden = true;
                updateBest();
                showScreen("title");
            }

            elements.practice.addEventListener("click", startPractice);
            elements.start.addEventListener("click", startChallenge);
            elements.quit.addEventListener("click", returnToTitle);
            elements.optionButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    Sound.click();
                    chooseAnswer(button.dataset.type, button.dataset.value, button);
                });
            });
            elements.next.addEventListener("click", nextRound);
            elements.guideAction.addEventListener("click", () => {
                Sound.click();
                const action = elements.guideAction.dataset.action;
                elements.guide.hidden = true;
                if (action === "practice-finish") returnToTitle();
            });
            elements.retry.addEventListener("click", startChallenge);
            elements.resultTitle.addEventListener("click", returnToTitle);
            elements.sound.addEventListener("click", () => {
                state.soundOn = !state.soundOn;
                elements.sound.textContent = state.soundOn ? "🔊" : "🔇";
                elements.sound.setAttribute("aria-pressed", String(state.soundOn));
                if (state.soundOn) Sound.click();
            });

            state.best = readBest();
            updateBest();
            showScreen("title");
        })();
    </script>
</body>
</html>
