  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.querySelector("#root");
        if (!root) return;

        const fixTitleLogo = () => {
          const logo = root.querySelector(".title-logo-image");
          if (logo && !logo.src.endsWith("/games/waterworks/title-logo-waterworks-v1.png")) {
            logo.src = "./title-logo-waterworks-v1.png";
          }
        };

        new MutationObserver(fixTitleLogo).observe(root, {
          childList: true,
          subtree: true
        });
        fixTitleLogo();
      })();
    </script>
  </body>
