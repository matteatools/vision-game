<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わがままアイスクリーム</title>
  <meta name="description" content="わがままなお嬢様のアイスオーダーを推理して当てるヒット＆ブローゲーム！">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+P+One&family=Nunito:wght@400;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== タイトル画面 ===== -->
  <div id="screen-title" class="screen active">
    <div class="title-bg">
      <div class="floating-scoops">
        <span class="fsco s1">🍓</span>
        <span class="fsco s2">🍋</span>
        <span class="fsco s3">🍇</span>
        <span class="fsco s4">🍈</span>
        <span class="fsco s5">🍊</span>
      </div>
    </div>
    <div class="title-card">
      <div class="title-deco">🍓🍋🍇🍈🍊🍫</div>
      <h1 class="title-logo">
        <span class="t1">わ</span><span class="t2">が</span><span class="t3">ま</span><span class="t4">ま</span>
        <br>
        <span class="t5">ア</span><span class="t6">イ</span><span class="t7">ス</span><span class="t8">ク</span><span
          class="t9">リ</span><span class="t10">ー</span><span class="t11">ム</span>
      </h1>
      <p class="title-sub">あたしのオーダーを当ててね！</p>
      <div class="difficulty-section">
        <p class="difficulty-label">むずかしさ</p>
        <div class="difficulty-buttons">
          <button id="btn-easy" class="diff-btn easy" onclick="startGame('easy')">
            <span class="diff-icon">😊</span>
            <span class="diff-name">かんたん</span>
            <span class="diff-desc">フレーバー 8しゅ</span>
          </button>
          <button id="btn-normal" class="diff-btn normal" onclick="startGame('normal')">
            <span class="diff-icon">🤔</span>
            <span class="diff-name">ふつう</span>
            <span class="diff-desc">フレーバー 10しゅ</span>
          </button>
          <button id="btn-hard" class="diff-btn hard" onclick="startGame('hard')">
            <span class="diff-icon">😤</span>
            <span class="diff-name">むずかしい</span>
            <span class="diff-desc">フレーバー 12しゅ</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== ゲーム画面 ===== -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <button class="back-btn" onclick="gotoTitle()">⬅ もどる</button>
      <div class="turn-info">
        <span id="diff-label" class="diff-badge"></span>
        <span class="turn-text">のこり <span id="turns-left" class="turn-number">10</span> かい</span>
        <div class="hearts" id="heart-row"></div>
      </div>
    </div>

    <div class="game-body">
      <!-- キャラクター＆セリフ (char) -->
      <div class="char-area">
        <div class="speech-bubble" id="speech-bubble">
          <p id="speech-text">さあ、あたしのオーダーを当ててみて！</p>
        </div>
        <div class="char-wrap">
          <div class="char-figure" id="char-figure">
            <img id="char-img-allwrong"  class="char-img active" src="13/13O.png" alt="すべてまちがい">
            <img id="char-img-blow12"    class="char-img" src="13/13N.png" alt="1か2ブロウ">
            <img id="char-img-blow3"     class="char-img" src="13/13G.png" alt="3ブロウ">
            <img id="char-img-hit1blow0" class="char-img" src="13/13B.png" alt="1ヒット0ブロウ">
            <img id="char-img-hit1blow1" class="char-img" src="13/13B.png" alt="1ヒット1ブロウ">
            <img id="char-img-hit1blow2" class="char-img" src="13/13C.png" alt="1ヒット2ブロウ">
            <img id="char-img-hit2blow0" class="char-img" src="13/13C.png" alt="2ヒット0ブロウ">
            <img id="char-img-victory"   class="char-img" src="13/13E.png" alt="クリア">
            <img id="char-img-gameover"  class="char-img" src="13/13M.png" alt="ゲームオーバー">
            <img id="char-img-thinking"  class="char-img" src="13/13N.png" alt="考え中">
          </div>
        </div>
      </div>

      <!-- コーンエリア (cone) -->
      <div class="cone-area">
        <!-- コーンプレビュー -->
        <div class="cone-preview">
          <svg id="cone-svg" viewBox="0 0 200 360" xmlns="http://www.w3.org/2000/svg">
            <!-- コーン画像 -->
            <image href="corn.png" x="-80" y="30" width="360" height="480" preserveAspectRatio="xMidYMid meet"/>

            <!-- スクープ bot (下) -->
            <g id="scoop-bot-group"
               ondragover="allowDrop(event)"
               ondrop="dropFlavor(event,'bot')"
               ondragenter="scoopDragEnter(event,'bot')"
               ondragleave="scoopDragLeave(event,'bot')">
              <ellipse id="scoop-bot-shadow" cx="100" cy="250" rx="51" ry="12" fill="rgba(0,0,0,0.09)" />
              <path id="scoop-bot" d="M49 238 A51 51 0 0 1 151 238 Z" fill="#E8E8E8" stroke="rgba(255,255,255,0.8)"
                stroke-width="2.5" />
              <text id="scoop-bot-text" x="100" y="229" text-anchor="middle" font-size="15" fill="rgba(0,0,0,0.3)"
                font-family="'Mochiy Pop P One',sans-serif">？</text>
            </g>

            <!-- スクープ mid (中) -->
            <g id="scoop-mid-group"
               ondragover="allowDrop(event)"
               ondrop="dropFlavor(event,'mid')"
               ondragenter="scoopDragEnter(event,'mid')"
               ondragleave="scoopDragLeave(event,'mid')">
              <ellipse id="scoop-mid-shadow" cx="100" cy="198" rx="48" ry="11" fill="rgba(0,0,0,0.08)" />
              <path id="scoop-mid" d="M52 187 A48 48 0 0 1 148 187 Z" fill="#E0E0E0" stroke="rgba(255,255,255,0.8)"
                stroke-width="2.5" />
              <text id="scoop-mid-text" x="100" y="178" text-anchor="middle" font-size="15" fill="rgba(0,0,0,0.3)"
                font-family="'Mochiy Pop P One',sans-serif">？</text>
            </g>

            <!-- スクープ top (上) -->
            <g id="scoop-top-group"
               ondragover="allowDrop(event)"
               ondrop="dropFlavor(event,'top')"
               ondragenter="scoopDragEnter(event,'top')"
               ondragleave="scoopDragLeave(event,'top')">
              <ellipse id="scoop-top-shadow" cx="100" cy="150" rx="45" ry="9" fill="rgba(0,0,0,0.07)" />
              <path id="scoop-top" d="M55 141 A45 45 0 0 1 145 141 Z" fill="#D8D8D8" stroke="rgba(255,255,255,0.8)"
                stroke-width="2.5" />
              <text id="scoop-top-text" x="100" y="132" text-anchor="middle" font-size="15" fill="rgba(0,0,0,0.3)"
                font-family="'Mochiy Pop P One',sans-serif">？</text>
            </g>
          </svg>
        </div>

        <div class="cone-actions">
          <button class="clear-btn" onclick="clearSlots()">🔄 クリア</button>
          <button class="submit-btn" id="submit-btn" onclick="submitGuess()" disabled>✅ このアイスで！</button>
        </div>
      </div>

      <!-- 履歴エリア (history) -->
      <div class="history-area" id="history-area">
        <h3 class="history-title">これまでのヒント</h3>
        <div class="history-list" id="history-list"></div>
      </div>

      <!-- フレーバーパレット (palette) -->
      <div class="palette-area">
        <h2 class="section-title">フレーバー</h2>
        <div class="flavor-grid" id="flavor-grid"></div>
      </div>
    </div>

  </div>

  <!-- ===== クリア画面 ===== -->
  <div id="screen-clear" class="screen">
    <div class="result-card clear-card">
      <img id="result-char-img" class="result-char-img" src="" alt="キャラクター">
      <h2 class="result-title clear-title">せいかい！</h2>
      <p class="result-msg" id="clear-msg">すごい！ぴったりよ！</p>
      <div class="answer-reveal" id="clear-answer"></div>
      <div class="result-buttons">
        <button class="retry-btn" onclick="retryGame()">もう一度</button>
        <button class="title-btn" onclick="gotoTitle()">タイトルへ</button>
      </div>
    </div>
  </div>

  <!-- ===== ゲームオーバー画面 ===== -->
  <div id="screen-gameover" class="screen">
    <div class="result-card gameover-card">
      <img id="gameover-char-img" class="result-char-img" src="13/13M.png" alt="ゲームオーバー">
      <h2 class="result-title gameover-title">アイスが溶けちゃった！</h2>
      <p class="result-msg" id="gameover-msg">もうっ、さっさととけたじゃない</p>
      <div class="answer-reveal" id="gameover-answer"></div>
      <div class="result-buttons">
        <button class="retry-btn" onclick="retryGame()">もう一度</button>
        <button class="title-btn" onclick="gotoTitle()">タイトルへ</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
