<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おおきさあわせ ゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #fdf6e3; /* 優しいクリーム色 */
            touch-action: manipulation; /* スマホでのダブルタップズーム防止 */
            overflow: hidden; /* スクロール防止 */
        }

        .shape-element {
            display: flex;
            align-items: center;
            justify-content: center;
            /* widthとheightだけアニメーションさせ、フォントサイズは即時反映でガタつきを抑える */
            transition: width 0.05s linear, height 0.05s linear;
            text-shadow: 0 4px 6px rgba(0,0,0,0.1);
            line-height: 1;
        }

        /* 楽しいボタンのアニメーション */
        .btn-pop {
            transition: transform 0.1s;
        }
        .btn-pop:active {
            transform: scale(0.95);
        }

        /* ふわふわ浮かぶアニメーション（タイトル用） */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        /* ポップな水玉背景 */
        .bg-polka {
            background-color: #e0f2fe; /* 明るい水色 */
            background-image: radial-gradient(#bae6fd 20%, transparent 20%), radial-gradient(#bae6fd 20%, transparent 20%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }

        /* 大きさが変わるアニメーション（ゲーム説明用） */
        @keyframes pulse-size {
            0%, 100% { transform: scale(0.5); }
            50% { transform: scale(1.4); }
        }
        .animate-pulse-size {
            animation: pulse-size 2.5s infinite ease-in-out;
        }
    </style>
</head>
<!-- h-screen から h-[100dvh] に変更し、スマホでのスクロールガタつきを防止 -->
<body class="w-screen h-[100dvh] flex flex-col items-center justify-center text-gray-800">

    <!-- アプリ全体のコンテナ -->
    <div id="app" class="w-full h-full max-w-4xl max-h-[900px] bg-white md:rounded-3xl shadow-2xl relative overflow-hidden flex flex-col">
        
        <!-- ヘッダー（スコアや戻るボタン） -->
        <div class="h-16 bg-yellow-100 flex justify-between items-center px-4 md:px-8 border-b-4 border-yellow-300 z-10 shrink-0">
            <button id="btn-back" class="hidden text-yellow-700 font-bold bg-yellow-200 px-4 py-2 rounded-full shadow-sm btn-pop hover:bg-yellow-300">
                ◀ タイトルへ
            </button>
            <div id="header-title" class="text-xl md:text-2xl font-bold text-yellow-600 flex-1 text-center">
                おおきさあわせ
            </div>
            <div class="text-xs md:text-sm font-bold text-gray-600 text-right leading-tight bg-white/50 px-2 py-1 rounded-lg">
                <div>じどう: <span id="high-score-auto" class="text-red-500 text-base md:text-lg">0.00</span>%</div>
                <div>ちょうせい: <span id="high-score-dial" class="text-red-500 text-base md:text-lg">0.00</span>%</div>
            </div>
        </div>

        <!-- メイン画面エリア -->
        <div class="flex-1 relative flex flex-col overflow-hidden">
            
            <!-- 1. タイトル画面 -->
            <div id="screen-title" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-polka p-4">
                
                <!-- アイコンエリア (大きさが変わるアニメーションでゲーム内容を視覚的に表現) -->
                <div class="relative w-40 h-40 mb-2 flex items-center justify-center">
                    <!-- 見本の枠（くるくる回る） -->
                    <div class="absolute w-32 h-32 border-[6px] border-dashed border-sky-400 rounded-full opacity-60 animate-[spin_10s_linear_infinite]"></div>
                    <!-- 大きさが変わる図形 -->
                    <div id="title-icon" class="shape-element text-pink-500 animate-pulse-size drop-shadow-lg z-10" style="font-size: 80px;">●</div>
                </div>

                <!-- 白フチ＋黄色い影のポップなタイトル文字 -->
                <h1 class="text-4xl md:text-6xl font-extrabold text-pink-500 mb-6 text-center leading-tight tracking-wider" style="text-shadow: -3px -3px 0px #fff, 3px -3px 0px #fff, -3px 3px 0px #fff, 3px 3px 0px #fff, 3px 0px 0px #fff, -3px 0px 0px #fff, 0px 3px 0px #fff, 0px -3px 0px #fff, 5px 5px 0px #fde047;">
                    ぴったり！<br>おおきさあわせ
                </h1>
                
                <div class="bg-white/90 backdrop-blur-sm px-6 py-2 rounded-full shadow-sm border-2 border-white mb-8">
                    <p class="text-base md:text-lg font-bold text-sky-600 text-center">
                        みほんと おなじおおきさで とめよう！
                    </p>
                </div>

                <div class="flex flex-col md:flex-row gap-4 w-full max-w-md">
                    <button onclick="startGame('auto')" class="flex-1 btn-pop bg-green-400 hover:bg-green-500 text-white rounded-2xl shadow-[0_6px_0_#2f855a] border-2 border-green-300 p-3 md:p-4 flex flex-col items-center justify-center group transition-colors">
                        <span class="text-2xl md:text-3xl font-bold mb-1 drop-shadow-sm">じどう</span>
                        <span class="text-xs md:text-sm font-bold bg-green-500/60 px-3 py-1 rounded-full group-hover:bg-green-600/60 transition-colors">ボタンで とめる</span>
                    </button>
                    <button onclick="startGame('dial')" class="flex-1 btn-pop bg-yellow-400 hover:bg-yellow-500 text-white rounded-2xl shadow-[0_6px_0_#b7791f] border-2 border-yellow-300 p-3 md:p-4 flex flex-col items-center justify-center group transition-colors">
                        <span class="text-2xl md:text-3xl font-bold mb-1 drop-shadow-sm">ちょうせい</span>
                        <span class="text-xs md:text-sm font-bold bg-yellow-500/60 px-3 py-1 rounded-full group-hover:bg-yellow-600/60 transition-colors">スライダーで あわせる</span>
                    </button>
                </div>
            </div>

            <!-- 2. ゲーム画面 & コントロール -->
            <div id="screen-game" class="hidden flex-1 flex flex-col h-full">
                
                <!-- 図形エリア (左右/上下 に均等分割され、中心が完璧に合う) -->
                <div class="flex-1 flex flex-col md:flex-row relative">
                    <!-- 見本エリア -->
                    <div class="flex-1 flex items-center justify-center relative border-b-4 md:border-b-0 md:border-r-4 border-dashed border-gray-300 bg-blue-50 overflow-hidden">
                        <span class="absolute top-4 left-4 text-xl font-bold text-blue-500 bg-white px-3 py-1 rounded-full shadow z-10">みほん</span>
                        <div id="target-shape" class="shape-element text-blue-500 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-opacity duration-200" style="width: 100px; height: 100px; font-size: 80px;">●</div>
                    </div>

                    <!-- プレイエリア -->
                    <div id="play-area" class="flex-1 flex items-center justify-center relative bg-blue-50 overflow-hidden">
                        <span class="absolute top-4 left-4 text-xl font-bold text-blue-500 bg-white px-3 py-1 rounded-full shadow z-10">きみのかたち</span>
                        <div id="player-shape" class="shape-element text-blue-500 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 transition-opacity duration-200" style="width: 50px; height: 50px; font-size: 40px;">●</div>
                        
                        <!-- 縦スライダー (ダイヤルモード用、右端に固定) -->
                        <div id="slider-container" class="hidden absolute right-2 md:right-6 top-1/2 transform -translate-y-1/2 flex-col items-center justify-center bg-white/90 p-2 md:p-3 rounded-2xl shadow-sm border-2 border-orange-200 z-10">
                            <input type="range" id="size-slider" orient="vertical" class="w-8 h-32 md:h-48 bg-orange-200 rounded-lg cursor-pointer accent-orange-500" style="-webkit-appearance: slider-vertical; appearance: slider-vertical; writing-mode: bt-lr;">
                        </div>
                    </div>
                </div>

                <!-- 操作エリア (画面下部に固定) -->
                <div class="w-full bg-white border-t-4 border-gray-200 p-3 md:p-4 shrink-0 z-10">
                    <div class="max-w-md mx-auto">
                        <!-- じどうモード用 -->
                        <div id="controls-auto" class="hidden w-full">
                            <button id="btn-stop" class="w-full btn-pop bg-red-500 hover:bg-red-600 text-white text-3xl font-bold py-4 rounded-full shadow-[0_8px_0_#9b2c2c] border-4 border-white active:translate-y-2 active:shadow-[0_0px_0_#9b2c2c]">
                                ストップ！！
                            </button>
                        </div>

                        <!-- ダイヤルモード用 -->
                        <div id="controls-dial" class="hidden w-full flex-col gap-2">
                            <p class="text-center text-orange-600 font-bold text-sm mb-1 bg-orange-50 rounded-full py-1">よこのスライダーで あわせよう！</p>
                            <button id="btn-decide" class="w-full btn-pop bg-orange-500 hover:bg-orange-600 text-white text-3xl font-bold py-3 rounded-full shadow-[0_8px_0_#c05621] border-4 border-white active:translate-y-2 active:shadow-[0_0px_0_#c05621]">
                                これだ！！
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 結果画面 (シームレスなアニメーション用) -->
            <div id="screen-result" class="hidden absolute inset-0 z-30 overflow-hidden pointer-events-none">
                <!-- 背景フェードイン -->
                <div id="result-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm opacity-0 transition-opacity duration-500 pointer-events-auto"></div>

                <!-- アニメーション用の図形 (ストップした図形がそのまま動くように見せる) -->
                <div id="anim-target" class="shape-element text-blue-500 absolute transform -translate-x-1/2 -translate-y-1/2 opacity-0 z-40">●</div>
                <div id="anim-player" class="shape-element text-blue-500 absolute transform -translate-x-1/2 -translate-y-1/2 opacity-0 z-50 mix-blend-multiply" style="color: rgba(59, 130, 246, 0.7);">●</div>

                <!-- 結果カード -->
                <div id="result-content" class="absolute inset-0 flex flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-500 pointer-events-none z-30">
                    <!-- mt-32 md:mt-16 で、合体した図形(見本位置)とカードが被らないようにレスポンシブ調整 -->
                    <div class="text-center bg-white p-6 md:p-12 rounded-3xl shadow-2xl border-4 border-yellow-400 max-w-lg w-full mt-32 md:mt-16 pointer-events-auto relative">
                        <h2 id="result-message" class="text-xl sm:text-2xl md:text-4xl whitespace-nowrap font-bold text-gray-700 mb-4">結果は...？</h2>
                        
                        <div class="flex justify-center items-end gap-2 mb-2">
                            <span class="text-2xl text-gray-600 font-bold mb-2">いっちど</span>
                            <span id="result-score" class="text-6xl md:text-7xl font-bold text-red-500">0.00</span>
                            <span class="text-4xl font-bold text-gray-500 mb-2">%</span>
                        </div>

                        <div id="new-record-badge" class="hidden mb-4 animate-bounce">
                            <span class="bg-red-500 text-white text-xl font-bold px-6 py-2 rounded-full shadow-lg">✨しんきろく！✨</span>
                        </div>

                        <div class="flex flex-col gap-3 mt-4">
                            <button onclick="startGame(currentMode)" class="w-full btn-pop bg-orange-400 hover:bg-orange-500 text-white text-2xl font-bold py-4 rounded-full shadow-[0_6px_0_#c05621]">もういちど</button>
                            <button onclick="showTitle()" class="w-full btn-pop bg-gray-300 hover:bg-gray-400 text-gray-700 text-xl font-bold py-3 rounded-full shadow-[0_4px_0_#a0aec0]">タイトルへもどる</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- 音の準備 (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'stop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'fail') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // --- ゲームの変数 ---
        const shapes = ['●', '■', '▲', '★', '♥', '♪'];
        let currentShapeChar = '●';
        let currentMode = 'auto'; // 'auto' または 'dial'
        let targetSize = 100;
        let playerSize = 50;
        let isGrowing = true;
        let gameLoopId = null;
        let isPlaying = false;
        
        const AUTO_SPEED = 2.0;
        const MIN_SIZE = 30;

        const getMaxSize = () => {
            const container = document.getElementById('play-area');
            if (!container) return 150;
            // 図形エリアの短い方の80%を最大サイズにする
            return Math.min(container.clientWidth, container.clientHeight) * 0.8; 
        };

        // --- 画面要素の取得 ---
        const screenTitle = document.getElementById('screen-title');
        const screenGame = document.getElementById('screen-game');
        const screenResult = document.getElementById('screen-result');
        const elTarget = document.getElementById('target-shape');
        const elPlayer = document.getElementById('player-shape');
        const btnStop = document.getElementById('btn-stop');
        const btnDecide = document.getElementById('btn-decide');
        const sizeSlider = document.getElementById('size-slider');
        const btnBack = document.getElementById('btn-back');
        const headerTitle = document.getElementById('header-title');
        const highScoreAutoDisplay = document.getElementById('high-score-auto');
        const highScoreDialDisplay = document.getElementById('high-score-dial');

        // --- ハイスコアの読み込み ---
        let legacyScore = localStorage.getItem('ookisa_highscore');
        if (legacyScore !== null && localStorage.getItem('ookisa_highscore_auto') === null) {
            localStorage.setItem('ookisa_highscore_auto', parseFloat(legacyScore).toFixed(2));
        }

        let highScores = {
            auto: parseFloat(localStorage.getItem('ookisa_highscore_auto')) || 0.00,
            dial: parseFloat(localStorage.getItem('ookisa_highscore_dial')) || 0.00
        };
        highScoreAutoDisplay.innerText = highScores.auto.toFixed(2);
        highScoreDialDisplay.innerText = highScores.dial.toFixed(2);

        // --- 関数 ---

        // 表示の初期化
        function resetDisplay() {
            elTarget.style.opacity = '1';
            elPlayer.style.opacity = '1';
            document.getElementById('result-overlay').classList.add('opacity-0');
            document.getElementById('result-content').classList.add('opacity-0');
            document.getElementById('anim-target').style.opacity = '0';
            document.getElementById('anim-player').style.opacity = '0';
            screenResult.classList.add('hidden');
        }

        // タイトル画面を表示
        function showTitle() {
            playSound('click');
            cancelAnimationFrame(gameLoopId);
            isPlaying = false;
            
            resetDisplay();
            
            screenTitle.classList.remove('hidden');
            screenGame.classList.add('hidden');
            btnBack.classList.add('hidden');
            headerTitle.innerText = "おおきさあわせ";

            // タイトルのアイコンもランダムに変更
            document.getElementById('title-icon').innerText = shapes[Math.floor(Math.random() * shapes.length)];
        }

        // ゲーム開始
        function startGame(mode) {
            playSound('click');
            currentMode = mode;
            isPlaying = true;

            resetDisplay();

            screenTitle.classList.add('hidden');
            screenGame.classList.remove('hidden');
            screenGame.classList.add('flex');
            btnBack.classList.remove('hidden');
            
            const modeName = mode === 'auto' ? 'じどう' : 'ちょうせい';
            headerTitle.innerText = `プレイ中 (${modeName})`;

            // モードによるUIの切り替え
            const sliderContainer = document.getElementById('slider-container');
            if (mode === 'auto') {
                document.getElementById('controls-auto').classList.remove('hidden');
                document.getElementById('controls-dial').classList.add('hidden');
                document.getElementById('controls-dial').classList.remove('flex');
                sliderContainer.classList.add('hidden');
                sliderContainer.classList.remove('flex');
            } else {
                document.getElementById('controls-auto').classList.add('hidden');
                document.getElementById('controls-dial').classList.remove('hidden');
                document.getElementById('controls-dial').classList.add('flex');
                sliderContainer.classList.remove('hidden');
                sliderContainer.classList.add('flex');
                
                sizeSlider.min = MIN_SIZE;
                sizeSlider.max = getMaxSize();
                sizeSlider.value = MIN_SIZE;
            }

            // 図形をランダムに選ぶ
            currentShapeChar = shapes[Math.floor(Math.random() * shapes.length)];
            elTarget.innerText = currentShapeChar;
            elPlayer.innerText = currentShapeChar;

            // 見本の大きさをランダムに決める
            const MAX_SIZE = getMaxSize();
            targetSize = Math.floor(Math.random() * (MAX_SIZE - 60)) + 60;
            
            elTarget.style.width = `${targetSize}px`;
            elTarget.style.height = `${targetSize}px`;
            elTarget.style.fontSize = `${targetSize * 0.8}px`;

            // プレイヤーの初期設定
            playerSize = MIN_SIZE;
            isGrowing = true;
            updatePlayerSize();

            cancelAnimationFrame(gameLoopId);
            if (currentMode === 'auto') {
                gameLoop();
            }
        }

        // 大きさを更新して画面に反映
        function updatePlayerSize() {
            elPlayer.style.width = `${playerSize}px`;
            elPlayer.style.height = `${playerSize}px`;
            elPlayer.style.fontSize = `${playerSize * 0.8}px`;
        }

        // アニメーションループ
        function gameLoop() {
            if (!isPlaying || currentMode !== 'auto') return;

            const speed = AUTO_SPEED;
            const MAX_SIZE = getMaxSize();

            if (isGrowing) {
                playerSize += speed;
                if (playerSize >= MAX_SIZE) isGrowing = false;
            } else {
                playerSize -= speed;
                if (playerSize <= MIN_SIZE) isGrowing = true;
            }

            updatePlayerSize();
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        // ストップボタン（または決定ボタン）を押したときのアニメーション処理
        function stopGame() {
            if (!isPlaying) return;
            playSound('stop');
            isPlaying = false;
            cancelAnimationFrame(gameLoopId);

            const animTarget = document.getElementById('anim-target');
            const animPlayer = document.getElementById('anim-player');

            // 今ある図形の「画面上の絶対位置」を計算
            const appRect = document.getElementById('app').getBoundingClientRect();
            const targetRect = elTarget.getBoundingClientRect();
            const playerRect = elPlayer.getBoundingClientRect();

            const targetX = targetRect.left - appRect.left + targetRect.width / 2;
            const targetY = targetRect.top - appRect.top + targetRect.height / 2;
            const playerX = playerRect.left - appRect.left + playerRect.width / 2;
            const playerY = playerRect.top - appRect.top + playerRect.height / 2;

            // トランジションを一時停止して、アニメーション用図形を現在位置へ配置
            animTarget.style.transition = 'none';
            animPlayer.style.transition = 'none';

            animTarget.innerText = currentShapeChar;
            animPlayer.innerText = currentShapeChar;
            
            animTarget.style.width = `${targetSize}px`;
            animTarget.style.height = `${targetSize}px`;
            animTarget.style.fontSize = `${targetSize * 0.8}px`;
            
            animPlayer.style.width = `${playerSize}px`;
            animPlayer.style.height = `${playerSize}px`;
            animPlayer.style.fontSize = `${playerSize * 0.8}px`;

            animTarget.style.left = `${targetX}px`;
            animTarget.style.top = `${targetY}px`;
            animPlayer.style.left = `${playerX}px`;
            animPlayer.style.top = `${playerY}px`;

            // 重なる時に分かりやすいよう、動く図形を少し半透明にする
            animTarget.style.opacity = '1';
            animPlayer.style.opacity = '0.6';

            // ゲーム画面のもともとの図形を隠す
            elTarget.style.opacity = '0';
            elPlayer.style.opacity = '0';

            // リザルトレイヤーを表示
            screenResult.classList.remove('hidden');

            // 強制リフロー (CSSを確実に適用させる)
            void animTarget.offsetWidth;

            // トランジションを有効化
            animTarget.style.transition = 'all 1s ease-in-out';
            animPlayer.style.transition = 'all 1s ease-in-out';

            // 背景を白くフェードイン
            document.getElementById('result-overlay').classList.remove('opacity-0');

            // 少し待ってから、見本図形の位置へ向けて移動開始！
            // スマホでもPCでも、自分の図形が見本に吸い込まれるような自然な動きになります。
            setTimeout(() => {
                animPlayer.style.left = `${targetX}px`;
                animPlayer.style.top = `${targetY}px`;

                // 移動が終わった頃（1秒後）にスコア判定を表示
                setTimeout(() => {
                    showScoreResult();
                }, 1000);
            }, 50);
        }

        // スライダーを動かしたとき（ダイヤルモード用）
        sizeSlider.addEventListener('input', (e) => {
            if (!isPlaying || currentMode !== 'dial') return;
            playerSize = parseFloat(e.target.value);
            updatePlayerSize();
        });

        // スコア結果の表示
        function showScoreResult() {
            // 一致度の計算
            const diff = Math.abs(targetSize - playerSize);
            let score = Math.max(0, 100 - (diff / targetSize) * 100);
            
            const scoreStr = score.toFixed(2);
            const scoreNum = parseFloat(scoreStr);
            document.getElementById('result-score').innerText = scoreStr;

            const msgEl = document.getElementById('result-message');

            // メッセージの決定
            if (scoreNum >= 99.50) {
                msgEl.innerText = "✨ぴったり！！天才！✨";
                msgEl.className = "text-xl sm:text-2xl md:text-4xl whitespace-nowrap font-bold text-red-500 mb-4";
                playSound('success');
            } else if (scoreNum >= 98.00) {
                msgEl.innerText = "おお！すごくおしい！";
                msgEl.className = "text-xl sm:text-2xl md:text-4xl whitespace-nowrap font-bold text-orange-500 mb-4";
                playSound('success');
            } else if (scoreNum >= 90.00) {
                msgEl.innerText = "いいかんじ！";
                msgEl.className = "text-xl sm:text-2xl md:text-4xl whitespace-nowrap font-bold text-yellow-500 mb-4";
                playSound('fail');
            } else {
                msgEl.innerText = "もうちょっと！";
                msgEl.className = "text-xl sm:text-2xl md:text-4xl whitespace-nowrap font-bold text-blue-500 mb-4";
                playSound('fail');
            }

            // ハイスコア更新チェック
            const badge = document.getElementById('new-record-badge');
            if (scoreNum > highScores[currentMode]) {
                highScores[currentMode] = scoreNum;
                localStorage.setItem(`ookisa_highscore_${currentMode}`, highScores[currentMode].toFixed(2));
                
                if (currentMode === 'auto') {
                    highScoreAutoDisplay.innerText = highScores.auto.toFixed(2);
                } else {
                    highScoreDialDisplay.innerText = highScores.dial.toFixed(2);
                }
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            // ポップアップカードをフェードイン表示
            document.getElementById('result-content').classList.remove('opacity-0');
        }

        // --- イベントリスナー ---
        btnStop.addEventListener('click', stopGame);
        btnDecide.addEventListener('click', stopGame);
        
        btnStop.addEventListener('touchstart', (e) => {
            e.preventDefault();
            stopGame();
        }, {passive: false});

        btnDecide.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            stopGame();
        }, {passive: false});

        btnBack.addEventListener('click', showTitle);

    </script>
</body>
</html>
