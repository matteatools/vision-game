<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#5d4ed6">
    <title>あとだし じゃんけん！</title>
    <meta name="description" content="しろには かつ、くろには まける、しろくろの しましまには あいこを だす あとだし じゃんけんゲームです。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #292545;
            --muted: #6c6782;
            --paper: #fffef9;
            --purple: #6958e8;
            --purple-dark: #4d3cc3;
            --pink: #ff6f9f;
            --orange: #ff8b57;
            --yellow: #ffd84d;
            --mint: #48d3a6;
            --sky: #62c9f4;
            --red: #e94c6f;
            --shadow: 0 22px 56px rgba(52, 42, 122, 0.16);
        }

        * { box-sizing: border-box; }

        html {
            min-width: 320px;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            overflow: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 8% 10%, rgba(255,216,77,.52) 0 92px, transparent 93px),
                radial-gradient(circle at 92% 85%, rgba(255,111,159,.25) 0 150px, transparent 151px),
                linear-gradient(145deg, #dff6ff 0%, #f0ecff 52%, #fff5cf 100%);
            font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', Meiryo, sans-serif;
            font-weight: 700;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        button,
        a {
            -webkit-tap-highlight-color: transparent;
        }

        button { font: inherit; }

        .decor {
            position: fixed;
            z-index: 0;
            pointer-events: none;
            opacity: .72;
        }

        .decor.circle-one {
            top: 17%;
            right: 5%;
            width: 48px;
            height: 48px;
            background: var(--mint);
            border-radius: 50%;
        }

        .decor.circle-two {
            bottom: 14%;
            left: 4%;
            width: 34px;
            height: 34px;
            background: var(--pink);
            border-radius: 11px;
            transform: rotate(18deg);
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .screen {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            animation: screen-in .34s cubic-bezier(.2,.8,.2,1) both;
        }

        .hidden { display: none !important; }

        @keyframes screen-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title-screen {
            display: grid;
            place-items: center;
            padding: max(18px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom));
            overflow: auto;
        }

        .title-layout {
            display: grid;
            width: min(1180px, 100%);
            grid-template-columns: minmax(0, 1.05fr) minmax(340px, .95fr);
            gap: clamp(20px, 4vw, 54px);
            align-items: center;
        }

        .title-hero {
            position: relative;
            padding: clamp(28px, 5vw, 64px);
            overflow: hidden;
            background: rgba(255,255,255,.9);
            border: 3px solid #fff;
            border-radius: 42px;
            box-shadow: var(--shadow);
        }

        .title-hero::after {
            position: absolute;
            top: -80px;
            right: -70px;
            width: 240px;
            height: 240px;
            content: '';
            background: linear-gradient(140deg, var(--yellow), var(--orange));
            border-radius: 50%;
            opacity: .65;
        }

        .top-actions {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .park-link,
        .sound-button,
        .quit-button {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 14px;
            color: var(--ink);
            background: #fff;
            border: 2px solid #e8e3f4;
            border-radius: 15px;
            box-shadow: 0 6px 16px rgba(55,44,128,.08);
            font-size: 13px;
            font-weight: 900;
            text-decoration: none;
            cursor: pointer;
        }

        .high-score-pill {
            position: relative;
            z-index: 2;
            display: inline-flex;
            margin-bottom: 13px;
            padding: 7px 13px;
            color: var(--purple-dark);
            background: #eeeaff;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 900;
        }

        h1 {
            position: relative;
            z-index: 2;
            margin: 0;
            font-size: clamp(45px, 6.4vw, 82px);
            font-weight: 900;
            line-height: 1.03;
            letter-spacing: -.06em;
        }

        h1 .accent { color: var(--purple); }

        .hero-copy {
            position: relative;
            z-index: 2;
            margin: 20px 0 25px;
            color: var(--muted);
            font-size: clamp(15px, 1.8vw, 19px);
            line-height: 1.8;
        }

        .hand-showcase {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: clamp(8px, 2vw, 18px);
        }

        .showcase-hand {
            display: grid;
            width: clamp(74px, 9vw, 108px);
            aspect-ratio: 1;
            place-items: center;
            background: #fff;
            border: 3px solid #ebe7f5;
            border-radius: 28px;
            box-shadow: 0 10px 24px rgba(52,42,122,.1);
            font-size: clamp(36px, 5vw, 58px);
        }

        .showcase-hand:nth-child(1) { transform: rotate(-8deg); }
        .showcase-hand:nth-child(2) { background: #fff3b7; transform: translateY(-9px); }
        .showcase-hand:nth-child(3) { transform: rotate(8deg); }

        .rule-preview {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin-top: 24px;
        }

        .rule-mini {
            padding: 10px 7px;
            border-radius: 14px;
            color: var(--ink);
            background: #fff;
            border: 2px solid #e7e3f1;
            font-size: 12px;
            line-height: 1.45;
            text-align: center;
        }

        .rule-mini strong { display: block; font-size: 14px; }
        .rule-mini.dark { color: #fff; background: #292545; border-color: #292545; }
        .rule-mini.stripe {
            color: #fff;
            background: repeating-linear-gradient(135deg, #fff 0 12px, #292545 12px 24px);
            border-color: #6958e8;
            text-shadow: 0 2px 3px rgba(0,0,0,.65);
        }

        .mode-panel {
            padding: clamp(22px, 4vw, 38px);
            background: rgba(255,255,255,.72);
            border: 2px solid rgba(255,255,255,.88);
            border-radius: 34px;
            box-shadow: 0 14px 40px rgba(55,44,128,.1);
            backdrop-filter: blur(16px);
        }

        .mode-panel h2 {
            margin: 0 0 6px;
            font-size: clamp(26px, 3vw, 37px);
            font-weight: 900;
        }

        .mode-panel > p {
            margin: 0 0 19px;
            color: var(--muted);
            font-size: 14px;
        }

        .mode-list {
            display: grid;
            gap: 12px;
        }

        .mode-card {
            display: grid;
            width: 100%;
            min-height: 96px;
            grid-template-columns: 56px 1fr auto;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            color: var(--ink);
            background: #fff;
            border: 3px solid transparent;
            border-radius: 23px;
            box-shadow: 0 8px 0 #ddd7ef, 0 14px 24px rgba(52,42,122,.08);
            text-align: left;
            cursor: pointer;
            transition: transform .17s ease, box-shadow .17s ease, border-color .17s ease;
        }

        .mode-card:hover,
        .mode-card:focus-visible {
            border-color: var(--purple);
            outline: 0;
            transform: translateY(-3px);
        }

        .mode-card:active {
            box-shadow: 0 3px 0 #ddd7ef;
            transform: translateY(5px);
        }

        .mode-icon {
            display: grid;
            width: 56px;
            height: 56px;
            place-items: center;
            background: #e2f9ef;
            border-radius: 18px;
            font-size: 27px;
        }

        .mode-card.normal .mode-icon { background: #e1f3ff; }
        .mode-card.hard .mode-icon { background: #ffe3ef; }

        .mode-name {
            display: block;
            margin-bottom: 3px;
            font-size: 19px;
            font-weight: 900;
        }

        .mode-desc {
            display: block;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .mode-arrow {
            display: grid;
            width: 35px;
            height: 35px;
            place-items: center;
            color: #fff;
            background: var(--purple);
            border-radius: 12px;
            font-size: 23px;
        }

        .game-screen {
            display: grid;
            grid-template-rows: auto auto auto minmax(0, 1fr);
            gap: 10px;
            padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
        }

        .game-header {
            display: grid;
            width: 100%;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .quit-button {
            justify-self: start;
            background: rgba(255,255,255,.88);
        }

        .current-mode {
            padding: 8px 16px;
            color: var(--purple-dark);
            background: rgba(255,255,255,.85);
            border: 2px solid #fff;
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(55,44,128,.08);
            font-size: 13px;
            font-weight: 900;
        }

        .hud {
            display: flex;
            justify-self: end;
            gap: 8px;
        }

        .hud-box {
            min-width: 88px;
            padding: 7px 12px;
            background: rgba(255,255,255,.9);
            border: 2px solid #fff;
            border-radius: 17px;
            box-shadow: 0 7px 18px rgba(55,44,128,.09);
            text-align: center;
        }

        .hud-box span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 900;
        }

        .hud-box strong {
            display: block;
            margin-top: -1px;
            font-size: 23px;
            font-weight: 900;
            line-height: 1.15;
        }

        .time-track {
            width: 100%;
            height: 12px;
            padding: 3px;
            overflow: hidden;
            background: rgba(255,255,255,.86);
            border-radius: 999px;
            box-shadow: 0 5px 14px rgba(55,44,128,.08);
        }

        .time-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--pink), var(--yellow), var(--mint));
            border-radius: inherit;
            transition: width .3s linear;
        }

        .rule-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .rule-card {
            display: flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 6px 10px;
            color: var(--ink);
            background: rgba(255,255,255,.9);
            border: 2px solid #fff;
            border-radius: 15px;
            box-shadow: 0 6px 16px rgba(55,44,128,.07);
            font-size: 13px;
            font-weight: 900;
        }

        .rule-card.black {
            color: #fff;
            background: #292545;
            border-color: #292545;
        }

        .rule-card.stripe {
            color: #fff;
            background: repeating-linear-gradient(135deg, #fff 0 13px, #292545 13px 26px);
            border-color: #6958e8;
            text-shadow: 0 2px 3px rgba(0,0,0,.72);
        }

        .rule-swatch {
            width: 20px;
            height: 20px;
            background: #fff;
            border: 3px solid #292545;
            border-radius: 50%;
        }

        .rule-card.black .rule-swatch { background: #10101a; border-color: #fff; }
        .rule-card.stripe .rule-swatch {
            background: repeating-linear-gradient(135deg, #fff 0 4px, #292545 4px 8px);
            border-color: #fff;
        }

        .game-main {
            display: grid;
            min-height: 0;
            grid-template-columns: minmax(0, 1.35fr) minmax(330px, .65fr);
            gap: 12px;
        }

        .arena-panel,
        .control-panel {
            position: relative;
            display: flex;
            min-height: 0;
            overflow: hidden;
            flex-direction: column;
            background: rgba(255,255,255,.9);
            border: 3px solid #fff;
            border-radius: 28px;
            box-shadow: var(--shadow);
        }

        .arena-panel { padding: 16px; }
        .control-panel { padding: 18px; }

        .arena-prompt,
        .control-title {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 900;
            text-align: center;
        }

        .arena {
            display: flex;
            min-height: 0;
            flex: 1;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 4vw, 58px);
            padding: 14px;
        }

        .enemy-slot {
            display: flex;
            min-width: 0;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .enemy-rule {
            min-width: 86px;
            padding: 6px 13px;
            border-radius: 999px;
            color: #27765f;
            background: #dff9ef;
            font-size: 13px;
            font-weight: 900;
            text-align: center;
        }

        .enemy-rule.black { color: #fff; background: #292545; }
        .enemy-rule.stripe {
            color: #fff;
            background: repeating-linear-gradient(135deg, #fff 0 9px, #292545 9px 18px);
            border: 2px solid #6958e8;
            text-shadow: 0 2px 3px rgba(0,0,0,.72);
        }

        .enemy {
            position: relative;
            display: grid;
            width: clamp(122px, 18vmin, 208px);
            aspect-ratio: 1;
            place-items: center;
            color: #292545;
            background: #fff;
            border: clamp(6px, .8vmin, 10px) solid #292545;
            border-radius: 34%;
            box-shadow: 0 18px 0 rgba(41,37,69,.1), 0 26px 45px rgba(52,42,122,.13);
            font-size: clamp(58px, 10vmin, 118px);
            transition: transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .2s ease;
        }

        .enemy.black {
            color: #fff;
            background: #171522;
            border-color: #fff;
            box-shadow: 0 0 0 7px #292545, 0 22px 44px rgba(25,20,46,.25);
        }

        .enemy.stripe {
            color: #292545;
            background: repeating-linear-gradient(135deg, #fff 0 20px, #292545 20px 40px);
            border-color: var(--purple);
        }

        .enemy.stage-1 { transform: scale(.62); }
        .enemy.stage-2 { transform: scale(.79); }
        .enemy.stage-3 { transform: scale(.96); }
        .enemy.stage-4 { transform: scale(1.13); }
        .enemy.stage-5 {
            transform: scale(1.3);
            box-shadow: 0 0 0 10px rgba(255,111,159,.14), 0 24px 46px rgba(52,42,122,.2);
        }

        .feedback {
            min-height: 38px;
            margin: 0;
            color: var(--purple-dark);
            font-size: clamp(18px, 2.2vw, 27px);
            font-weight: 900;
            text-align: center;
        }

        .feedback.correct { color: #208166; animation: feedback-pop .32s ease; }
        .feedback.wrong { color: var(--red); animation: feedback-shake .28s ease; }

        @keyframes feedback-pop {
            0% { transform: scale(.8); }
            70% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes feedback-shake {
            0%,100% { transform: translateX(0); }
            35% { transform: translateX(-7px); }
            70% { transform: translateX(7px); }
        }

        .controls {
            display: flex;
            min-height: 0;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        .hand-group {
            display: grid;
            gap: 9px;
            padding: 11px;
            background: #f7f5ff;
            border: 2px solid #e7e2f3;
            border-radius: 22px;
        }

        .hand-group.single { grid-template-columns: repeat(3, minmax(0, 1fr)); }

        .side-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1px;
            color: var(--purple-dark);
            font-size: 13px;
            font-weight: 900;
        }

        .side-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .hand-btn {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 96px;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 3px;
            padding: 8px 4px;
            color: var(--ink);
            background: #fff;
            border: 3px solid #e5e0f1;
            border-radius: 20px;
            box-shadow: 0 7px 0 #d8d2e9;
            cursor: pointer;
            transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
        }

        .hand-btn:hover,
        .hand-btn:focus-visible {
            border-color: var(--purple);
            outline: 0;
            transform: translateY(-2px);
        }

        .hand-btn:active {
            box-shadow: 0 2px 0 #d8d2e9;
            transform: translateY(5px);
        }

        .hand-btn.selected {
            background: #fff2ad;
            border-color: #f0bd30;
            box-shadow: 0 7px 0 #d6a521;
        }

        .hand-emoji {
            font-size: clamp(38px, 6vmin, 63px);
            line-height: 1;
        }

        .hand-name {
            color: var(--muted);
            font-size: 11px;
            font-weight: 900;
        }

        .key-hint {
            margin: 10px 0 0;
            color: #8a849c;
            font-size: 10px;
            text-align: center;
        }

        .score-bump { animation: score-bump .3s ease; }

        @keyframes score-bump {
            0%,100% { transform: scale(1); }
            50% { color: var(--pink); transform: scale(1.25); }
        }

        .result-screen {
            display: grid;
            place-items: center;
            padding: 22px;
            overflow: auto;
        }

        .result-card {
            position: relative;
            width: min(100%, 570px);
            padding: clamp(30px, 6vw, 58px);
            overflow: hidden;
            background: rgba(255,255,255,.94);
            border: 3px solid #fff;
            border-radius: 38px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .result-card::after {
            position: absolute;
            z-index: 0;
            top: -80px;
            right: -60px;
            width: 220px;
            height: 220px;
            content: '';
            background: var(--yellow);
            border-radius: 50%;
            opacity: .5;
        }

        .result-content { position: relative; z-index: 1; }

        .result-icon {
            display: grid;
            width: 92px;
            height: 92px;
            place-items: center;
            margin: 0 auto 13px;
            background: #fff2b1;
            border-radius: 28px;
            box-shadow: 0 10px 0 #ead36b;
            font-size: 51px;
        }

        .result-title {
            margin: 0;
            color: var(--purple-dark);
            font-size: clamp(34px, 7vw, 53px);
            font-weight: 900;
        }

        .final-score {
            margin: 13px 0 4px;
            font-size: clamp(43px, 10vw, 76px);
            font-weight: 900;
            line-height: 1;
        }

        .final-score span { color: var(--pink); }

        .high-score-message {
            min-height: 28px;
            margin: 12px 0 20px;
            color: var(--red);
            font-size: 16px;
            font-weight: 900;
        }

        .result-actions {
            display: grid;
            width: min(100%, 340px);
            gap: 10px;
            margin: 0 auto;
        }

        .primary-button,
        .secondary-button {
            min-height: 54px;
            padding: 11px 20px;
            border-radius: 17px;
            font-weight: 900;
            cursor: pointer;
        }

        .primary-button {
            color: #fff;
            background: var(--purple);
            border: 0;
            box-shadow: 0 7px 0 var(--purple-dark);
            font-size: 18px;
        }

        .secondary-button {
            color: var(--ink);
            background: #fff;
            border: 2px solid #e5e0f1;
        }

        .primary-button:active { box-shadow: 0 2px 0 var(--purple-dark); transform: translateY(5px); }

        :focus-visible {
            outline: 4px solid var(--yellow);
            outline-offset: 4px;
        }

        @media (max-width: 820px) {
            body { overflow: auto; }
            .title-layout { grid-template-columns: 1fr; max-width: 650px; padding-block: 6px; }
            .title-hero { padding: 30px; }
            .mode-panel { margin-bottom: 10px; }

            .game-screen {
                min-height: 100dvh;
                grid-template-rows: auto auto auto minmax(0, 1fr);
                overflow: auto;
            }

            .game-main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(300px, 1fr) auto;
            }

            .arena-panel { min-height: 330px; }
            .control-panel { min-height: 205px; }
            .controls { flex-direction: row; }
            .hand-group { flex: 1; }
            .hand-btn { min-height: 82px; }
        }

        @media (max-width: 560px) {
            .title-screen { padding-inline: 12px; }
            .title-hero { padding: 22px 18px; border-radius: 28px; }
            .top-actions { margin-bottom: 17px; }
            .park-link, .sound-button { min-height: 40px; padding-inline: 10px; font-size: 11px; }
            h1 { font-size: clamp(42px, 14vw, 62px); }
            .hero-copy { margin-block: 14px 17px; font-size: 14px; }
            .rule-preview { margin-top: 18px; }
            .rule-mini { padding: 8px 4px; font-size: 10px; }
            .rule-mini strong { font-size: 12px; }
            .mode-panel { padding: 19px 14px; border-radius: 25px; }
            .mode-card { min-height: 84px; grid-template-columns: 48px 1fr 31px; gap: 10px; padding: 11px; border-radius: 19px; }
            .mode-icon { width: 48px; height: 48px; border-radius: 15px; font-size: 23px; }
            .mode-name { font-size: 16px; }
            .mode-desc { font-size: 10px; }
            .mode-arrow { width: 31px; height: 31px; font-size: 18px; }

            .game-screen { gap: 7px; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); }
            .game-header { grid-template-columns: auto 1fr auto; gap: 6px; }
            .quit-button { min-height: 38px; padding-inline: 10px; font-size: 11px; }
            .current-mode { justify-self: center; padding: 7px 10px; font-size: 10px; }
            .hud { gap: 4px; }
            .hud-box { min-width: 58px; padding: 5px 7px; border-radius: 13px; }
            .hud-box span { font-size: 8px; }
            .hud-box strong { font-size: 18px; }
            .time-track { height: 9px; padding: 2px; }
            .rule-strip { gap: 4px; }
            .rule-card { min-height: 38px; gap: 4px; padding: 4px 5px; border-radius: 12px; font-size: 10px; }
            .rule-swatch { width: 15px; height: 15px; border-width: 2px; }
            .game-main { grid-template-rows: minmax(265px, 1fr) auto; gap: 7px; }
            .arena-panel, .control-panel { border-radius: 21px; border-width: 2px; }
            .arena-panel { min-height: 285px; padding: 10px; }
            .control-panel { min-height: 174px; padding: 10px; }
            .arena-prompt, .control-title { font-size: 11px; }
            .arena { gap: 8px; padding: 5px; }
            .enemy-slot { gap: 7px; }
            .enemy-rule { min-width: 65px; padding: 4px 8px; font-size: 10px; }
            .enemy { width: clamp(94px, 29vw, 135px); border-width: 5px; border-radius: 28%; font-size: clamp(48px, 17vw, 70px); }
            .feedback { min-height: 27px; font-size: 16px; }
            .controls { gap: 6px; margin-top: 7px; }
            .hand-group { gap: 5px; padding: 6px; border-radius: 15px; }
            .side-buttons { gap: 4px; }
            .side-label { font-size: 10px; }
            .hand-btn { min-height: 66px; border-width: 2px; border-radius: 14px; box-shadow: 0 5px 0 #d8d2e9; }
            .hand-emoji { font-size: clamp(31px, 11vw, 46px); }
            .hand-name { font-size: 9px; }
            .key-hint { display: none; }
        }

        @media (max-width: 380px) {
            .rule-card { font-size: 9px; }
            .enemy { width: 92px; }
            .hand-emoji { font-size: 30px; }
            .hand-name { display: none; }
        }

        @media (orientation: landscape) and (max-height: 650px) {
            .title-screen { align-items: start; padding: 10px 18px; }
            .title-layout { grid-template-columns: 1.05fr .95fr; max-width: 1080px; gap: 14px; }
            .title-hero { padding: 18px 24px; border-radius: 26px; }
            .top-actions { margin-bottom: 8px; }
            .high-score-pill { margin-bottom: 5px; padding-block: 4px; }
            h1 { font-size: clamp(37px, 7vw, 58px); }
            .hero-copy { margin: 8px 0 10px; font-size: 12px; }
            .hand-showcase { display: none; }
            .rule-preview { margin-top: 9px; }
            .mode-panel { padding: 15px; border-radius: 23px; }
            .mode-panel h2 { font-size: 23px; }
            .mode-panel > p { margin-bottom: 10px; font-size: 11px; }
            .mode-list { gap: 7px; }
            .mode-card { min-height: 69px; grid-template-columns: 43px 1fr 30px; padding: 7px 10px; }
            .mode-icon { width: 43px; height: 43px; font-size: 21px; }
            .mode-name { font-size: 15px; }
            .mode-arrow { width: 30px; height: 30px; }

            .game-screen { gap: 5px; padding: 7px 10px; overflow: hidden; }
            .game-main { grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); grid-template-rows: 1fr; gap: 8px; }
            .rule-card { min-height: 34px; }
            .arena-panel { min-height: 0; padding: 8px; }
            .control-panel { min-height: 0; padding: 9px; }
            .enemy { width: clamp(100px, 22vmin, 145px); font-size: clamp(48px, 13vmin, 76px); }
            .feedback { min-height: 24px; font-size: 16px; }
            .controls { gap: 5px; margin-top: 5px; }
            .hand-group { padding: 6px; }
            .hand-btn { min-height: 58px; }
            .hand-emoji { font-size: 32px; }
            .key-hint { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>
<body>
    <span class="decor circle-one" aria-hidden="true"></span>
    <span class="decor circle-two" aria-hidden="true"></span>

    <main class="app">
        <section class="screen title-screen" id="screen-title" aria-labelledby="page-title">
            <div class="title-layout">
                <div class="title-hero">
                    <div class="top-actions">
                        <a class="park-link" href="../index.html">‹ ゲームパークへ</a>
                        <button class="sound-button" id="sound-button" type="button" aria-pressed="true">🔊 おと あり</button>
                    </div>
                    <div class="high-score-pill">⭐ いちばん　<span id="high-score-display">0</span>てん</div>
                    <h1 id="page-title"><span class="accent">あとだし</span><br>じゃんけん！</h1>
                    <p class="hero-copy">あいての いろを よくみて、<br>かつ・まける・あいこの てを だそう！</p>
                    <div class="hand-showcase" aria-hidden="true">
                        <span class="showcase-hand">✊</span>
                        <span class="showcase-hand">✌️</span>
                        <span class="showcase-hand">✋</span>
                    </div>
                    <div class="rule-preview" aria-label="ゲームの ルール">
                        <div class="rule-mini"><strong>○ しろ</strong>かつ！</div>
                        <div class="rule-mini dark"><strong>● くろ</strong>まける！</div>
                        <div class="rule-mini stripe"><strong>▧ しましま</strong>あいこ！</div>
                    </div>
                </div>

                <div class="mode-panel">
                    <h2>どれで あそぶ？</h2>
                    <p>はじめは「かんたん」が おすすめだよ。</p>
                    <div class="mode-list">
                        <button class="mode-card easy" type="button" data-mode="easy">
                            <span class="mode-icon">🌱</span>
                            <span><span class="mode-name">かんたん</span><span class="mode-desc">ひとつの て・ゆっくり</span></span>
                            <span class="mode-arrow">›</span>
                        </button>
                        <button class="mode-card normal" type="button" data-mode="normal">
                            <span class="mode-icon">⚡</span>
                            <span><span class="mode-name">ふつう</span><span class="mode-desc">ひとつの て・はやい</span></span>
                            <span class="mode-arrow">›</span>
                        </button>
                        <button class="mode-card hard" type="button" data-mode="hard">
                            <span class="mode-icon">🔥</span>
                            <span><span class="mode-name">むずかしい</span><span class="mode-desc">ふたつの てに ちょうせん</span></span>
                            <span class="mode-arrow">›</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="screen game-screen hidden" id="screen-game" aria-label="ゲームがめん">
            <header class="game-header">
                <button class="quit-button" id="quit-button" type="button">‹ やめる</button>
                <div class="current-mode" id="current-mode">かんたん</div>
                <div class="hud">
                    <div class="hud-box"><span>のこり</span><strong id="time-left">60</strong></div>
                    <div class="hud-box"><span>スコア</span><strong id="score">0</strong></div>
                </div>
            </header>

            <div class="time-track" aria-hidden="true"><div class="time-fill" id="time-fill"></div></div>

            <div class="rule-strip" aria-label="あとだしの ルール">
                <div class="rule-card"><span class="rule-swatch"></span><span>しろは <strong>かつ</strong></span></div>
                <div class="rule-card black"><span class="rule-swatch"></span><span>くろは <strong>まける</strong></span></div>
                <div class="rule-card stripe"><span class="rule-swatch"></span><span>しましまは <strong>あいこ</strong></span></div>
            </div>

            <div class="game-main">
                <section class="arena-panel" aria-label="あいての て">
                    <p class="arena-prompt">あいての いろと てを よくみよう</p>
                    <div class="arena" id="arena"></div>
                    <p class="feedback" id="feedback" aria-live="polite">あとから てを だしてね！</p>
                </section>

                <section class="control-panel" aria-label="じぶんの て">
                    <p class="control-title">じぶんの てを えらぼう</p>
                    <div class="controls" id="controls"></div>
                    <p class="key-hint" id="key-hint">パソコンは 1・2・3 キーでも あそべるよ</p>
                </section>
            </div>
        </section>

        <section class="screen result-screen hidden" id="screen-result" aria-labelledby="result-title">
            <div class="result-card">
                <div class="result-content">
                    <div class="result-icon" aria-hidden="true">🏆</div>
                    <h2 class="result-title" id="result-title">おわり！</h2>
                    <p class="final-score"><span id="final-score">0</span>てん</p>
                    <p class="high-score-message" id="high-score-msg"></p>
                    <div class="result-actions">
                        <button class="primary-button" id="retry-button" type="button">もういちど！</button>
                        <button class="secondary-button" id="title-button" type="button">タイトルへ もどる</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const hands = ['✊', '✌️', '✋'];
        const handNames = ['グー', 'チョキ', 'パー'];
        const conditions = ['white', 'black', 'stripe'];
        const conditionLabels = {
            white: 'かつ！',
            black: 'まける！',
            stripe: 'あいこ！'
        };
        const modeLabels = {
            easy: 'かんたん',
            normal: 'ふつう',
            hard: 'むずかしい'
        };

        const screens = {
            title: document.querySelector('#screen-title'),
            game: document.querySelector('#screen-game'),
            result: document.querySelector('#screen-result')
        };
        const highScoreDisplay = document.querySelector('#high-score-display');
        const timeDisplay = document.querySelector('#time-left');
        const scoreDisplay = document.querySelector('#score');
        const timeFill = document.querySelector('#time-fill');
        const currentModeDisplay = document.querySelector('#current-mode');
        const arena = document.querySelector('#arena');
        const controls = document.querySelector('#controls');
        const feedback = document.querySelector('#feedback');
        const finalScore = document.querySelector('#final-score');
        const highScoreMessage = document.querySelector('#high-score-msg');
        const soundButton = document.querySelector('#sound-button');
        const keyHint = document.querySelector('#key-hint');

        let audioContext = null;
        let soundOn = true;
        let mode = 'easy';
        let score = 0;
        let timeLeft = 60;
        let highScore = getSavedHighScore();
        let gameTimer = null;
        let enemyInterval = null;
        let roundTimeout = null;
        let currentEnemies = [];
        let selectedHands = { left: null, right: null };
        let roundLocked = false;

        highScoreDisplay.textContent = highScore;

        function getSavedHighScore() {
            try {
                return Number(localStorage.getItem('rpsHighScore') || 0);
            } catch (error) {
                return 0;
            }
        }

        function saveHighScore(value) {
            try {
                localStorage.setItem('rpsHighScore', String(value));
            } catch (error) {
                // きろくを ほぞんできなくても ゲームは つづける
            }
        }

        function showScreen(name) {
            Object.entries(screens).forEach(([key, screen]) => {
                screen.classList.toggle('hidden', key !== name);
            });
        }

        function clearGameTimers() {
            window.clearInterval(gameTimer);
            window.clearInterval(enemyInterval);
            window.clearTimeout(roundTimeout);
            gameTimer = null;
            enemyInterval = null;
            roundTimeout = null;
        }

        function playSound(type) {
            if (!soundOn || !AudioContextClass) return;
            try {
                audioContext = audioContext || new AudioContextClass();
                if (audioContext.state === 'suspended') audioContext.resume();
                const now = audioContext.currentTime;
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.type = type === 'correct' ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(type === 'correct' ? 660 : 170, now);
                if (type === 'correct') oscillator.frequency.exponentialRampToValueAtTime(1120, now + .13);
                gain.gain.setValueAtTime(.0001, now);
                gain.gain.exponentialRampToValueAtTime(.16, now + .015);
                gain.gain.exponentialRampToValueAtTime(.0001, now + .24);
                oscillator.start(now);
                oscillator.stop(now + .25);
            } catch (error) {
                soundOn = false;
                updateSoundButton();
            }
        }

        function updateSoundButton() {
            soundButton.textContent = soundOn ? '🔊 おと あり' : '🔇 おと なし';
            soundButton.setAttribute('aria-pressed', String(soundOn));
        }

        function startGame(selectedMode) {
            clearGameTimers();
            mode = selectedMode;
            score = 0;
            timeLeft = 60;
            selectedHands = { left: null, right: null };
            roundLocked = false;
            scoreDisplay.textContent = '0';
            timeDisplay.textContent = '60';
            timeFill.style.width = '100%';
            timeFill.style.background = '';
            currentModeDisplay.textContent = modeLabels[mode];
            feedback.className = 'feedback';
            feedback.textContent = 'あとから てを だしてね！';
            keyHint.textContent = mode === 'hard'
                ? 'ひだりと みぎを ひとつずつ えらんでね'
                : 'パソコンは 1・2・3 キーでも あそべるよ';

            setupControls();
            showScreen('game');
            spawnEnemies();

            gameTimer = window.setInterval(() => {
                timeLeft -= 1;
                timeDisplay.textContent = String(timeLeft);
                timeFill.style.width = `${Math.max(0, (timeLeft / 60) * 100)}%`;
                if (timeLeft <= 10) timeFill.style.background = 'linear-gradient(90deg, #e94c6f, #ff8b57)';
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function setupControls() {
            controls.replaceChildren();

            if (mode === 'easy' || mode === 'normal') {
                const group = document.createElement('div');
                group.className = 'hand-group single';
                hands.forEach((hand, index) => {
                    group.append(createHandButton(hand, index, () => checkAnswerSingle(index), `${index + 1}`));
                });
                controls.append(group);
                return;
            }

            ['left', 'right'].forEach((side) => {
                const group = document.createElement('div');
                group.className = 'hand-group';
                const label = document.createElement('div');
                label.className = 'side-label';
                label.innerHTML = `<span>${side === 'left' ? 'ひだり' : 'みぎ'}</span><span>${side === 'left' ? '←' : '→'}</span>`;
                const buttons = document.createElement('div');
                buttons.className = 'side-buttons';

                hands.forEach((hand, index) => {
                    const button = createHandButton(hand, index, () => selectHandDual(side, index, button));
                    button.classList.add(`${side}-btn`);
                    buttons.append(button);
                });

                group.append(label, buttons);
                controls.append(group);
            });
        }

        function createHandButton(hand, index, onClick, keyLabel = '') {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'hand-btn';
            button.setAttribute('aria-label', handNames[index]);
            button.innerHTML = `<span class="hand-emoji">${hand}</span><span class="hand-name">${handNames[index]}${keyLabel ? `・${keyLabel}` : ''}</span>`;
            button.addEventListener('click', onClick);
            return button;
        }

        function spawnEnemies() {
            window.clearInterval(enemyInterval);
            window.clearTimeout(roundTimeout);
            arena.replaceChildren();
            currentEnemies = [];
            selectedHands = { left: null, right: null };
            roundLocked = false;
            document.querySelectorAll('.hand-btn').forEach((button) => button.classList.remove('selected'));

            const enemyCount = mode === 'hard' ? 2 : 1;
            for (let index = 0; index < enemyCount; index += 1) {
                const handType = Math.floor(Math.random() * 3);
                const condition = conditions[Math.floor(Math.random() * conditions.length)];
                const slot = document.createElement('div');
                slot.className = 'enemy-slot';
                const rule = document.createElement('div');
                rule.className = `enemy-rule ${condition}`;
                rule.textContent = conditionLabels[condition];
                const enemy = document.createElement('div');
                enemy.className = `enemy ${condition} stage-1`;
                enemy.textContent = hands[handType];
                enemy.setAttribute('aria-label', `${conditionLabels[condition]} ${handNames[handType]}`);
                slot.append(rule, enemy);
                arena.append(slot);
                currentEnemies.push({ hand: handType, condition, stage: 1, element: enemy });
            }

            const speed = mode === 'easy' ? 1250 : mode === 'normal' ? 750 : 1000;
            enemyInterval = window.setInterval(updateEnemiesStage, speed);
        }

        function updateEnemiesStage() {
            let timedOut = false;
            currentEnemies.forEach((enemy) => {
                enemy.element.classList.remove(`stage-${enemy.stage}`);
                enemy.stage += 1;
                if (enemy.stage > 5) {
                    timedOut = true;
                } else {
                    enemy.element.classList.add(`stage-${enemy.stage}`);
                }
            });

            if (timedOut) resolveRound(false, 'じかんぎれ！ -5');
        }

        function isCorrect(playerHand, enemyHand, condition) {
            if (condition === 'white') return (playerHand - enemyHand + 3) % 3 === 2;
            if (condition === 'black') return (playerHand - enemyHand + 3) % 3 === 1;
            return playerHand === enemyHand;
        }

        function checkAnswerSingle(playerHand) {
            if (roundLocked || !currentEnemies.length) return;
            const enemy = currentEnemies[0];
            resolveRound(isCorrect(playerHand, enemy.hand, enemy.condition));
        }

        function selectHandDual(side, playerHand, button) {
            if (roundLocked || currentEnemies.length < 2) return;
            selectedHands[side] = playerHand;
            document.querySelectorAll(`.${side}-btn`).forEach((item) => item.classList.remove('selected'));
            button.classList.add('selected');

            if (selectedHands.left === null || selectedHands.right === null) return;
            const leftCorrect = isCorrect(selectedHands.left, currentEnemies[0].hand, currentEnemies[0].condition);
            const rightCorrect = isCorrect(selectedHands.right, currentEnemies[1].hand, currentEnemies[1].condition);
            resolveRound(leftCorrect && rightCorrect);
        }

        function resolveRound(correct, customMessage = '') {
            if (roundLocked) return;
            roundLocked = true;
            window.clearInterval(enemyInterval);
            const points = correct ? 10 : -5;
            updateScore(points);
            playSound(correct ? 'correct' : 'wrong');
            feedback.className = `feedback ${correct ? 'correct' : 'wrong'}`;
            feedback.textContent = customMessage || (correct ? 'せいかい！ +10' : 'おしい！ -5');
            roundTimeout = window.setTimeout(spawnEnemies, correct ? 300 : 420);
        }

        function updateScore(points) {
            score = Math.max(0, score + points);
            scoreDisplay.textContent = String(score);
            scoreDisplay.classList.remove('score-bump');
            void scoreDisplay.offsetWidth;
            scoreDisplay.classList.add('score-bump');
        }

        function endGame() {
            clearGameTimers();
            finalScore.textContent = String(score);
            highScoreMessage.textContent = '';
            if (score > highScore) {
                highScore = score;
                saveHighScore(highScore);
                highScoreDisplay.textContent = String(highScore);
                highScoreMessage.textContent = '🌟 ハイスコア こうしん！ 🌟';
            } else {
                highScoreMessage.textContent = score >= 100 ? 'いい ちょうし！' : 'さいごまで できたね！';
            }
            showScreen('result');
        }

        function returnToTitle() {
            clearGameTimers();
            showScreen('title');
        }

        document.querySelectorAll('.mode-card').forEach((button) => {
            button.addEventListener('click', () => startGame(button.dataset.mode));
        });
        document.querySelector('#quit-button').addEventListener('click', returnToTitle);
        document.querySelector('#retry-button').addEventListener('click', () => startGame(mode));
        document.querySelector('#title-button').addEventListener('click', returnToTitle);

        soundButton.addEventListener('click', () => {
            soundOn = !soundOn;
            updateSoundButton();
            if (soundOn) playSound('correct');
        });

        document.addEventListener('keydown', (event) => {
            if (screens.game.classList.contains('hidden')) return;
            if (event.key === 'Escape') {
                returnToTitle();
                return;
            }
            if (mode === 'hard' || roundLocked) return;
            const keyMap = { '1': 0, '2': 1, '3': 2 };
            if (event.key in keyMap) checkAnswerSingle(keyMap[event.key]);
        });

        updateSoundButton();
    </script>
</body>
</html>
