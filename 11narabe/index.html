        /* アニメーション定義 */
        @keyframes bounce-slow {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-15px); }
        }
        .animate-bounce-slow { animation: bounce-slow 3s infinite ease-in-out; }
        
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-6px) rotate(-5deg); }
          40% { transform: translateX(6px) rotate(5deg); }
          60% { transform: translateX(-3px) rotate(-2deg); }
          80% { transform: translateX(3px) rotate(2deg); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }

        @keyframes fade-in {
          from { opacity: 0; transform: scale(0.9); }
          to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -50px) rotate(180deg); }
            100% { transform: translate(-20px, 0) rotate(360deg); }
        }
        .animate-float { animation: float infinite linear; }

        /* タッチ操作の無効化防止 & iOSでの選択防止 */

            touch-action: manipulation; 
            -webkit-user-select: none;
            user-select: none;

        /**
         * 簡易サウンド再生
         */
        const playSound = (type) => {
          try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'click') {
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.05);
              gain.gain.setValueAtTime(0.2, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
              osc.start();
              osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'correct') {
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(523.25, ctx.currentTime);
              osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
              osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
              gain.gain.setValueAtTime(0.2, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
              osc.start();
              osc.stop(ctx.currentTime + 0.6);
            } else if (type === 'finish') {
              osc.type = 'square';
              const now = ctx.currentTime;
              [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                const t = now + i * 0.15;
                osc.frequency.setValueAtTime(freq, t);
              });
              gain.gain.setValueAtTime(0.2, now);
              gain.gain.linearRampToValueAtTime(0, now + 1.5);
              osc.start();
              osc.stop(now + 1.5);
            }
          } catch(e) {}
        };

        /**
         * 配列シャッフル
         */
        const shuffleArray = (array) => {
          const newArr = [...array];
          for (let i = newArr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
          }
          return newArr;
        };

        /**
         * ひらがな -> カタカナ 変換ユーティリティ
         */
        const hiraToKata = (str) => {
          return str.replace(/[\u3041-\u3096]/g, function(match) {
            var chr = match.charCodeAt(0) + 0x60;
            return String.fromCharCode(chr);
          });
        };

        const TOTAL_QUESTIONS = 20;

        function MojiAwaseApp() {
          const [gameState, setGameState] = useState('title'); 
          const [gameMode, setGameMode] = useState('hiragana');
          const [difficulty, setDifficulty] = useState('easy'); 
          const [questionCount, setQuestionCount] = useState(1);
          const [currentProblem, setCurrentProblem] = useState(null);
          
          const [usedWords, setUsedWords] = useState(new Set());

          const [targetChars, setTargetChars] = useState([]); 
          const [poolChars, setPoolChars] = useState([]); 
          const [userAnswer, setUserAnswer] = useState([]); 
          
          const [startTime, setStartTime] = useState(0);
          const [elapsedTime, setElapsedTime] = useState(0);
          const [isPaused, setIsPaused] = useState(false);
          const timerRef = useRef(null);

          const [showHint, setShowHint] = useState(false);
          const [isCorrectAnim, setIsCorrectAnim] = useState(false);

          const generateProblem = useCallback((qNum, currentDiff, currentMode, currentUsedWords) => {
            let minLen = 0;
            let maxLen = 0;

            if (currentDiff === 'easy') {
              if (qNum <= 5) { minLen = 2; maxLen = 2; }
              else if (qNum <= 15) { minLen = 3; maxLen = 3; }
              else { minLen = 4; maxLen = 4; }
            } else {
              if (qNum <= 5) { minLen = 3; maxLen = 3; }
              else if (qNum <= 10) { minLen = 4; maxLen = 4; }
              else if (qNum <= 15) { minLen = 5; maxLen = 5; }
              else { minLen = 6; maxLen = 20; }
            }

            let candidates = WORD_DATA.filter(d => {
              const len = d.word.length;
              return len >= minLen && len <= maxLen && !currentUsedWords.has(d.word);
            });

            if (candidates.length === 0) {
              candidates = WORD_DATA.filter(d => {
                const len = d.word.length;
                return len >= minLen && len <= maxLen;
              });
            }

            if (candidates.length === 0) {
              candidates = WORD_DATA;
            }

            const problem = candidates[Math.floor(Math.random() * candidates.length)];
            
            const newUsedWords = new Set(currentUsedWords);
            newUsedWords.add(problem.word);
            setUsedWords(newUsedWords);

            setCurrentProblem(problem);
            
            const displayWord = currentMode === 'katakana' ? hiraToKata(problem.word) : problem.word;
            const charList = displayWord.split('');
            
            setTargetChars(charList.map((c, i) => ({ id: `${qNum}-${i}-${c}`, char: c })));

            const chars = charList.map((c, i) => ({
              id: `${qNum}-${i}-${c}`,
              char: c,
              isUsed: false,
            }));
            
            setPoolChars(shuffleArray(chars)); 
            setUserAnswer([]);
            setShowHint(false);
            setIsCorrectAnim(false);

          }, []);

          const handleStart = (selectedDifficulty) => {
            setDifficulty(selectedDifficulty);
            setGameState('playing');
            setQuestionCount(1);
            setElapsedTime(0);
            setStartTime(Date.now());
            setIsPaused(false);
            setUsedWords(new Set()); 
            generateProblem(1, selectedDifficulty, gameMode, new Set());
          };
          
          useEffect(() => {
            if (gameState === 'playing') {
              if (timerRef.current) clearInterval(timerRef.current);
              timerRef.current = setInterval(() => {
                setIsPaused(prevPaused => {
                  if (!prevPaused) {
                    setElapsedTime(prevTime => prevTime + 1);
                  }
                  return prevPaused;
                });
              }, 1000);
            }
            return () => {
              if (timerRef.current) clearInterval(timerRef.current);
            };
          }, [gameState]);

          const handleBackToTitle = () => {
            playSound('click');
            setGameState('title');
            setCurrentProblem(null);
            if (timerRef.current) clearInterval(timerRef.current);
          };

          const handleSelectChar = (charObj) => {
            if (charObj.isUsed || isCorrectAnim || isPaused) return;

            playSound('click');
            setPoolChars(prev => prev.map(p => p.id === charObj.id ? { ...p, isUsed: true } : p));
            
            const newAnswer = [...userAnswer, charObj];
            setUserAnswer(newAnswer);

            const currentWord = newAnswer.map(c => c.char).join('');
            const displayWord = gameMode === 'katakana' ? hiraToKata(currentProblem.word) : currentProblem.word;
            
            if (currentWord.length === displayWord.length) {
              if (currentWord === displayWord) {
                handleCorrect();
              }
            }
          };

          const handleReturnChar = (charObj, index) => {
            if (isCorrectAnim || isPaused) return;
            playSound('click');
            const newAnswer = userAnswer.filter(c => c.id !== charObj.id);
            setUserAnswer(newAnswer);
            setPoolChars(prev => prev.map(p => p.id === charObj.id ? { ...p, isUsed: false } : p));
          };

          const handleCorrect = () => {
            playSound('correct');
            setIsCorrectAnim(true);

            setTimeout(() => {
              if (questionCount >= TOTAL_QUESTIONS) {
                finishGame();
              } else {
                const nextQ = questionCount + 1;
                setQuestionCount(nextQ);
                generateProblem(nextQ, difficulty, gameMode, usedWords);
              }
            }, 1200);
          };

          const finishGame = () => {
            clearInterval(timerRef.current);
            playSound('finish');
            setGameState('finished');
          };

          const formatTime = (sec) => {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          const FloatingBackground = () => {
            const chars = ["あ", "い", "う", "え", "お", "カ", "キ", "ク", "ケ", "コ", "🍎", "🐶", "🚀", "A", "B", "C", "⭐", "🎵"];
            return (
              <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                {chars.map((char, i) => (
                  <div
                    key={i}
                    className="absolute text-4xl opacity-20 animate-float"
                    style={{
                      left: `${Math.random() * 100}%`,
                      top: `${Math.random() * 100}%`,
                      animationDelay: `${Math.random() * 5}s`,
                      animationDuration: `${10 + Math.random() * 20}s`,
                      fontSize: `${2 + Math.random() * 4}rem`,
                      transform: `rotate(${Math.random() * 360}deg)`
                    }}
                  >
                    {char}
                  </div>
                ))}
              </div>
            );
          };

          if (gameState === 'title') {
            return (
              // 修正: min-h-screen を min-h-[100dvh] に変更
              <div className="min-h-[100dvh] bg-gradient-to-br from-yellow-50 via-orange-50 to-pink-50 flex flex-col items-center justify-center p-4 font-sans select-none relative overflow-hidden">
                <FloatingBackground />
                
                <div className="bg-white/80 backdrop-blur-sm p-8 md:p-10 rounded-3xl shadow-2xl flex flex-col items-center max-w-lg w-full text-center space-y-6 border-4 border-orange-100 z-10">
                  <div>
                    <h1 className="text-6xl md:text-7xl font-black text-orange-600 tracking-wider drop-shadow-sm mb-2 leading-tight">
                      もじならべ
                    </h1>
                    <p className="text-gray-600 font-bold text-lg">
                      {gameMode === 'hiragana' ? 'ひらがな モード' : 'カタカナ モード'}
                    </p>
                  </div>

                  <div className="flex bg-gray-100 p-1 rounded-xl w-full">
                    <button
                      onClick={() => { playSound('click'); setGameMode('hiragana'); }}
                      className={`flex-1 py-3 rounded-lg font-black text-xl transition-all ${
                        gameMode === 'hiragana' ? 'bg-white text-blue-500 shadow-sm' : 'text-gray-400 hover:text-gray-600'
                      }`}
                    >
                      ひらがな
                    </button>
                    <button
                      onClick={() => { playSound('click'); setGameMode('katakana'); }}
                      className={`flex-1 py-3 rounded-lg font-black text-xl transition-all ${
                        gameMode === 'katakana' ? 'bg-white text-green-500 shadow-sm' : 'text-gray-400 hover:text-gray-600'
                      }`}
                    >
                      カタカナ
                    </button>
                  </div>
                  
                  <div className="grid grid-cols-1 gap-4 w-full pt-2">
                    <button
                      onClick={() => handleStart('easy')}
                      className="group relative w-full py-5 bg-blue-500 hover:bg-blue-600 text-white text-2xl font-black rounded-2xl border-b-8 border-blue-700 active:border-b-0 active:translate-y-2 transition-all shadow-lg flex items-center justify-center overflow-hidden"
                    >
                      <div className="absolute inset-0 bg-white/10 group-hover:bg-white/20 transition-colors" />
                      <Play className="w-8 h-8 mr-3 fill-current" />
                      かんたん
                      <span className="text-sm ml-2 opacity-80 font-normal">
                        (2〜4もじ)
                      </span>
                    </button>
                    
                    <button
                      onClick={() => handleStart('hard')}
                      className="group relative w-full py-5 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-black rounded-2xl border-b-8 border-orange-700 active:border-b-0 active:translate-y-2 transition-all shadow-lg flex items-center justify-center overflow-hidden"
                    >
                      <div className="absolute inset-0 bg-white/10 group-hover:bg-white/20 transition-colors" />
                      <Sparkles className="w-8 h-8 mr-3 fill-current" />
                      むずかしい
                      <span className="text-sm ml-2 opacity-80 font-normal">
                        (3〜6もじ)
                      </span>
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          if (gameState === 'finished') {
            return (
              // 修正: min-h-screen を min-h-[100dvh] に変更
              <div className="min-h-[100dvh] bg-gradient-to-b from-blue-100 to-cyan-100 flex flex-col items-center justify-center p-4 font-sans select-none">
                <div className="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg text-center space-y-8 border-b-8 border-blue-200 animate-fade-in relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400" />
                  
                  <div className="space-y-2">
                    <h2 className="text-5xl font-black text-orange-500 drop-shadow-sm">クリア！</h2>
                    <div className="flex justify-center text-yellow-400 gap-2">
                      <Star className="fill-current w-12 h-12 animate-pulse" />
                      <Star className="fill-current w-12 h-12 animate-pulse delay-75" />
                      <Star className="fill-current w-12 h-12 animate-pulse delay-150" />
                    </div>
                  </div>

                  <div className="py-8 bg-blue-50 rounded-2xl border-2 border-blue-100">
                    <p className="text-gray-500 font-bold mb-2">かかった じかん</p>
                    <p className="text-7xl font-black text-blue-600 font-mono tracking-tighter">
                      {formatTime(elapsedTime)}
                    </p>
                    <p className="text-sm text-gray-400 font-bold mt-2">
                      {difficulty === 'easy' ? 'かんたん' : 'むずかしい'} モード
                    </p>
                  </div>
                  
                  <div className="text-xl font-bold text-gray-600">
                    {elapsedTime < 60 ? "すごい！ かみさまレベル！" : 
                     elapsedTime < 120 ? "とっても はやいね！" : "よく がんばったね！"}
                  </div>

                  <button
                    onClick={() => {
                        setGameState('title');
                        setCurrentProblem(null);
                    }}
                    className="w-full py-4 bg-orange-500 hover:bg-orange-600 text-white text-2xl font-black rounded-full border-b-4 border-orange-700 active:border-b-0 active:translate-y-1 transition-all shadow-md"
                  >
                    タイトルへ もどる
                  </button>
                </div>
              </div>
            );
          }

          const isFullAnswer = userAnswer.length === (currentProblem?.word.length || 0);
          const isWrong = isFullAnswer && !isCorrectAnim;
          const displayTargetWord = gameMode === 'katakana' ? hiraToKata(currentProblem?.word || "") : (currentProblem?.word || "");

          return (
            <div className="h-full bg-slate-100 flex flex-col font-sans select-none overflow-hidden relative">
              <div className="absolute inset-0 opacity-5 pointer-events-none" 
                   style={{ backgroundImage: 'radial-gradient(#444 1px, transparent 1px)', backgroundSize: '20px 20px' }} />

              <div className="bg-white/90 backdrop-blur p-3 md:p-4 shadow-md flex justify-between items-center z-10 border-b-4 border-slate-200 shrink-0">
                <button 
                  onClick={handleBackToTitle}
                  className="bg-gray-100 p-2 rounded-xl text-gray-500 hover:bg-red-100 hover:text-red-500 transition-colors"
                  aria-label="タイトルへ"
                >
                  <Home className="w-6 h-6 md:w-8 md:h-8" />
                </button>

                <div className="flex items-center space-x-2">
                  <div className={`px-4 py-1 md:py-2 rounded-xl font-black text-lg md:text-xl shadow-sm ${difficulty === 'hard' ? 'bg-orange-100 text-orange-700' : 'bg-blue-100 text-blue-700'}`}>
                    {questionCount} / {TOTAL_QUESTIONS}
                  </div>
                </div>
                
                <div className="flex items-center gap-2 md:gap-4">
                  <div className="font-mono text-2xl md:text-3xl font-black text-slate-700 tracking-wider bg-slate-100 px-3 py-1 rounded-lg border-2 border-slate-200">
                    {formatTime(elapsedTime)}
                  </div>
                  <button 
                    onClick={() => setIsPaused(true)}
                    className="bg-gray-100 p-2 rounded-xl text-gray-500 hover:bg-blue-100 hover:text-blue-500 transition-colors"
                    aria-label="きゅうけい"
                  >
                    <Pause className="w-6 h-6 md:w-8 md:h-8 fill-current" />
                  </button>
                </div>
              </div>

              {isPaused && (
                <div className="absolute inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center animate-fade-in">
                  <div className="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center space-y-6 max-w-sm w-full border-4 border-blue-200">
                    <h2 className="text-3xl font-black text-slate-700 flex items-center gap-2">
                      <Pause className="w-8 h-8 fill-current text-blue-500" />
                      きゅうけい
                    </h2>
                    <div className="flex flex-col w-full gap-3">
                      <button
                        onClick={() => setIsPaused(false)}
                        className="w-full py-4 bg-blue-500 text-white rounded-2xl font-black text-xl border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 shadow-md flex items-center justify-center"
                      >
                        <Play className="w-6 h-6 mr-2 fill-current" />
                        つづける
                      </button>
                      <button
                        onClick={handleBackToTitle}
                        className="w-full py-4 bg-gray-200 text-gray-600 rounded-2xl font-black text-xl border-b-4 border-gray-300 active:border-b-0 active:translate-y-1 shadow-md flex items-center justify-center"
                      >
                        <LogOut className="w-6 h-6 mr-2" />
                        やめる
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {currentProblem && !isPaused && (
                // 修正: 上部のパディング(pt-6/pt-10)を追加してコンテンツ全体を下げる
                <div className="flex-1 flex flex-col items-center max-w-3xl mx-auto w-full px-2 pb-2 pt-6 md:px-4 md:pb-4 md:pt-10 space-y-2 md:space-y-4 z-0 h-full overflow-hidden">
                  
                  <div className="flex-1 w-full flex items-center justify-center relative shrink min-h-0">
                    <div className="text-[15vh] md:text-[20vh] filter drop-shadow-2xl animate-bounce-slow transform hover:scale-110 transition-transform cursor-pointer leading-none">
                      {currentProblem.emoji}
                    </div>
                    {isCorrectAnim && (
                        <div className="absolute inset-0 flex items-center justify-center z-20 animate-in fade-in zoom-in duration-300">
                          <CheckCircle className="w-32 h-32 md:w-48 md:h-48 text-green-500 fill-white drop-shadow-2xl" />
                        </div>
                    )}
                  </div>

                  <div className="w-full bg-white rounded-2xl md:rounded-3xl p-3 md:p-6 shadow-xl border-b-4 md:border-b-8 border-slate-200 flex flex-col items-center justify-center gap-2 md:gap-4 relative overflow-hidden shrink-0">
                      <div className="absolute top-0 left-0 w-full h-2 bg-slate-100" />
                      
                      <div className="flex flex-wrap justify-center gap-2 md:gap-4 z-10">
                        {Array.from({ length: currentProblem.word.length }).map((_, idx) => {
                          const charObj = userAnswer[idx];
                          return (
                            <button
                              key={`slot-${idx}`}
                              onClick={() => charObj && handleReturnChar(charObj, idx)}
                              disabled={!charObj}
                              className={`
                                w-12 h-12 md:w-20 md:h-20 rounded-xl md:rounded-2xl border-4 text-2xl md:text-5xl font-black flex items-center justify-center transition-all duration-200
                                ${charObj 
                                  ? 'bg-blue-500 border-blue-600 text-white shadow-lg transform scale-100 hover:bg-blue-400' 
                                  : 'bg-slate-50 border-dashed border-slate-300 transform scale-95'}
                                ${isWrong ? 'bg-red-500 border-red-600 animate-shake' : ''}
                                ${isCorrectAnim ? 'bg-green-500 border-green-600 scale-110' : ''}
                              `}
                            >
                              {charObj ? charObj.char : ''}
                            </button>
                          );
                        })}
                      </div>
                      {isWrong && (
                        <p className="text-red-500 font-bold animate-pulse absolute bottom-1 md:bottom-2 text-sm md:text-base">ちがうみたい...</p>
                      )}
                  </div>

                  <div className="flex-none h-auto w-full bg-white/40 rounded-3xl border-4 border-white/50 shadow-inner min-h-0 flex flex-wrap justify-center content-center gap-2 p-4 overflow-y-auto max-h-[35vh]">
                    {poolChars.map((charObj) => (
                      <button
                        key={charObj.id}
                        onClick={() => handleSelectChar(charObj)}
                        disabled={charObj.isUsed}
                        className={`
                          w-20 h-20 md:w-24 md:h-24 rounded-full border-b-4 
                          flex items-center justify-center text-4xl md:text-5xl font-black shadow-lg transition-all duration-200
                          ${charObj.isUsed 
                            ? 'opacity-20 scale-90 bg-gray-300 border-gray-400 cursor-default' 
                            : 'bg-orange-400 border-orange-600 text-white hover:bg-orange-500 active:scale-95 cursor-pointer hover:shadow-xl'}
                        `}
                      >
                        {charObj.char}
                      </button>
                    ))}
                  </div>

                  <div className="w-full flex justify-center pb-2 shrink-0">
                    <button
                      onClick={() => setShowHint(!showHint)}
                      className="group flex items-center px-6 py-2 md:px-8 md:py-3 bg-yellow-100 text-yellow-700 rounded-full font-bold hover:bg-yellow-200 transition-colors border-b-4 border-yellow-200 active:border-b-0 active:translate-y-1 text-sm md:text-base"
                    >
                      <Lightbulb className="w-4 h-4 md:w-5 md:h-5 mr-2 group-hover:animate-pulse" />
                      {showHint ? `こたえ: ${displayTargetWord}` : "ヒントをみる"}
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<MojiAwaseApp />);
    </script>
</body>
</html>
