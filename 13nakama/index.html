<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>なかまえらび・タイムアタックPlus</title>
    <style>
        :root {
            --bg-color: #fffcf0;
            --main-text: #4a4a4a;
            --accent-pink: #ff7675;
            --accent-blue: #74b9ff;
            --accent-green: #55efc4;
            --accent-yellow: #feca57;
            --accent-purple: #a29bfe;
            --card-shadow: 0 6px 0 rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#ffeaa7 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--main-text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden;
        }

        .bg-deco {
            position: fixed;
            font-size: 40px;
            z-index: -1;
            opacity: 0.15;
            animation: float 6s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        #app {
            width: 95%;
            max-width: 500px;
            max-height: 94vh;
            max-height: 94dvh;
            background: white;
            border-radius: 35px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 6px solid #fff;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .pop-title {
            font-size: clamp(18px, 6vw, 28px);
            color: var(--accent-pink);
            margin: 5px 0 10px 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .pop-title span {
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 rgba(255, 118, 117, 0.1);
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px) scale(1.05); }
        }

        .screen { display: none; height: 100%; flex-direction: column; overflow: hidden; }
        .screen.active { display: flex; }

        .settings-container {
            flex: 1;
            overflow-y: auto;
            padding-right: 2px;
            margin-bottom: 8px;
        }

        .setting-panel {
            background: #fdfbff;
            border-radius: 18px;
            padding: 10px;
            margin-bottom: 8px;
            border: 2px solid #f8f8f8;
            box-shadow: var(--card-shadow);
        }

        .setting-label {
            font-size: 12px;
            font-weight: bold;
            color: #b2bec3;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .setting-btn {
            background: #fff;
            border: 2px solid #eee;
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #636e72;
            transition: 0.2s;
            flex: 1;
            min-width: 70px;
            box-shadow: 0 3px 0 #eee;
        }

        .setting-btn.active { color: white; transform: translateY(-1px); }

        #mode-group .setting-btn:nth-child(1).active { background: var(--accent-pink); border-color: #e66767; box-shadow: 0 3px 0 #e66767; }
        #mode-group .setting-btn:nth-child(2).active { background: var(--accent-blue); border-color: #5da2e6; box-shadow: 0 3px 0 #5da2e6; }
        #mode-group .setting-btn:nth-child(3).active { background: var(--accent-yellow); border-color: #e6b84d; box-shadow: 0 3px 0 #e6b84d; }
        #diff-group .setting-btn.active { background: var(--accent-purple); border-color: #8c85e6; box-shadow: 0 3px 0 #8c85e6; }
        #count-group .setting-btn.active { background: var(--accent-green); border-color: #48d6af; box-shadow: 0 3px 0 #48d6af; }

        .start-btn-wrap { flex-shrink: 0; padding-top: 5px; }
        .start-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #ff7675 100%);
            color: white;
            border: none;
            padding: 12px 0;
            font-size: clamp(20px, 5vw, 24px);
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 0 #d63031;
            width: 100%;
            transition: 0.1s;
        }
        .start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d63031; }

        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        #timer { background: #f1f2f6; padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 14px; }
        .interrupt-btn { background: #fab1a0; border: none; color: white; padding: 5px 10px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer; }

        .question-area { font-size: clamp(18px, 6vw, 24px); font-weight: bold; margin: 4px 0; color: #2d3436; flex-shrink: 0; }
        .hint-text { color: var(--accent-pink); font-size: 16px; margin-bottom: 4px; font-weight: bold; height: 20px; flex-shrink: 0; }

        .grid {
            display: grid;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            align-content: start;
        }

        /* 選択肢の数に応じて列数を変える */
        .grid.grid-9 { grid-template-columns: repeat(3, 1fr); }
        .grid.grid-15 { grid-template-columns: repeat(3, 1fr); }

        .card {
            background: white;
            border: 2px solid var(--accent-blue);
            border-radius: 15px;
            padding: 8px 2px;
            font-size: clamp(12px, 4vw, 15px);
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            transition: 0.1s;
        }
        /* 絵文字モードの時は少し大きく */
        .card.emoji-mode { font-size: clamp(24px, 10vw, 36px); padding: 0; }
        .card.selected { background: #ffeaa7; border-color: var(--accent-yellow); box-shadow: none; transform: translateY(4px); }

        #learning-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.98);
            border: 6px solid var(--accent-yellow);
            border-radius: 25px;
            padding: 15px;
            z-index: 1000;
            display: none;
            width: 85%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        .learning-row { margin: 8px 0; font-size: clamp(24px, 8vw, 32px); font-weight: bold; }
        .learning-label { font-size: 12px; color: #bbb; }

        .pop-obj {
            position: fixed;
            pointer-events: none;
            font-size: 32px;
            z-index: 999;
            animation: popOut 0.8s ease-out forwards;
        }
        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.6) rotate(var(--tr)); opacity: 0; }
        }

        .result-score { font-size: 40px; color: var(--accent-pink); margin: 15px 0; font-weight: 900; }
        .hi-score-box { background: #e8f8f5; padding: 10px; border-radius: 15px; color: var(--accent-green); font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="bg-deco" style="top:5%; left:5%; animation-delay: 0s;">🎒</div>
    <div class="bg-deco" style="top:15%; right:8%; animation-delay: 1.5s;">🎨</div>
    <div class="bg-deco" style="bottom:10%; left:10%; animation-delay: 3s;">🍎</div>
    <div class="bg-deco" style="bottom:20%; right:5%; animation-delay: 4.5s;">🦒</div>

    <div id="app">
        <div id="learning-overlay">
            <div class="learning-label">ひらがな</div>
            <div class="learning-row" id="learn-hira"></div>
            <hr style="border:0; border-top:2px dashed #eee; margin: 8px 0;">
            <div class="learning-label">カタカナ</div>
            <div class="learning-row" id="learn-kata"></div>
        </div>

        <!-- TITLE SCREEN -->
        <div id="title-screen" class="screen active">
            <h1 class="pop-title">
                <span>な</span><span>か</span><span>ま</span><span>え</span><span>ら</span><span>び</span>
            </h1>
            
            <div class="settings-container">
                <div class="setting-panel">
                    <div class="setting-label">🕹️ どれで あそぶ？</div>
                    <div class="btn-group" id="mode-group">
                        <button class="setting-btn active" onclick="setMode('hira', this)">ひらがな</button>
                        <button class="setting-btn" onclick="setMode('kata', this)">カタカナ</button>
                        <button class="setting-btn" onclick="setMode('emoji', this)">え</button>
                    </div>
                </div>

                <div class="setting-panel">
                    <div class="setting-label">🔥 むずかしさ</div>
                    <div class="btn-group" id="diff-group">
                        <button class="setting-btn active" onclick="setDiff('easy', this)">かんたん</button>
                        <button class="setting-btn" onclick="setDiff('hard', this)">むずかしい</button>
                    </div>
                </div>

                <div class="setting-panel">
                    <div class="setting-label">🏁 もんすう</div>
                    <div class="btn-group" id="count-group">
                        <button class="setting-btn active" onclick="setCount(5, this)">5もん</button>
                        <button class="setting-btn" onclick="setCount(10, this)">10もん</button>
                    </div>
                </div>
            </div>

            <div class="start-btn-wrap">
                <button class="start-btn" onclick="startGame()">スタート！</button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen">
            <div class="header-info">
                <div id="q-count" style="font-weight:bold; font-size:13px; color:#a29bfe;">1 / 5</div>
                <div id="timer">0.0秒</div>
                <button class="interrupt-btn" onclick="interruptGame()">もどる</button>
            </div>
            <div class="question-area" id="question-text">読み込み中...</div>
            <div class="hint-text" id="hint-text">あと 3つ</div>
            <div class="grid" id="game-grid"></div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
            <div style="margin-top:20px; text-align: center;">
                <h2 style="color: var(--accent-pink); margin: 0; font-size: 24px;">✨ クリア！ ✨</h2>
                <div class="result-score" id="final-time">0.0秒</div>
                <div class="hi-score-box" id="high-score-text">ベスト: --</div>
            </div>
            <div style="margin-top:auto;">
                <button class="start-btn" onclick="goToTitle()">もういちど</button>
            </div>
        </div>
    </div>

<script>
    const categoryData = {
        "がっき": [
            {n:"ぴあの", k:"ピアノ", e:"🎹"}, {n:"たいこ", k:"タイコ", e:"🥁"}, {n:"らっぱ", k:"ラッパ", e:"🎺"}, 
            {n:"ばいおりん", k:"バイオリン", e:"🎻"}, {n:"さっくす", k:"サックス", e:"🎷"}, {n:"あこーでおん", k:"アコーディオン", e:"🪗"}, 
            {n:"ふるーと", k:"フルート", e:"🪈"}, {n:"まらかす", k:"マラカス", e:"🪇"}, {n:"ぎたー", k:"ギター", e:"🎸"}, {n:"すず", k:"スズ", e:"🔔"}
        ],
        "のりもの": [
            {n:"くるま", k:"クルマ", e:"🚗"}, {n:"ばす", k:"バス", e:"🚌"}, {n:"きゅうきゅうしゃ", k:"キュウキュウシャ", e:"🚑"}, 
            {n:"しょうぼうしゃ", k:"ショウボウシャ", e:"🚒"}, {n:"ぱとかー", k:"パトカー", e:"🚓"}, {n:"しんかんせん", k:"シンカンセン", e:"🚄"}, 
            {n:"ひこうき", k:"ヒコウキ", e:"✈️"}, {n:"へりこぷたー", k:"ヘリコプター", e:"🚁"}, {n:"じてんしゃ", k:"ジテンシャ", e:"🚲"}, {n:"ふね", k:"フネ", e:"🚢"}
        ],
        "やさい": [
            {n:"にんじん", k:"ニンジン", e:"🥕"}, {n:"とまと", k:"トマト", e:"🍅"}, {n:"ぶろっこりー", k:"ブロッコリー", e:"🥦"}, 
            {n:"とうもろこし", k:"トウモロコシ", e:"🌽"}, {n:"じゃがいも", k:"ジャガイモ", e:"🥔"}, {n:"なす", k:"ナス", e:"🍆"}, 
            {n:"きのこ", k:"キノコ", e:"🍄"}, {n:"きゅうり", k:"キュウリ", e:"🥒"}, {n:"たまねぎ", k:"タマネギ", e:"🧅"}, {n:"はくさい", k:"ハクサイ", e:"🥬"}
        ],
        "くだもの": [
            {n:"りんご", k:"リンゴ", e:"🍎"}, {n:"ばなな", k:"バナナ", e:"🍌"}, {n:"ぶどう", k:"ブドウ", e:"🍇"}, 
            {n:"いちご", k:"イチゴ", e:"🍓"}, {n:"もも", k:"モモ", e:"🍑"}, {n:"めろん", k:"メロン", e:"🍈"}, 
            {n:"さくらんぼ", k:"サクランボ", e:"🍒"}, {n:"ぱいなっぷる", k:"パイナップル", e:"🍍"}, {n:"みかん", k:"ミカン", e:"🍊"}, {n:"すいか", k:"スイカ", e:"🍉"}
        ],
        "どうぶつ": [
            {n:"いぬ", k:"イヌ", e:"🐶"}, {n:"ねこ", k:"ネコ", e:"🐱"}, {n:"うさぎ", k:"ウサギ", e:"🐰"}, 
            {n:"らいおん", k:"ライオン", e:"🦁"}, {n:"ぞう", k:"ゾウ", e:"🐘"}, {n:"きりん", k:"キリン", e:"🦒"}, 
            {n:"ぱんだ", k:"パンダ", e:"🐼"}, {n:"さる", k:"サル", e:"🐵"}, {n:"くま", k:"クマ", e:"🐻"}, {n:"はむすたー", k:"ハムスター", e:"🐹"}
        ],
        "むし": [
            {n:"ちょうちょ", k:"チョウチョ", e:"🦋"}, {n:"てんとうむし", k:"テントウムシ", e:"🐞"}, {n:"はち", k:"ハチ", e:"🐝"}, 
            {n:"あり", k:"アリ", e:"🐜"}, {n:"かたつむり", k:"カタツムリ", e:"🐌"}, {n:"あおむし", k:"アオムシ", e:"🐛"}, 
            {n:"ばった", k:"バッタ", e:"🦗"}, {n:"こがねむし", k:"コガネムシ", e:"🪲"}, {n:"くも", k:"クモ", e:"🕷️"}, {n:"か", k:"カ", e:"🦟"}
        ],
        "どうぐ": [
            {n:"えんぴつ", k:"エンピツ", e:"✏️"}, {n:"ものさし", k:"モノサシ", e:"📏"}, {n:"はさみ", k:"ハサミ", e:"✂️"}, 
            {n:"めも", k:"メモ", e:"📝"}, {n:"ほん", k:"ホン", e:"📕"}, {n:"くれよん", k:"クレヨン", e:"🖍️"}, 
            {n:"えのぐ", k:"エノグ", e:"🎨"}, {n:"らんどせる", k:"ランドセル", e:"🎒"}, {n:"ぺん", k:"ペン", e:"🖋️"}, {n:"くりっぷ", k:"クリップ", e:"📎"}
        ],
        "とり": [
            {n:"ぺんぎん", k:"ペンギン", e:"🐧"}, {n:"ひよこ", k:"ヒヨコ", e:"🐤"}, {n:"あひる", k:"アヒル", e:"🦆"}, 
            {n:"わし", k:"ワシ", e:"🦅"}, {n:"ふくろう", k:"フクロウ", e:"🦉"}, {n:"ふらみんご", k:"フラミンゴ", e:"🦩"}, 
            {n:"おうむ", k:"オウム", e:"🦜"}, {n:"はと", k:"ハト", e:"🕊️"}, {n:"はくちょう", k:"ハクチョウ", e:"🦢"}, {n:"にわとり", k:"ニワトリ", e:"🐔"}
        ],
        "からだの なまえ": [
            {n:"め", k:"メ", e:"👀"}, {n:"みみ", k:"ミミ", e:"👂"}, {n:"はな", k:"ハナ", e:"👃"}, 
            {n:"くち", k:"クチ", e:"👄"}, {n:"した", k:"シタ", e:"👅"}, {n:"は", k:"ハ", e:"🦷"}, 
            {n:"て", k:"テ", e:"🖐️"}, {n:"あし", k:"アシ", e:"🦶"}, {n:"うで", k:"ウデ", e:"💪"}, {n:"かお", k:"カオ", e:"👱"}
        ]
    };

    let config = { mode: 'hira', diff: 'easy', totalQ: 5 };
    let currentQ = 0;
    let startTime;
    let timerId;
    let correctWords = [];
    let foundCount = 0;
    let neededCount = 3;

    function setMode(m, el) { config.mode = m; updateUI(el); }
    function setDiff(d, el) { config.diff = d; updateUI(el); }
    function setCount(c, el) { config.totalQ = c; updateUI(el); }

    function updateUI(el) {
        Array.from(el.parentNode.children).forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function startGame() {
        currentQ = 1;
        neededCount = config.diff === 'easy' ? 3 : 5;
        switchScreen('game-screen');
        startTime = Date.now();
        timerId = setInterval(updateTimer, 100);
        nextQuestion();
    }

    function interruptGame() {
        clearInterval(timerId);
        goToTitle();
    }

    function updateTimer() {
        const elapsed = (Date.now() - startTime) / 1000;
        document.getElementById('timer').innerText = elapsed.toFixed(1) + "秒";
    }

    function nextQuestion() {
        foundCount = 0;
        updateHint();
        document.getElementById('q-count').innerText = `${currentQ} / ${config.totalQ}`;
        
        const categories = Object.keys(categoryData);
        const targetCat = categories[Math.floor(Math.random() * categories.length)];
        document.getElementById('question-text').innerText = `${targetCat} を えらんでね！`;

        const totalBtn = config.diff === 'easy' ? 9 : 15;
        const grid = document.getElementById('game-grid');
        grid.className = 'grid ' + (totalBtn === 9 ? 'grid-9' : 'grid-15');

        const correctPool = [...categoryData[targetCat]].sort(() => 0.5 - Math.random());
        const correctItems = correctPool.slice(0, neededCount);
        correctWords = correctItems.map(i => i.n);

        let wrongItems = [];
        while(wrongItems.length < (totalBtn - neededCount)) {
            const otherCat = categories[Math.floor(Math.random() * categories.length)];
            if(otherCat === targetCat) continue;
            const item = categoryData[otherCat][Math.floor(Math.random() * 10)];
            if(!wrongItems.find(i => i.n === item.n)) wrongItems.push(item);
        }

        const allItems = [...correctItems, ...wrongItems].sort(() => 0.5 - Math.random());
        grid.innerHTML = '';
        allItems.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'card' + (config.mode === 'emoji' ? ' emoji-mode' : '');
            if(config.mode === 'hira') btn.innerText = item.n;
            else if(config.mode === 'kata') btn.innerText = item.k;
            else btn.innerText = item.e;
            btn.onclick = () => tapCard(btn, item);
            grid.appendChild(btn);
        });
    }

    function tapCard(btn, item) {
        if(btn.classList.contains('selected')) return;
        if(correctWords.includes(item.n)) {
            btn.classList.add('selected');
            foundCount++;
            if (config.mode === 'emoji') showLearningDisplay(item);
            else showPopEffect(item.e);
            updateHint();
            if(foundCount === neededCount) {
                const delay = (config.mode === 'emoji') ? 1100 : 600;
                if(currentQ >= config.totalQ) setTimeout(endGame, delay - 100);
                else { currentQ++; setTimeout(nextQuestion, delay); }
            }
        } else {
            btn.style.background = '#ffcccc';
            setTimeout(() => btn.style.background = 'white', 200);
        }
    }

    function updateHint() {
        document.getElementById('hint-text').innerText = `あと ${neededCount - foundCount}つ！`;
    }

    function showLearningDisplay(item) {
        const overlay = document.getElementById('learning-overlay');
        document.getElementById('learn-hira').innerText = item.n;
        document.getElementById('learn-kata').innerText = item.k;
        overlay.style.display = 'block';
        setTimeout(() => { overlay.style.display = 'none'; }, 1000);
    }

    function showPopEffect(content) {
        const x = window.innerWidth / 2;
        const y = window.innerHeight / 2;
        for(let i=0; i<8; i++) {
            const p = document.createElement('div');
            p.className = 'pop-obj';
            p.innerText = content;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.setProperty('--tx', `${(Math.random()-0.5)*500}px`);
            p.style.setProperty('--ty', `${(Math.random()-0.5)*500}px`);
            p.style.setProperty('--tr', `${(Math.random()-0.5)*720}deg`);
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    function endGame() {
        clearInterval(timerId);
        const finalTime = (Date.now() - startTime) / 1000;
        switchScreen('result-screen');
        document.getElementById('final-time').innerText = finalTime.toFixed(2) + "秒";
        const key = `best_${config.mode}_${config.diff}_${config.totalQ}`;
        const saved = localStorage.getItem(key);
        if(!saved || finalTime < parseFloat(saved)) {
            localStorage.setItem(key, finalTime);
            document.getElementById('high-score-text').innerText = "✨ しんきろく！ ✨";
        } else {
            document.getElementById('high-score-text').innerText = `ベスト: ${parseFloat(saved).toFixed(2)}秒`;
        }
    }

    function switchScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function goToTitle() { switchScreen('title-screen'); }
</script>

</body>
</html>
