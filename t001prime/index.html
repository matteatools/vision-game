<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>約分シューティング: RETRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg-color: #050505;
            --main-color: #0f0;
            --max-width: 600px;
            /* ゲームの最大幅を制限してPCでも遊びやすく */
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            /* 余白部分の色 */
            color: var(--main-color);
            font-family: 'DotGothic16', monospace;
            touch-action: none;
            display: flex;
            justify-content: center;
            /* 画面中央寄せ */
            height: 100vh;
            height: 100dvh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* アプリ全体のコンテナ */
        #app-container {
            width: 100%;
            max-width: var(--max-width);
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        #game-area {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            border-bottom: 2px solid #333;
        }

        #scanline-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 50;
        }

        canvas {
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            width: 100%;
            height: 100%;
            display: block;
            /* pixelatedはJS側で制御するがCSSでも念のため */
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            font-size: clamp(16px, 4vw, 24px);
            /* 画面サイズに合わせて文字サイズ調整 */
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 0 #000;
            display: flex;
            flex-direction: column;
            gap: 2px;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
        }

        #pause-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 30;
            background-color: #000;
            border: 2px solid #0f0;
            color: #0f0;
            padding: 8px 12px;
            font-family: 'DotGothic16', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 0 5px #0f0;
            display: none;
            touch-action: manipulation;
        }

        #pause-btn:active {
            background-color: #0f0;
            color: #000;
        }

        #bomb-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            z-index: 40;
            background-color: #000;
            border: 3px solid #ff9800;
            color: #ff9800;
            padding: 8px 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.7rem, 3vw, 1rem);
            cursor: pointer;
            box-shadow: 0 0 10px #ff9800;
            display: none;
            touch-action: manipulation;
            border-radius: 8px;
            text-align: center;
            line-height: 1.4;
        }

        #bomb-btn:active {
            transform: scale(0.95);
            background-color: #ff9800;
            color: #000;
        }

        #bomb-btn.bomb-ready {
            display: block;
            animation: bombPulse 2s infinite;
        }

        @keyframes bombPulse {
            0% {
                box-shadow: 0 0 10px #ff9800;
            }

            50% {
                box-shadow: 0 0 20px #ff9800, inset 0 0 10px #ff9800;
            }

            100% {
                box-shadow: 0 0 10px #ff9800;
            }
        }

        #life-container {
            position: absolute;
            top: 50px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 10;
        }

        .life-heart {
            width: 20px;
            height: 20px;
            background-color: #f0f;
            box-shadow: 0 0 8px #f0f;
            clip-path: polygon(20% 0%, 40% 0%, 50% 20%, 60% 0%, 80% 0%, 100% 20%, 100% 50%, 50% 100%, 0% 50%, 0% 20%);
            transition: opacity 0.2s;
        }

        .life-lost {
            background-color: #333;
            box-shadow: none;
            opacity: 0.3;
        }

        #level-notify {
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: #ffeb3b;
            opacity: 0;
            transition: opacity 0.1s;
            text-shadow: 2px 2px 0 #000;
            text-align: center;
            font-family: 'DotGothic16', monospace;
            margin-top: 10px;
        }

        .show-notify {
            opacity: 1 !important;
            animation: blink 0.2s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1
            }

            50% {
                opacity: 0
            }

            100% {
                opacity: 1
            }
        }

        #boss-warning {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(2rem, 8vw, 3rem);
            color: #f00;
            text-shadow: 4px 4px 0 #500;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
            white-space: nowrap;
        }

        .boss-anim {
            animation: bossFlash 2s steps(4);
        }

        @keyframes bossFlash {
            0% {
                opacity: 0;
                visibility: hidden;
            }

            10% {
                opacity: 1;
                visibility: visible;
            }

            20% {
                opacity: 0;
                visibility: hidden;
            }

            30% {
                opacity: 1;
                visibility: visible;
            }

            40% {
                opacity: 0;
                visibility: hidden;
            }

            50% {
                opacity: 1;
                visibility: visible;
                transform: translate(-50%, -50%) scale(1.2);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transition: opacity 0.3s;
            padding: 20px;
            box-sizing: border-box;
        }

        .screen::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 50, 0, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 50, 0, 0.5) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .penalty-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.5);
            pointer-events: none;
            z-index: 15;
            display: none;
        }

        .penalty-active {
            display: block;
            animation: flash 0.2s steps(2);
        }

        @keyframes flash {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: clamp(2rem, 8vw, 3rem);
            color: #0f0;
            text-shadow: 4px 4px 0 #050;
            text-align: center;
            line-height: 1.2;
            font-family: 'DotGothic16', sans-serif;
            letter-spacing: 5px;
        }

        .sub-text {
            font-size: clamp(0.8rem, 3.5vw, 1rem);
            margin-bottom: 30px;
            text-align: center;
            color: #ccc;
            padding: 0 10px;
            line-height: 1.6;
            max-width: 100%;
        }

        .mode-select-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 350px;
            align-items: stretch;
        }

        .mode-btn-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .big-btn {
            padding: 15px 10px;
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #0f0;
            border: 4px solid #0f0;
            box-shadow: 0 0 10px #0f0, inset 0 0 10px #0f0;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            width: 100%;
            touch-action: manipulation;
        }

        .big-btn:hover {
            background-color: #0f0;
            color: #000;
        }

        .big-btn:active {
            transform: scale(0.98);
        }

        .score-label {
            font-size: 0.7rem;
            color: #ffeb3b;
            text-align: center;
            font-family: 'Press Start 2P', cursive;
        }

        .title-btn {
            border-color: #fff !important;
            color: #fff !important;
            box-shadow: 0 0 10px #fff, inset 0 0 10px #fff !important;
            margin-top: 10px;
        }

        .title-btn:hover {
            background-color: #fff !important;
            color: #000 !important;
        }

        /* Control Panel Layout */
        #controls-container {
            width: 100%;
            background-color: #111;
            border-top: 4px solid #333;
            display: flex;
            flex-direction: row;
            padding: 6px;
            /* iPhone Home Bar対応 */
            padding-bottom: max(6px, env(safe-area-inset-bottom));
            box-sizing: border-box;
            z-index: 30;
            touch-action: manipulation;
            flex-shrink: 0;
            gap: 6px;
            height: auto;
            min-height: 160px;
            /* 少し高さを確保 */
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            width: 24%;
            gap: 6px;
        }

        #panel-center {
            display: flex;
            flex-direction: column;
            flex: 1;
            gap: 6px;
        }

        .center-row {
            display: flex;
            flex: 1;
            gap: 6px;
            width: 100%;
        }

        .ctrl-btn {
            border: 2px dashed #444;
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            /* iOS Safariでの選択防止 */
            transition: transform 0.05s, box-shadow 0.05s, opacity 0.5s;
            flex: 1;
            min-width: 0;
            margin: 0;
            height: auto;
            padding: 2px 0;
            touch-action: manipulation;

            opacity: 0.15;
            pointer-events: none;
            filter: grayscale(100%);
            -webkit-tap-highlight-color: transparent;
            /* タップ時のハイライト削除 */
        }

        .ctrl-btn.unlocked {
            border-style: solid;
            background-color: #222;
            opacity: 1;
            pointer-events: auto;
            filter: none;
            box-shadow: 0 4px 0 #000;
            animation: lightUp 0.5s ease-out;
        }

        @keyframes lightUp {
            0% {
                opacity: 0.2;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
                background-color: #fff;
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .ctrl-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        .btn-num {
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            line-height: 1.1;
            pointer-events: none;
        }

        .btn-sub {
            font-size: clamp(0.5rem, 2.5vw, 0.7rem);
            opacity: 0.8;
            font-family: 'DotGothic16', monospace;
            margin-top: 2px;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            #controls-container {
                padding: 4px;
                padding-bottom: max(4px, env(safe-area-inset-bottom));
                gap: 4px;
                min-height: 140px;
                /* スマホでは少しコンパクトに */
            }

            .side-panel,
            #panel-center,
            .center-row {
                gap: 4px;
            }
        }

        /* 画面高さが非常に低い場合（横持ちスマホなど）の調整 */
        @media (max-height: 500px) {
            #controls-container {
                min-height: 100px;
            }

            .btn-num {
                font-size: 1rem;
            }

            .btn-sub {
                display: none;
            }

            /* サブテキストを隠してスペース確保 */
        }

        /* Standard Primes */
        .btn-2 {
            border-color: #e53935;
            color: #e53935;
            text-shadow: 0 0 5px #e53935;
        }

        .btn-3 {
            border-color: #1e88e5;
            color: #1e88e5;
            text-shadow: 0 0 5px #1e88e5;
        }

        .btn-5 {
            border-color: #fdd835;
            color: #fdd835;
            text-shadow: 0 0 5px #fdd835;
        }

        .btn-7 {
            border-color: #d000f0;
            color: #d000f0;
            text-shadow: 0 0 5px #d000f0;
        }

        .btn-11 {
            border-color: #00e5ff;
            color: #00e5ff;
            text-shadow: 0 0 5px #00e5ff;
        }

        .btn-13 {
            border-color: #ff9100;
            color: #ff9100;
            text-shadow: 0 0 5px #ff9100;
        }

        /* Special Buttons */
        .btn-power {
            background: linear-gradient(135deg, #1a1a1a 0%, #333 100%);
            border-width: 3px;
        }

        .btn-power .btn-sub::before {
            content: "■";
            font-size: 0.8em;
            margin-right: 3px;
            vertical-align: 1px;
        }

        .btn-mix {
            background: linear-gradient(to bottom, #111, #222);
            border-style: double;
            border-width: 5px;
        }

        .btn-mix .btn-sub::before {
            content: "×";
            font-size: 1.1em;
            margin-right: 1px;
            font-weight: bold;
        }

        .btn-4 {
            border-color: #536dfe;
            color: #8c9eff;
        }

        .btn-6 {
            border-color: #00bcd4;
            color: #4dd0e1;
        }

        .btn-8 {
            border-color: #7c4dff;
            color: #b388ff;
        }

        .btn-9 {
            border-color: #f06292;
            color: #f48fb1;
        }

        .btn-10 {
            border-color: #66bb6a;
            color: #a5d6a7;
        }

        .btn-12 {
            border-color: #ffa726;
            color: #ffcc80;
        }

        .key-hint {
            position: absolute;
            top: 2px;
            right: 4px;
            font-size: 0.5rem;
            color: #fff;
            opacity: 0.5;
            font-family: sans-serif;
        }

        .guide-text {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            pointer-events: none;
            font-size: clamp(0.7rem, 3vw, 1rem);
            opacity: 0.7;
        }

        #miss-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(60px, 15vw, 100px);
            color: #f00;
            text-shadow: 4px 4px 0 #500;
            pointer-events: none;
            opacity: 0;
            z-index: 12;
        }

        .show-miss {
            animation: popMiss 0.2s ease-out;
        }

        @keyframes popMiss {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div id="app-container">
        <div id="game-area">
            <!-- 走査線オーバーレイ -->
            <div id="scanline-overlay"></div>

            <!-- 動的背景 (星) 用キャンバス -->
            <canvas id="bgCanvas"
                style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; pointer-events: none;"></canvas>

            <div id="ui-layer">
                <div>SCORE: <span id="score">0</span></div>
                <div style="font-size: 0.6em; color: #ffeb3b; margin-top: 2px;">HI: <span id="high-score">0</span></div>
                <div id="level-notify">NEW BUTTON!</div>
            </div>

            <button id="pause-btn" onclick="game.togglePause()">PAUSE</button>
            <button id="bomb-btn" onclick="game.useBomb()">BOMB<br>★★★</button>

            <div id="life-container">
                <div class="life-heart" id="life-1"></div>
                <div class="life-heart" id="life-2"></div>
                <div class="life-heart" id="life-3"></div>
                <div class="life-heart" id="life-4"></div>
                <div class="life-heart" id="life-5"></div>
            </div>

            <div id="boss-warning">WARNING!</div>
            <div id="penalty-overlay" class="penalty-flash"></div>
            <div id="miss-feedback">MISS</div>

            <canvas id="gameCanvas" style="position: relative; z-index: 5; background: transparent;"></canvas>

            <div class="guide-text" style="z-index: 10;">SHOOT THE NUMBERS WITH DIVISORS</div>

            <div id="start-screen" class="screen">
                <h1>PRIME<br>SHOOTER</h1>
                <div class="mode-select-container">
                    <div class="mode-btn-wrapper">
                        <button class="big-btn" onclick="game.start('normal')">NORMAL MODE</button>
                        <div class="score-label">HI: <span id="hi-normal">0</span></div>
                    </div>
                    <div class="mode-btn-wrapper">
                        <button class="big-btn" onclick="game.start('boss_rush')"
                            style="border-color: #f00; color: #f00; box-shadow: 0 0 10px #f00, inset 0 0 10px #f00;">BOSS
                            RUSH</button>
                        <div class="score-label" style="color: #f00;">HI: <span id="hi-boss">0</span></div>
                    </div>
                    <div class="mode-btn-wrapper">
                        <button class="big-btn" onclick="game.start('full_open')"
                            style="border-color: #0ff; color: #0ff; box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;">FULL
                            OPEN</button>
                        <div class="score-label" style="color: #0ff;">HI: <span id="hi-full">0</span></div>
                    </div>
                </div>
            </div>

            <div id="pause-screen" class="screen hidden">
                <h1>PAUSED</h1>
                <button class="big-btn" onclick="game.togglePause()">RESUME</button>
                <button class="big-btn title-btn" onclick="game.quitToTitle()">TITLE</button>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1 style="color: #f00;">GAME OVER</h1>
                <p class="sub-text">
                    SCORE: <span id="final-score"
                        style="font-size: 1.5em; font-family: 'Press Start 2P'; color: #ffeb3b;">0</span><br>
                </p>
                <button class="big-btn" onclick="game.retry()">RETRY</button>
                <button class="big-btn title-btn" onclick="game.quitToTitle()">TITLE</button>
            </div>
        </div>

        <div id="controls-container">
            <!-- LEFT PANEL -->
            <div id="panel-left" class="side-panel">
                <button id="btn-4" class="ctrl-btn btn-power btn-4" onpointerdown="game.handleButtonPress(4, event)">
                    <span class="btn-num">4</span>
                    <span class="btn-sub">2×2</span>
                </button>
                <button id="btn-8" class="ctrl-btn btn-power btn-8" onpointerdown="game.handleButtonPress(8, event)">
                    <span class="btn-num">8</span>
                    <span class="btn-sub">2×2×2</span>
                </button>
                <button id="btn-9" class="ctrl-btn btn-power btn-9" onpointerdown="game.handleButtonPress(9, event)">
                    <span class="btn-num">9</span>
                    <span class="btn-sub">3×3</span>
                </button>
            </div>

            <!-- CENTER PANEL -->
            <div id="panel-center">
                <!-- ROW 1 -->
                <div class="center-row">
                    <button id="btn-2" class="ctrl-btn btn-2" onpointerdown="game.handleButtonPress(2, event)">
                        <span class="btn-num">2</span>
                    </button>
                    <button id="btn-3" class="ctrl-btn btn-3" onpointerdown="game.handleButtonPress(3, event)">
                        <span class="btn-num">3</span>
                    </button>
                    <button id="btn-5" class="ctrl-btn btn-5" onpointerdown="game.handleButtonPress(5, event)">
                        <span class="btn-num">5</span>
                    </button>
                </div>
                <!-- ROW 2 -->
                <div class="center-row">
                    <button id="btn-7" class="ctrl-btn btn-7" onpointerdown="game.handleButtonPress(7, event)">
                        <span class="btn-num">7</span>
                    </button>
                    <button id="btn-11" class="ctrl-btn btn-11" onpointerdown="game.handleButtonPress(11, event)">
                        <span class="btn-num">11</span>
                        <span class="key-hint">Q</span>
                    </button>
                    <button id="btn-13" class="ctrl-btn btn-13" onpointerdown="game.handleButtonPress(13, event)">
                        <span class="btn-num">13</span>
                        <span class="key-hint">W</span>
                    </button>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div id="panel-right" class="side-panel">
                <button id="btn-6" class="ctrl-btn btn-mix btn-6" onpointerdown="game.handleButtonPress(6, event)">
                    <span class="btn-num">6</span>
                    <span class="btn-sub">2×3</span>
                </button>
                <button id="btn-10" class="ctrl-btn btn-mix btn-10" onpointerdown="game.handleButtonPress(10, event)">
                    <span class="btn-num">10</span>
                    <span class="btn-sub">2×5</span>
                </button>
                <button id="btn-12" class="ctrl-btn btn-mix btn-12" onpointerdown="game.handleButtonPress(12, event)">
