    <script>
        class SoundManager {
            constructor() {
                this.ctx = null;
                this.isMuted = false;

                // BGM用
                this.bgmOsc = null;
                this.bgmGain = null;
                this.bgmInterval = null;
                this.bgmStep = 0;
                this.bgmSequence = [
                    220, 220, 330, 330, 293, 293, 220, null,
                    196, 196, 293, 293, 261, 261, 196, null,
                    164, 164, 246, 246, 220, 220, 164, null,
                    261, 261, 392, 392, 329, 329, 261, null
                ];
                this.bgmSpeed = 150; // ms per step
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startBGM() {
                if (!this.ctx || this.isMuted || this.bgmInterval) return;
                this.bgmStep = 0;

                this.bgmInterval = setInterval(() => {
                    if (this.isMuted) return;
                    const freq = this.bgmSequence[this.bgmStep % this.bgmSequence.length];
                    if (freq) {
                        this.playTone(freq, 'square', 0.1, 0.05); // BGMは音量控えめに
                    }
                    this.bgmStep++;

                    // ゲーム進行に応じてBGM速度アップ
                    if (this.bgmStep % 32 === 0 && this.bgmSpeed > 80) {
                        // BGMスピード変更時に再設定する部分は複雑化を避けるため今回は固定間隔
                    }
                }, this.bgmSpeed);
            }

            stopBGM() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }

            setBGMSpeed(speed) {
                if (this.bgmSpeed === speed) return;
                this.bgmSpeed = speed;
                if (this.bgmInterval) {
                    this.stopBGM();
                    this.startBGM();
                }
            }

            playTone(freq, type, duration, vol = 0.1, slide = 0) {
                if (!this.ctx || this.isMuted) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (slide !== 0) {
                    osc.frequency.exponentialRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
                }

                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            playNoise(duration, vol = 0.2) {
                if (!this.ctx || this.isMuted) return;
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 1000;

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                noise.start();
            }

            playShoot() { this.playTone(800, 'square', 0.1, 0.1, -400); }
            playSpecialShoot() { this.playTone(400, 'sawtooth', 0.3, 0.1, 400); }
            playHit() { this.playTone(200, 'square', 0.05, 0.1); }
            playExplosion() { this.playNoise(0.3, 0.3); }
            playBossExplosion() { this.playNoise(0.8, 0.5); }
            playLevelUp() {
                this.playTone(440, 'square', 0.1, 0.1);
                setTimeout(() => this.playTone(554, 'square', 0.1, 0.1), 100);
                setTimeout(() => this.playTone(659, 'square', 0.2, 0.1), 200);
            }
            playDamage() { this.playTone(100, 'sawtooth', 0.3, 0.3, -50); }
            playError() { this.playTone(80, 'square', 0.1, 0.2); }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.bgCanvas = document.getElementById('bgCanvas');
                this.gameArea = document.getElementById('game-area');
                this.ctx = this.canvas.getContext('2d');
                this.bgCtx = this.bgCanvas.getContext('2d');
                this.scoreEl = document.getElementById('score');
                this.highScoreEl = document.getElementById('high-score');
                this.finalScoreEl = document.getElementById('final-score');

                this.hiNormalEl = document.getElementById('hi-normal');
                this.hiBossEl = document.getElementById('hi-boss');
                this.hiFullEl = document.getElementById('hi-full');

                this.levelNotifyEl = document.getElementById('level-notify');
                this.bossWarningEl = document.getElementById('boss-warning');
                this.startScreen = document.getElementById('start-screen');
                this.pauseScreen = document.getElementById('pause-screen');
                this.gameOverScreen = document.getElementById('game-over-screen');
                this.penaltyOverlay = document.getElementById('penalty-overlay');
                this.controlsContainer = document.getElementById('controls-container');
                this.missFeedback = document.getElementById('miss-feedback');
                this.pauseBtn = document.getElementById('pause-btn');
                this.bombBtn = document.getElementById('bomb-btn');

                this.sound = new SoundManager();

                this.width = 0;
                this.height = 0;
                this.score = 0;
                this.currentMode = 'normal';
                this.highScores = {
                    normal: parseInt(localStorage.getItem('primeShooterHS_normal')) || 0,
                    boss_rush: parseInt(localStorage.getItem('primeShooterHS_boss_rush')) || 0,
                    full_open: parseInt(localStorage.getItem('primeShooterHS_full_open')) || 0
                };

                this.lives = 5;
                this.isRunning = false;
                this.isPaused = false;
                this.animationId = null;
                this.lastTime = 0;

                this.spawnTimer = 0;
                this.spawnInterval = 2500;

                this.player = { x: 0, y: 0, w: 40, h: 40 };
                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                this.stars = [];

                // 初期の星を生成
                this.initStars();

                // UI用ポップアップテキスト管理
                this.floatingTexts = [];

                // ボムシステム
                this.bombs = 0;
                this.maxBombs = 3;

                // コンボシステム用
                this.combo = 0;
                this.comboTimer = 0;
                this.comboDisplay = document.getElementById('combo-display');
                this.comboCountEl = document.getElementById('combo-count');
                this.comboMultiEl = document.getElementById('combo-multiplier');

                this.activePrimes = [];
                this.unlockedButtons = new Set();

                // 全ボタンと全素数
                this.allButtons = [2, 3, 5, 7, 11, 13, 4, 6, 8, 9, 10, 12];
                this.allPrimes = [2, 3, 5, 7, 11, 13];

                this.progression = [
                    { score: 0, type: 'prime', value: 2 },
                    { score: 0, type: 'prime', value: 3 },
                    { score: 10, type: 'prime', value: 5 },
                    { score: 25, type: 'special', value: 6 },
                    { score: 25, type: 'special', value: 4 },
                    { score: 25, type: 'special', value: 9 },
                    { score: 45, type: 'prime', value: 7 },
                    { score: 65, type: 'special', value: 10 },
                    { score: 85, type: 'prime', value: 11 },
                    { score: 105, type: 'special', value: 12 },
                    { score: 125, type: 'prime', value: 13 },
                    { score: 145, type: 'special', value: 8 }
                ];

                this.combinations = {
                    4: [2, 2], 6: [2, 3], 8: [4, 2], 9: [3, 3], 10: [2, 5], 12: [6, 2]
                };

                this.queueBossSpawn = false;

                window.addEventListener('resize', () => this.resize());
                window.addEventListener('keydown', (e) => this.handleInput(e));

                this.resize();
                this.updateButtonsUI();
                this.updateHighScoreDisplay();
            }

            resize() {
                const container = document.getElementById('game-area');
                this.width = container.clientWidth;
                this.height = container.clientHeight;

                // 高解像度対応
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.ctx.scale(dpr, dpr);

                // CSSサイズ設定
                this.canvas.style.width = this.width + 'px';
                this.canvas.style.height = this.height + 'px';

                this.bgCanvas.width = this.width * dpr;
                this.bgCanvas.height = this.height * dpr;
                this.bgCtx.scale(dpr, dpr);
                this.bgCanvas.style.width = this.width + 'px';
                this.bgCanvas.style.height = this.height + 'px';

                // Canvasコンテキストのピクセル化設定（リサイズでリセットされるため再設定）
                this.ctx.imageSmoothingEnabled = false;
                this.bgCtx.imageSmoothingEnabled = false;

                this.player.x = this.width / 2;
                this.player.y = this.height - 60;
            }

            updateHighScoreDisplay() {
                this.hiNormalEl.innerText = this.highScores.normal;
                this.hiBossEl.innerText = this.highScores.boss_rush;
                this.hiFullEl.innerText = this.highScores.full_open;

                if (this.currentMode) {
                    this.highScoreEl.innerText = this.highScores[this.currentMode];
                }
            }

            checkHighScore() {
                if (this.score > this.highScores[this.currentMode]) {
                    this.highScores[this.currentMode] = this.score;
                    localStorage.setItem(`primeShooterHS_${this.currentMode}`, this.score);
                    this.updateHighScoreDisplay();
                }
            }

            start(mode) {
                this.sound.init();
                this.currentMode = mode || 'normal';
                this.score = 0;
                this.lives = 5;
                this.scoreEl.innerText = 0;
                this.updateLivesUI();
                this.updateHighScoreDisplay();

                this.isRunning = true;
                this.isPaused = false;
                this.spawnInterval = 2500;
                this.spawnTimer = 0;
                this.queueBossSpawn = false;

                this.bullets = [];
                this.enemies = [];
                this.particles = [];
                this.floatingTexts = [];

                this.bombs = 0;
                this.updateBombUI();

                this.combo = 0;
                this.comboTimer = 0;

                this.activePrimes = [];
                this.unlockedButtons = new Set();
                this.penaltyOverlay.classList.remove('penalty-active');

                if (this.currentMode === 'normal') {
                    this.checkLevelProgression();
                } else {
                    // BOSS_RUSH と FULL_OPEN は最初から全開放
                    this.allButtons.forEach(v => this.unlockedButtons.add(v));
                    this.activePrimes = [...this.allPrimes];
                    this.updateButtonsUI();

                    if (this.currentMode === 'boss_rush') {
                        // 即座にボスを出す準備
                        this.spawnTimer = this.spawnInterval;
                    }
                }

                this.startScreen.classList.add('hidden');
                this.pauseScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.pauseBtn.style.display = 'block';

                this.sound.startBGM();

                this.lastTime = performance.now();
                this.loop(this.lastTime);
            }

            retry() {
                this.start(this.currentMode);
            }

            togglePause() {
                if (!this.isRunning) return;
                this.isPaused = !this.isPaused;

                if (this.isPaused) {
                    this.pauseScreen.classList.remove('hidden');
                    this.sound.stopBGM();
                } else {
                    this.pauseScreen.classList.add('hidden');
                    this.sound.startBGM();
                    this.lastTime = performance.now();
                    this.loop(this.lastTime);
                }
            }

            quitToTitle() {
                this.isRunning = false;
                this.isPaused = false;
                cancelAnimationFrame(this.animationId);
                this.sound.stopBGM();

                this.checkHighScore();

                this.pauseScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.startScreen.classList.remove('hidden');
                this.pauseBtn.style.display = 'none';
                this.levelNotifyEl.classList.remove('show-notify');
                this.penaltyOverlay.classList.remove('penalty-active');
                this.bossWarningEl.classList.remove('boss-anim');
                this.missFeedback.classList.remove('show-miss');

                this.ctx.clearRect(0, 0, this.width, this.height);
                this.drawPlayer(this.width / 2, this.height - 60);
                this.player.x = this.width / 2;
            }

            updateBombUI() {
                if (!this.bombBtn) return;
                if (this.bombs > 0) {
                    this.bombBtn.classList.add('bomb-ready');
                    const stars = '★'.repeat(this.bombs) + '☆'.repeat(this.maxBombs - this.bombs);
                    this.bombBtn.innerHTML = `BOMB<br><span style="font-size: 0.8em">${stars}</span>`;
                } else {
                    this.bombBtn.classList.remove('bomb-ready');
                    const stars = '☆'.repeat(this.maxBombs);
                    this.bombBtn.innerHTML = `BOMB<br><span style="font-size: 0.8em; opacity: 0.5;">${stars}</span>`;
                }
            }

            useBomb() {
                if (!this.isRunning || this.isPaused || this.bombs <= 0) return;

                this.bombs--;
                this.updateBombUI();

                this.sound.playBossExplosion();

                // 派手な画面揺れ
                this.gameArea.classList.remove('shake-hard', 'shake');
                void this.gameArea.offsetWidth;
                this.gameArea.classList.add('shake-hard');
                setTimeout(() => this.gameArea.classList.remove('shake-hard'), 600);

                // 画面フラッシュ
                this.bgCtx.fillStyle = 'rgba(255, 150, 0, 0.6)';
                this.bgCtx.fillRect(0, 0, this.width, this.height);

                this.createFloatingText(`BOMB BOMBER!`, this.player.x, this.player.y - 60, '#ff9800', true);

                let pointsEarned = 0;

                // 全敵破壊
                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    this.createParticles(e.x, e.y, e.isBoss ? 60 : 30, '#ff9800');

                    let pts = e.isBoss ? 10 : 2;
                    pointsEarned += pts;
                }

                if (pointsEarned > 0) {
                    this.score += pointsEarned;
                    this.scoreEl.innerText = this.score;
                    this.checkLevelProgression();
                }

                this.enemies = []; // 全クリア
            }

            updateLivesUI() {
                for (let i = 1; i <= 5; i++) {
                    const heart = document.getElementById(`life-${i}`);
                    if (i <= this.lives) {
                        heart.classList.remove('life-lost');
                    } else {
                        heart.classList.add('life-lost');
                    }
                }
            }

            takeDamage() {
                this.lives--;
                this.updateLivesUI();
                this.sound.playDamage();
                this.resetCombo();

                // 画面揺れ(Shake)
                this.gameArea.classList.remove('shake', 'shake-hard');
                void this.gameArea.offsetWidth;
                this.gameArea.classList.add('shake');
                setTimeout(() => this.gameArea.classList.remove('shake'), 400);

                this.penaltyOverlay.classList.remove('penalty-active');
                void this.penaltyOverlay.offsetWidth;
                this.penaltyOverlay.classList.add('penalty-active');
                setTimeout(() => {
                    this.penaltyOverlay.classList.remove('penalty-active');
                }, 200);

                this.enemies = [];
                this.bullets = [];

                this.spawnTimer = -2000;

                if (this.lives <= 0) {
                    this.stop();
                }
            }

            checkLevelProgression() {
                if (this.currentMode !== 'normal') return;

                let updated = false;
                let newButtonTexts = [];

                this.progression.forEach(step => {
                    if (this.score >= step.score) {
                        if (!this.unlockedButtons.has(step.value)) {
                            this.unlockedButtons.add(step.value);
                            if (step.type === 'prime') {
                                if (!this.activePrimes.includes(step.value)) {
                                    this.activePrimes.push(step.value);
                                }
                            }
                            updated = true;
                            newButtonTexts.push(step.value);
                        }
                    }
                });

                if (updated) {
                    this.updateButtonsUI();
                    if (this.score > 0) {
                        this.sound.playLevelUp();
                        this.queueBossSpawn = true;
                        const text = newButtonTexts.length > 1 ?
                            `UNLOCKED: [${newButtonTexts.join(', ')}]` :
                            `UNLOCKED: [${newButtonTexts[0]}]`;
                        this.showLevelNotify(text);
                    }
                }
            }

            updateButtonsUI() {
                this.allButtons.forEach(val => {
                    const btn = document.getElementById(`btn-${val}`);
                    if (this.unlockedButtons.has(val)) {
                        btn.classList.add('unlocked');
                    } else {
                        btn.classList.remove('unlocked');
                    }
                });
            }

            showLevelNotify(text) {
                this.levelNotifyEl.innerText = text;
                this.levelNotifyEl.classList.add('show-notify');
                setTimeout(() => {
                    this.levelNotifyEl.classList.remove('show-notify');
                }, 2000);
            }

            stop() {
                this.isRunning = false;
                cancelAnimationFrame(this.animationId);
                this.sound.stopBGM();
                this.finalScoreEl.innerText = this.score;
                this.checkHighScore();
                this.gameOverScreen.classList.remove('hidden');
                this.pauseBtn.style.display = 'none';
            }

            handleButtonPress(val, event) {
                if (event) {
                    event.preventDefault(); // ダブルタップズーム等の防止
                    // pointerdownなのでフォーカスは奪わないが念のため
                }
                this.shoot(val);
            }

            shoot(val) {
                if (!this.isRunning || this.isPaused) return;
                if (!this.unlockedButtons.has(val)) return;

                // ターゲットになるようにソート順を調整
                const targets = this.enemies
                    .filter(e => {
                        if (e.type === 'pair') {
                            return (e.val1 % val === 0 && e.val2 % val === 0);
                        } else {
                            return e.value % val === 0;
                        }
                    })
                    .sort((a, b) => {
                        if (a.isBoss && !b.isBoss) return -1;
                        if (!a.isBoss && b.isBoss) return 1;
                        return b.y - a.y; // それ以外は低い位置を優先
                    });

                if (targets.length > 0) {
                    const target = targets[0];
                    if (this.combinations[val]) {
                        this.shootSpecial(val, target);
                        this.sound.playSpecialShoot();
                    } else {
                        this.sound.playShoot();
                        this.bullets.push({
                            x: this.player.x,
                            y: this.player.y - 20,
                            value: val,
                            radius: 12,
                            speed: 20,
                            color: this.getBtnColor(val),
                            target: target,
                            state: 'active'
                        });
                    }
                } else {
                    this.triggerPenalty();
                }
            }

            shootSpecial(val, target) {
                const parts = this.combinations[val];
                const mergeY = this.player.y - 100;
                const mergeX = this.player.x;

                this.bullets.push({
                    x: this.player.x - 60, y: this.player.y, value: parts[0],
                    radius: 8, speed: 10, color: this.getBtnColor(parts[0]),
                    target: target, mergeTarget: { x: mergeX, y: mergeY },
                    state: 'merging_left', finalValue: val, finalColor: this.getBtnColor(val)
                });

                this.bullets.push({
                    x: this.player.x + 60, y: this.player.y, value: parts[1],
                    radius: 8, speed: 10, color: this.getBtnColor(parts[1]),
                    target: target, mergeTarget: { x: mergeX, y: mergeY },
                    state: 'merging_right', finalValue: val, finalColor: this.getBtnColor(val)
                });
            }

            triggerPenalty() {
                this.score -= 5;
                this.scoreEl.innerText = this.score;

                if (this.score < 0) {
                    this.stop();
                    return;
                }

                this.sound.playError();
                this.resetCombo();

                // 画面揺れ(Shake)
                this.gameArea.classList.remove('shake');
                void this.gameArea.offsetWidth;
                this.gameArea.classList.add('shake');
                setTimeout(() => this.gameArea.classList.remove('shake'), 400);

                this.penaltyOverlay.classList.remove('penalty-active');
                void this.penaltyOverlay.offsetWidth;
                this.penaltyOverlay.classList.add('penalty-active');
                setTimeout(() => {
                    this.penaltyOverlay.classList.remove('penalty-active');
                }, 200);

                this.missFeedback.classList.remove('show-miss');
                void this.missFeedback.offsetWidth;
                this.missFeedback.classList.add('show-miss');

                if (navigator.vibrate) navigator.vibrate(200);
            }

            // --- 追加: コンボ処理 ---
            addCombo() {
                this.combo++;
                this.comboTimer = 3000; // コンボ継続時間 3秒

                // 10コンボごとにボムを追加
                if (this.combo > 0 && this.combo % 10 === 0) {
                    if (this.bombs < this.maxBombs) {
                        this.bombs++;
                        this.updateBombUI();
                        this.createFloatingText('BOMB GET!', this.player.x, this.player.y - 40, '#ff9800', true);
                        this.sound.playLevelUp(); // 音を追加
                    }
                }

                if (this.combo >= 2) {
                    let multiplier = 1.0;
                    if (this.combo >= 2) multiplier = 1.2;
                    if (this.combo >= 5) multiplier = 1.5;
                    if (this.combo >= 10) multiplier = 2.0;

                    this.comboCountEl.innerText = `${this.combo} CHAIN!`;
                    this.comboMultiEl.innerText = `SCORE x${multiplier.toFixed(1)}`;

                    this.comboDisplay.classList.remove('show-combo');
                    void this.comboDisplay.offsetWidth;
                    this.comboDisplay.classList.add('show-combo');

                    // 少しだけ画面を揺らす（プチシェイク）
                    if (this.combo % 5 === 0) {
                        this.gameArea.classList.remove('shake');
                        void this.gameArea.offsetWidth;
                        this.gameArea.classList.add('shake');
                        setTimeout(() => this.gameArea.classList.remove('shake'), 400);
                    }

                    // コンボ中はBGMスピードを上げる
                    if (this.combo >= 10) this.sound.setBGMSpeed(90);
                    else if (this.combo >= 5) this.sound.setBGMSpeed(110);
                    else this.sound.setBGMSpeed(130);
                }
            }

            resetCombo() {
                this.combo = 0;
                this.comboTimer = 0;
            }

            handleInput(e) {
                if (!this.isRunning || this.isPaused) return;
                let val = 0;
                switch (e.key) {
                    case '2': val = 2; break;
                    case '3': val = 3; break;
                    case '5': val = 5; break;
                    case '7': val = 7; break;
                    case 'q': case 'Q': val = 11; break;
                    case 'w': case 'W': val = 13; break;
                    case '4': val = 4; break;
                    case '6': val = 6; break;
                    case '8': val = 8; break;
                    case '9': val = 9; break;
                }
                if (val > 0) this.shoot(val);
            }

            gcd(a, b) {
                if (b === 0) return a;
                return this.gcd(b, a % b);
            }

            spawnBoss() {
                const isPairBoss = Math.random() < 0.5;
                if (isPairBoss) {
                    this.spawnPairBoss();
                } else {
                    this.spawnSingleBoss();
                }
                this.queueBossSpawn = false;
            }

            spawnPairBoss() {
                let commonP = 2;
                if (this.activePrimes.length > 1) {
                    commonP = this.activePrimes[Math.floor(Math.random() * this.activePrimes.length)];
                }

                let val1, val2;
                let retry = 0;

                do {
                    val1 = commonP * this.activePrimes[Math.floor(Math.random() * this.activePrimes.length)];
                    val2 = commonP * this.activePrimes[Math.floor(Math.random() * this.activePrimes.length)];
                    if (Math.random() < 0.6) val1 *= (Math.random() < 0.5 ? 2 : 3);
                    if (Math.random() < 0.6) val2 *= (Math.random() < 0.5 ? 2 : 3);
                    if (val1 > 300) val1 = 100 + Math.floor(Math.random() * 100);
                    if (val2 > 300) val2 = 100 + Math.floor(Math.random() * 100);
                    if (this.gcd(val1, val2) === 1) {
                        val1 *= commonP; val2 *= commonP;
                    }
                    retry++;
                } while (val1 === val2 && retry < 10);

                if (val1 === val2) { val2 += commonP; }

                const x = this.width / 2;
                const radius = 40;

                this.showBossWarning();

                this.enemies.push({
                    id: Math.random(),
                    x: x, y: -100,
                    type: 'pair',
                    val1: val1, val2: val2,
                    maxVal: val1 + val2,
                    radius: radius,
                    speed: 0.7,
                    hitFlash: 0,
                    isBoss: true
                });
            }

            spawnSingleBoss() {
                let val = 100;
                for (let k = 0; k < 20; k++) {
                    let tempVal = 1;
                    let count = 3 + Math.floor(Math.random() * 3);
                    if (this.activePrimes.length === 0) this.activePrimes = [2, 3];
                    for (let i = 0; i < count; i++) tempVal *= this.activePrimes[Math.floor(Math.random() * this.activePrimes.length)];
                    if (tempVal >= 100 && tempVal <= 300) { val = tempVal; break; }
                }
                if (val < 100 || val > 300) {
                    val = 2 * 2 * 3 * 3 * 3;
                    if (this.activePrimes.includes(5)) val = 2 * 2 * 5 * 5;
                }

                const radius = 60;
                const x = this.width / 2;

                this.showBossWarning();

                this.enemies.push({
                    id: Math.random(),
                    x: x, y: -100,
                    type: 'single',
                    value: val, maxVal: val,
                    radius: radius,
                    speed: 0.8,
                    hitFlash: 0,
                    isBoss: true
                });
            }

            showBossWarning() {
                this.bossWarningEl.classList.remove('boss-anim');
                void this.bossWarningEl.offsetWidth;
                this.bossWarningEl.classList.add('boss-anim');
                this.sound.playTone(150, 'sawtooth', 0.5, 0.3, -50);
                setTimeout(() => this.sound.playTone(150, 'sawtooth', 0.5, 0.3, -50), 500);
            }

            spawnEnemy() {
                // BOSS_RUSHでは雑魚敵スポーン処理は使わない（ボスのみ）
                if (this.currentMode === 'boss_rush') {
                    if (!this.enemies.some(e => e.isBoss)) {
                        this.spawnBoss();
                    }
                    return;
                }

                if (this.enemies.some(e => e.isBoss)) return;
                if (this.queueBossSpawn) { this.spawnBoss(); return; }

                let val = 1;
                let retry = 0;
                if (this.activePrimes.length === 0) this.activePrimes = [2, 3];

                while (retry < 10) {
                    val = 1;
                    let factorCount;
                    if (this.score < 10) factorCount = Math.random() < 0.5 ? 1 : 2;
                    else factorCount = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < factorCount; i++) val *= this.activePrimes[Math.floor(Math.random() * this.activePrimes.length)];
                    if (val < 100) break;
                    retry++;
                }
                if (val >= 100) val = 2 * 3;

                const radius = 30 + (val.toString().length * 2);
                const x = Math.random() * (this.width - radius * 2) + radius;

                let enemySpeed = 0.6 + (this.score * 0.03);
                if (enemySpeed > 2.5) enemySpeed = 2.5;

                this.enemies.push({
                    id: Math.random(),
                    x: x, y: -50,
                    type: 'single',
                    value: val, maxVal: val,
                    radius: radius,
                    speed: enemySpeed,
                    hitFlash: 0,
                    isBoss: false
                });
            }

            // --- 追加: 星(背景)処理 ---
            initStars() {
                this.stars = [];
                for (let i = 0; i < 50; i++) {
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        size: Math.random() * 2 + 1,
                        speed: Math.random() * 0.5 + 0.1,
                        color: Math.random() > 0.8 ? '#0f0' : '#fff'
                    });
                }
            }

            updateStars(dt) {
                // スコアやコンボ数に応じて背景の流れる速度をあげる
                let speedMulti = 1.0;
                if (this.combo >= 5) speedMulti = 1.5;
                if (this.combo >= 10) speedMulti = 2.5;
                if (this.enemies.some(e => e.isBoss)) speedMulti = 3.0; // ボス出現中は高速移動

                this.stars.forEach(s => {
                    s.y += s.speed * speedMulti * (dt / 16);
                    if (s.y > this.height) {
                        s.y = 0;
                        s.x = Math.random() * this.width;
                    }
                });
            }

            drawStars() {
                this.bgCtx.clearRect(0, 0, this.width, this.height);
                // 黒地の背景描画はCSSまたはdraw()で行う
                this.stars.forEach(s => {
                    this.bgCtx.fillStyle = s.color;
                    this.bgCtx.globalAlpha = Math.random() > 0.9 ? 0.3 : (this.combo > 5 ? 1.0 : 0.6); // またたき効果
                    this.bgCtx.fillRect(s.x, s.y, s.size, s.size);
                });
                this.bgCtx.globalAlpha = 1.0;
            }

            update(timestamp) {
                const dt = timestamp - this.lastTime;
                this.lastTime = timestamp;

                this.spawnTimer += dt;
                if (this.spawnTimer > this.spawnInterval) {
                    this.spawnEnemy();
                    this.spawnTimer = 0;

                    // NORMAL と FULL_OPEN で速度上昇
                    if (this.currentMode !== 'boss_rush') {
                        if (!this.enemies.some(e => e.isBoss)) {
                            if (this.spawnInterval > 800) this.spawnInterval -= 30;
                        }
                    } else {
                        // BOSS RUSH用
                        this.spawnInterval = 1000; // ボス撃破後のインターバル
                    }
                }

                // コンボタイマーの減少
                if (this.comboTimer > 0) {
                    this.comboTimer -= dt;
                    if (this.comboTimer <= 0) {
                        this.resetCombo();
                        this.sound.setBGMSpeed(150); // BGM速度を戻す
                    }
                }

                this.updateStars(dt);

                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];

                    if (b.state && b.state.startsWith('merging')) {
                        const dx = b.mergeTarget.x - b.x;
                        const dy = b.mergeTarget.y - b.y;
                        const dist = Math.hypot(dx, dy);

                        if (dist < 10) {
                            if (b.state === 'merging_left') {
                                this.sound.playShoot();
                                this.bullets.push({
                                    x: b.mergeTarget.x, y: b.mergeTarget.y,
                                    value: b.finalValue,
                                    radius: 20, speed: 18, color: b.finalColor,
                                    target: b.target, state: 'active'
                                });
                                this.createParticles(b.mergeTarget.x, b.mergeTarget.y, 10, '#fff');
                            }
                            this.bullets.splice(i, 1);
                            continue;
                        } else {
                            b.x += (dx / dist) * b.speed;
                            b.y += (dy / dist) * b.speed;
                            continue;
                        }
                    }

                    if (b.target && this.enemies.includes(b.target)) {
                        const dx = b.target.x - b.x;
                        const dy = b.target.y - b.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < b.speed) { b.x = b.target.x; b.y = b.target.y; }
                        else { b.x += (dx / dist) * b.speed; b.y += (dy / dist) * b.speed; }
                    } else {
                        b.y -= b.speed;
                    }

                    if (b.y < -50 || b.y > this.height + 50) {
                        this.bullets.splice(i, 1);
                        continue;
                    }

                    const e = b.target;
                    if (e && this.enemies.includes(e)) {
                        let hitRadius = e.radius;
                        if (e.type === 'pair') hitRadius += 30;

                        const dist = Math.hypot(b.x - e.x, b.y - e.y);
                        if (dist < b.radius + hitRadius) {
                            this.sound.playHit();

                            if (e.type === 'single') {
                                if (e.value % b.value === 0) {
                                    // Pop Up テキスト
                                    this.createFloatingText(`÷${b.value}`, e.x, e.y, b.color);

                                    e.value = e.value / b.value;
                                    e.hitFlash = 10;
                                    e.y -= e.isBoss ? 5 : 25;
                                    this.createParticles(e.x, e.y, 8, b.color);

                                    if (e.value === 1) {
                                        this.addCombo();

                                        // コンボ倍率計算
                                        let multiplier = 1.0;
                                        if (this.combo >= 2) multiplier = 1.2;
                                        if (this.combo >= 5) multiplier = 1.5;
                                        if (this.combo >= 10) multiplier = 2.0;

                                        let pts = e.isBoss ? 5 : 1;

                                        // パーフェクトキルボーナス（合成数などで一撃の場合）
                                        const isPerfectKill = e.maxVal === b.value;
                                        if (isPerfectKill) {
                                            pts *= 2;
                                            this.createFloatingText(`PERFECT!`, e.x, e.y - 20, '#ffeb3b', true);
                                        }

                                        pts = Math.floor(pts * multiplier);
                                        this.score += pts;
                                        this.scoreEl.innerText = this.score;

                                        if (e.isBoss) {
                                            this.sound.playBossExplosion();
                                            // ボス撃破のハードシェイク
                                            this.gameArea.classList.remove('shake-hard', 'shake');
                                            void this.gameArea.offsetWidth;
                                            this.gameArea.classList.add('shake-hard');
                                            setTimeout(() => this.gameArea.classList.remove('shake-hard'), 600);
                                        } else {
                                            this.sound.playExplosion();
                                        }

                                        this.createParticles(e.x, e.y, e.isBoss ? 60 : 30, '#fff');
                                        this.checkLevelProgression();
                                        const idx = this.enemies.indexOf(e);
                                        if (idx > -1) this.enemies.splice(idx, 1);
                                    }
                                } else {
                                    this.createParticles(b.x, b.y, 5, '#aaa');
                                }
                            } else if (e.type === 'pair') {
                                if (e.val1 % b.value === 0 && e.val2 % b.value === 0) {
                                    // Pop Up テキスト
                                    this.createFloatingText(`÷${b.value}`, e.x, e.y, b.color);

                                    e.val1 /= b.value;
                                    e.val2 /= b.value;
                                    e.hitFlash = 10;
                                    e.y -= 5;
                                    this.createParticles(e.x, e.y, 10, b.color);

                                    if (this.gcd(e.val1, e.val2) === 1) {
                                        this.createParticles(e.x, e.y, 20, '#fff');
                                        this.sound.playExplosion();

                                        // Pairは割れた瞬間にコンボ加算
                                        this.addCombo();

                                        if (e.val1 === 1 && e.val2 === 1) {
                                            let multiplier = 1.0;
                                            if (this.combo >= 2) multiplier = 1.2;
                                            if (this.combo >= 5) multiplier = 1.5;
                                            if (this.combo >= 10) multiplier = 2.0;

                                            this.score += Math.floor(10 * multiplier);
                                            this.scoreEl.innerText = this.score;
                                            this.sound.playBossExplosion();

                                            this.gameArea.classList.remove('shake-hard', 'shake');
                                            void this.gameArea.offsetWidth;
                                            this.gameArea.classList.add('shake-hard');
                                            setTimeout(() => this.gameArea.classList.remove('shake-hard'), 600);

                                            this.createParticles(e.x, e.y, 50, '#fff');
                                            this.checkLevelProgression();
                                        } else {
                                            if (e.val1 > 1) {
                                                this.enemies.push({
                                                    id: Math.random(),
                                                    x: e.x - 40, y: e.y - 20,
                                                    type: 'single', value: e.val1, maxVal: e.val1,
                                                    radius: 40, speed: 1.0, hitFlash: 0, isBoss: false
                                                });
                                            } else {
                                                this.createParticles(e.x - 40, e.y - 20, 20, '#fff');
                                            }
                                            if (e.val2 > 1) {
                                                this.enemies.push({
                                                    id: Math.random(),
                                                    x: e.x + 40, y: e.y + 20,
                                                    type: 'single', value: e.val2, maxVal: e.val2,
                                                    radius: 40, speed: 1.0, hitFlash: 0, isBoss: false
                                                });
                                            } else {
                                                this.createParticles(e.x + 40, e.y + 20, 20, '#fff');
                                            }
                                        }
                                        const idx = this.enemies.indexOf(e);
                                        if (idx > -1) this.enemies.splice(idx, 1);
                                    }
                                } else {
                                    this.createParticles(b.x, b.y, 5, '#aaa');
                                }
                            }

                            this.bullets.splice(i, 1);
                            continue;
                        }
                    }
                }

                for (let i = this.enemies.length - 1; i >= 0; i--) {
                    const e = this.enemies[i];
                    e.y += e.speed * (dt / 16);
                    if (e.hitFlash > 0) e.hitFlash--;

                    if (e.y > this.height + e.radius) {
                        this.takeDamage();
                        this.enemies.splice(i, 1);
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.04;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }

                // Pop Up テキストの更新
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const text = this.floatingTexts[i];
                    text.y -= text.speed;
                    text.life -= 0.02;
                    if (text.life <= 0) this.floatingTexts.splice(i, 1);
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                this.ctx.fillStyle = this.isPaused ? 'rgba(0,0,0,0.5)' : '#000';
                this.ctx.fillRect(0, 0, this.width, this.height);

                this.ctx.fillStyle = '#0f0';
                this.drawPlayer(this.player.x, this.player.y);

                this.bullets.forEach(b => {
                    this.ctx.fillStyle = b.color;
                    this.ctx.fillRect(b.x - b.radius / 2, b.y - b.radius / 2, b.radius, b.radius);
                    this.ctx.fillStyle = '#000';
                    this.ctx.font = '10px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    if (b.radius > 10) this.ctx.fillText(b.value, b.x, b.y);
                });

                this.enemies.forEach(e => {
                    if (e.type === 'single') {
                        this.drawInvader(e.x, e.y, e.radius, e.value, e.hitFlash > 0, e.isBoss);
                    } else if (e.type === 'pair') {
                        const gap = 35;
                        this.ctx.strokeStyle = (Math.random() > 0.5) ? '#0ff' : '#f0f';
                        this.ctx.lineWidth = 4;
                        this.ctx.setLineDash([5, 5]);
                        this.ctx.beginPath();
                        this.ctx.moveTo(e.x - gap, e.y);
                        this.ctx.lineTo(e.x + gap, e.y);
                        this.ctx.stroke();
                        this.ctx.setLineDash([]);

                        this.drawInvader(e.x - gap, e.y, e.radius, e.val1, e.hitFlash > 0, true, true); // true = hide BOSS text
                        this.drawInvader(e.x + gap, e.y, e.radius, e.val2, e.hitFlash > 0, true, true);

                        this.ctx.font = '10px "Press Start 2P"';
                        this.ctx.fillStyle = '#f0f';
                        this.ctx.fillText("PAIR", e.x, e.y - e.radius - 15);
                    }
                });

                this.particles.forEach(p => {
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(p.x, p.y, p.radius, p.radius);
                    this.ctx.globalAlpha = 1.0;
                });

                // Pop Up テキストの描画
                this.floatingTexts.forEach(t => {
                    this.ctx.globalAlpha = Math.max(0, t.life);
                    this.ctx.fillStyle = t.color;
                    this.ctx.font = t.isBig ? '24px "Press Start 2P"' : '14px "Press Start 2P"';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';

                    // 黒いフチドリ効果
                    this.ctx.strokeStyle = '#000';
                    this.ctx.lineWidth = 4;
                    this.ctx.strokeText(t.text, t.x, t.y);

                    this.ctx.fillText(t.text, t.x, t.y);
                    this.ctx.globalAlpha = 1.0;
                });
            }

            drawPlayer(x, y) {
                const size = 4;
                const shape = [
                    "   X   ",
                    "  XXX  ",
                    " XXXXX ",
                    "XXXXXXX"
                ];
                this.ctx.fillStyle = '#0f0';
                for (let row = 0; row < shape.length; row++) {
                    for (let col = 0; col < shape[row].length; col++) {
                        if (shape[row][col] === 'X') {
                            this.ctx.fillRect(x - 14 + col * size, y - 20 + row * size, size, size);
                        }
                    }
                }
            }

            drawInvader(x, y, r, val, isHit, isBoss, hideBossText) {
                const size = r * 2;
                const half = size / 2;

                let color = isBoss ? '#f00' : '#0f0';

                this.ctx.strokeStyle = isHit ? '#fff' : color;
                this.ctx.lineWidth = isBoss ? 4 : 2;
                this.ctx.strokeRect(x - half, y - half, size, size);

                this.ctx.fillStyle = isHit ? '#fff' : (isBoss ? 'rgba(255,0,0,0.2)' : 'rgba(0,255,0,0.1)');
                this.ctx.fillRect(x - half, y - half, size, size);

                this.ctx.fillStyle = isHit ? '#fff' : color;
                const d = 4;
                this.ctx.fillRect(x - half, y - half, d, d);
                this.ctx.fillRect(x + half - d, y - half, d, d);
                this.ctx.fillRect(x - half, y + half - d, d, d);
                this.ctx.fillRect(x + half - d, y + half - d, d, d);

                this.ctx.fillStyle = isHit ? '#000' : '#fff';
                const fontSize = isBoss ? r * 0.5 : r * 0.6;
                this.ctx.font = `${fontSize}px "Press Start 2P"`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText(val, x, y + 2);

                if (isBoss && !hideBossText) {
                    this.ctx.font = '10px "Press Start 2P"';
                    this.ctx.fillStyle = '#f00';
                    this.ctx.fillText("BOSS", x, y - r - 10);
                }
            }

            loop(timestamp) {
                if (!this.isRunning) return;
                if (this.isPaused) return;

                this.update(timestamp);
                this.drawStars();
                this.draw();
                this.animationId = requestAnimationFrame(t => this.loop(t));
            }

            createParticles(x, y, count, color) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 5 + 2;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                        life: 1.0, color: color, radius: Math.random() * 6 + 2
                    });
                }
            }

            // --- 追加: ポップアップテキストの生成 ---
            createFloatingText(text, x, y, color, isBig = false) {
                this.floatingTexts.push({
                    text: text,
                    x: x + (Math.random() * 20 - 10), // 少し左右にばらけさせる
                    y: y,
                    color: color,
                    life: 1.0,
                    speed: 1.5,
                    isBig: isBig
                });
            }

            getBtnColor(val) {
                const colors = {
                    2: '#e53935', 3: '#1e88e5', 5: '#fdd835', 7: '#d000f0', 11: '#00e5ff', 13: '#ff9100',
                    4: '#3f51b5', 6: '#00acc1', 8: '#673ab7', 9: '#e91e63', 10: '#4caf50', 12: '#ff9800'
                };
                return colors[val] || '#fff';
            }
        }

        const game = new Game();
    </script>
