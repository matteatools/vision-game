<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いちばんおおいのどーれだ？</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <!-- Import Map for React and Lucide -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>
    
    <style>
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            overflow: hidden; /* Prevent scrolling */
            user-select: none;
            touch-action: manipulation;
        }
        /* Custom scrollbar for title card if needed */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-sky-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { RefreshCw, Check, Star, Circle, Diamond, Trophy, RotateCcw, Clock, XCircle, Home, Timer, Crown, Volume2 } from 'lucide-react';

        // --- Types & Constants ---
        const SIZES = ['L', 'M', 'S'];
        const SHAPES = ['star', 'circle', 'diamond'];
        const COLORS = ['red', 'blue', 'yellow'];

        // --- Helper Functions ---
        const getRandomElement = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const generateLevel = (mode) => {
            let items = [];
            let valid = false;
            let correctAnswer = { type: 'shape', value: '' };

            while (!valid) {
                items = Array.from({ length: 9 }, (_, i) => ({
                    id: i,
                    size: getRandomElement(SIZES),
                    shape: getRandomElement(SHAPES),
                    color: getRandomElement(COLORS),
                    rotation: Math.random() * 60 - 30,
                }));

                const counts = {};
                const typeMap = {};

                items.forEach(item => {
                    counts[item.shape] = (counts[item.shape] || 0) + 1;
                    typeMap[item.shape] = 'shape';
                    counts[item.color] = (counts[item.color] || 0) + 1;
                    typeMap[item.color] = 'color';
                    
                    if (mode === 'normal') {
                        counts[item.size] = (counts[item.size] || 0) + 1;
                        typeMap[item.size] = 'size';
                    }
                });

                const sortedStats = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                if (sortedStats.length > 1 && sortedStats[0][1] > sortedStats[1][1]) {
                    valid = true;
                    correctAnswer = {
                        type: typeMap[sortedStats[0][0]],
                        value: sortedStats[0][0]
                    };
                }
            }
            return { items, answer: correctAnswer };
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        };

        // --- Sound Effects Hook ---
        const useGameSounds = () => {
            const audioCtxRef = useRef(null);
            const initAudio = () => {
                if (!audioCtxRef.current) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtxRef.current = new AudioContextClass();
                }
                if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
            };

            const playTone = (freq, type, duration, startTime = 0, vol = 0.1) => {
                if (!audioCtxRef.current) return;
                const ctx = audioCtxRef.current;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + startTime);
                gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
                gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + startTime + duration);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime + startTime); osc.stop(ctx.currentTime + startTime + duration);
            };

            return {
                playSelect: () => { initAudio(); playTone(880, 'sine', 0.15, 0, 0.05); },
                playCorrect: () => {
                    initAudio();
                    playTone(523.25, 'triangle', 0.3, 0, 0.1);
                    playTone(659.25, 'triangle', 0.3, 0.08, 0.1);
                    playTone(783.99, 'triangle', 0.4, 0.16, 0.1);
                },
                playWrong: () => { initAudio(); playTone(329.63, 'sine', 0.2, 0, 0.1); playTone(293.66, 'sine', 0.4, 0.1, 0.1); },
                playStart: () => {
                    initAudio();
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => playTone(freq, 'triangle', 0.2, i * 0.08, 0.08));
                },
                playClear: () => {
                    initAudio();
                    const now = 0; const vol = 0.08;
                    playTone(523.25, 'triangle', 0.2, now, vol);
                    playTone(659.25, 'triangle', 0.6, now + 0.45, vol);
                    playTone(1046.50, 'triangle', 1.2, now + 0.45, vol);
                }
            };
        };

        // --- Components ---
        const Figure = ({ size, shape, color, rotation }) => {
            const sizePx = size === 'L' ? 90 : size === 'M' ? 65 : 45;
            const colorHex = color === 'red' ? '#ef4444' : color === 'blue' ? '#3b82f6' : '#eab308';
            const getShapePath = () => {
                switch (shape) {
                    case 'circle': return <circle cx="50" cy="50" r="45" />;
                    case 'diamond': return <polygon points="50,5 95,50 50,95 5,50" />;
                    case 'star': return <polygon points="50,5 61,35 95,35 68,55 79,90 50,70 21,90 32,55 5,35 39,35" />;
                }
            };
            return (
                <div className="flex items-center justify-center w-full h-full" style={{ transform: `rotate(${rotation}deg)` }}>
                    <svg viewBox="0 0 100 100" style={{ width: `${sizePx}%`, height: `${sizePx}%` }} className="drop-shadow-md">
                        <g fill={colorHex}>{getShapePath()}</g>
                        <g fill="none" stroke="black" strokeWidth="3" strokeOpacity="0.15">{getShapePath()}</g>
                    </svg>
                </div>
            );
        };

        const OptionButton = ({ isSelected, onClick, children, isCorrectAnswer, showResult, className = "" }) => {
            let bgClass = "bg-white hover:bg-gray-50 border-gray-200 shadow-sm";
            if (showResult) {
                if (isCorrectAnswer) bgClass = "bg-green-100 border-green-500 ring-2 ring-green-500 scale-105 z-10";
                else if (isSelected) bgClass = "bg-red-100 border-red-500 opacity-50";
                else bgClass = "opacity-20 border-gray-100 grayscale";
            } else {
                bgClass = "bg-sky-50 hover:bg-sky-100 border-sky-200 hover:border-sky-300";
                if (isSelected) bgClass = "bg-sky-100 border-sky-500 ring-2 ring-sky-400 z-10 scale-105";
            }
            return (
                <button
                    onClick={onClick} disabled={showResult}
                    className={`relative rounded-xl border-2 sm:border-4 flex items-center justify-center transition-all duration-200 transform aspect-square w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 ${bgClass} ${!showResult && 'active:scale-90'} ${className}`}
                >
                    {children}
                    {showResult && isCorrectAnswer && <div className="absolute -top-2 -right-2 rounded-full bg-green-500 text-white p-0.5 shadow-md z-20 animate-bounce"><Check size={16} strokeWidth={4} /></div>}
                </button>
            );
        };

        const Game = () => {
            const [gameState, setGameState] = useState('title');
            const [gameMode, setGameMode] = useState('normal');
            const [level, setLevel] = useState(null);
            const [userSelection, setUserSelection] = useState(null);
            const [questionsCleared, setQuestionsCleared] = useState(0);
            const [targetQuestions, setTargetQuestions] = useState(5);
            const [elapsedTime, setElapsedTime] = useState(0);
            const timerRef = useRef(null);

            const [highScores, setHighScores] = useState({
                easy: { 5: null, 10: null, 15: null },
                normal: { 5: null, 10: null, 15: null }
            });

            const [showResult, setShowResult] = useState(false);
            const [isCorrectMove, setIsCorrectMove] = useState(false);
            const { playSelect, playCorrect, playWrong, playStart, playClear } = useGameSounds();

            useEffect(() => {
                if (gameState === 'playing') {
                    timerRef.current = window.setInterval(() => setElapsedTime(t => t + 1), 1000);
                }
                return () => { if (timerRef.current) clearInterval(timerRef.current); };
            }, [gameState]);

            const startGame = (count, mode) => {
                playStart(); setGameMode(mode); setTargetQuestions(count); setQuestionsCleared(0); setElapsedTime(0); setGameState('playing'); loadNextLevel(mode);
            };

            const returnToTitle = () => { playSelect(); if (timerRef.current) clearInterval(timerRef.current); setGameState('title'); setLevel(null); };
            const loadNextLevel = (mode) => { setLevel(generateLevel(mode)); setUserSelection(null); setShowResult(false); setIsCorrectMove(false); };

            const handleSelect = (type, value) => {
                if (showResult || !level) return;
                setUserSelection({ type, value }); setShowResult(true);
                const isCorrect = (type === level.answer.type && value === level.answer.value);
                setIsCorrectMove(isCorrect);
                if (isCorrect) { playCorrect(); } else { playWrong(); }
                let nextCleared = questionsCleared + (isCorrect ? 1 : 0);
                if (isCorrect) setQuestionsCleared(nextCleared);
                setTimeout(() => {
                    if (nextCleared >= targetQuestions) {
                        playClear(); setGameState('result'); if (timerRef.current) clearInterval(timerRef.current);
                        const currentBest = highScores[gameMode][targetQuestions];
                        if (currentBest === null || elapsedTime < currentBest) {
                            setHighScores(prev => ({ ...prev, [gameMode]: { ...prev[gameMode], [targetQuestions]: elapsedTime } }));
                        }
                    } else { loadNextLevel(gameMode); }
                }, 700);
            };

            if (gameState === 'title') {
                return (
                    <div className="min-h-screen w-full bg-sky-50 font-sans flex items-center justify-center p-2 relative overflow-hidden">
                        <div className="bg-white/95 backdrop-blur-sm p-4 sm:p-8 rounded-3xl shadow-xl border-4 border-sky-200 max-w-lg w-full max-h-[95vh] flex flex-col z-10 overflow-hidden">
                            <div className="flex-1 overflow-y-auto custom-scrollbar px-2 py-4 space-y-4 sm:space-y-6">
                                <h1 className="text-2xl sm:text-4xl font-black text-sky-600 tracking-wider text-center leading-tight drop-shadow-sm">
                                    いちばん<br/>おおいのどーれだ？
                                </h1>
                                <div className="flex gap-2 justify-center bg-gray-100 p-1 rounded-xl shrink-0">
                                    <button onClick={() => { playSelect(); setGameMode('easy'); }} className={`flex-1 py-2 rounded-lg font-bold text-sm sm:text-base transition-all ${gameMode === 'easy' ? 'bg-white text-green-600 shadow-md' : 'text-gray-400'}`}>やさしい</button>
                                    <button onClick={() => { playSelect(); setGameMode('normal'); }} className={`flex-1 py-2 rounded-lg font-bold text-sm sm:text-base transition-all ${gameMode === 'normal' ? 'bg-white text-sky-600 shadow-md' : 'text-gray-400'}`}>ほんばん</button>
                                </div>
                                <div className="bg-sky-50 p-3 rounded-xl border border-sky-100 text-center">
                                    <p className="text-gray-500 text-xs sm:text-sm">
                                        {gameMode === 'easy' ? '「かたち」と「いろ」から えらんでね！' : '「かたち」「いろ」「大きさ」から えらんでね！'}
                                    </p>
                                </div>
                                <div className="grid grid-cols-1 gap-2">
                                    {[5, 10, 15].map((count) => (
                                        <button key={count} onClick={() => startGame(count, gameMode)} className={`w-full border-b-4 font-black text-base sm:text-lg py-3 px-4 sm:px-6 rounded-xl transition-transform active:scale-95 flex items-center justify-between ${gameMode === 'easy' ? 'bg-green-100 hover:bg-green-200 border-green-300 text-green-700' : 'bg-sky-100 hover:bg-sky-200 border-sky-300 text-sky-700'}`}>
                                            <span className="flex items-center gap-2"><Check size={18} strokeWidth={3} /> {count} もん</span>
                                            {highScores[gameMode][count] !== null && <span className="text-[10px] sm:text-xs bg-white/50 px-2 py-1 rounded-full flex items-center gap-1"><Crown size={12} className="fill-yellow-500 text-yellow-600"/>{formatTime(highScores[gameMode][count])}</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (gameState === 'result') {
                const isNewRecord = highScores[gameMode][targetQuestions] === elapsedTime;
                return (
                    <div className="min-h-screen w-full bg-yellow-50 font-sans flex items-center justify-center p-2 relative overflow-hidden">
                        <div className="bg-white/95 p-6 sm:p-8 rounded-3xl shadow-xl border-4 border-yellow-200 max-w-sm w-full text-center space-y-6 animate-in zoom-in z-10 max-h-[95vh] overflow-y-auto custom-scrollbar">
                            <h2 className="text-3xl font-black text-gray-700">クリア！</h2>
                            <div className="space-y-4">
                                <p className="text-gray-400 font-bold text-sm">かかったじかん</p>
                                <div className="text-5xl font-black text-sky-500 flex items-center justify-center gap-2 relative">
                                    <Timer size={32} className="text-sky-400" />
                                    {formatTime(elapsedTime)}
                                    {isNewRecord && <div className="absolute -top-6 -right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full animate-bounce rotate-12">NEW RECORD!</div>}
                                </div>
                            </div>
                            <button onClick={returnToTitle} className="w-full bg-sky-500 hover:bg-sky-600 text-white font-black text-lg py-3 rounded-xl shadow-lg transition-transform active:scale-95 flex items-center justify-center gap-2"><Home size={20} />タイトルへ</button>
                        </div>
                    </div>
                );
            }

            if (!level) return <div className="p-10 text-center">読み込み中...</div>;

            return (
                <div className="h-screen w-full bg-slate-100 font-sans select-none overflow-hidden flex flex-col relative">
                    <div className="bg-white border-b border-slate-200 px-4 py-1.5 flex items-center justify-between z-20 shadow-sm shrink-0">
                        <button onClick={returnToTitle} className="bg-gray-100 hover:bg-gray-200 text-gray-500 px-2 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1"><RotateCcw size={14} /> やめる</button>
                        <div className="flex items-center gap-4">
                            <div className="flex items-center gap-1"><Trophy size={16} className="text-yellow-600" /><span className="text-lg font-black text-slate-700">{questionsCleared}/{targetQuestions}</span></div>
                            <div className="flex items-center gap-1"><Clock size={16} className="text-sky-500" /><span className="text-lg font-black text-slate-700">{formatTime(elapsedTime)}</span></div>
                        </div>
                    </div>

                    <div className="flex-1 w-full max-w-4xl mx-auto flex flex-col min-h-0 overflow-hidden">
                        <div className="flex-1 flex items-center justify-center p-2 sm:p-4 gap-2 sm:gap-6 min-h-0">
                            {/* COLOR BUTTONS */}
                            <div className="flex flex-col justify-center gap-2 shrink-0">
                                {COLORS.map(c => (
                                    <OptionButton key={c} isSelected={userSelection?.type === 'color' && userSelection?.value === c} onClick={() => handleSelect('color', c)} showResult={showResult} isCorrectAnswer={level.answer.type === 'color' && level.answer.value === c}>
                                        <div className={`w-[70%] h-[70%] rounded-full border-2 border-white shadow-sm ${c === 'red' ? 'bg-red-500' : c === 'blue' ? 'bg-blue-500' : 'bg-yellow-400'}`} />
                                    </OptionButton>
                                ))}
                            </div>
                            {/* GAME BOARD */}
                            <div className="flex-1 flex items-center justify-center min-w-0 h-full">
                                <div className="relative w-full aspect-square max-h-full max-w-[min(65vh,100%)] bg-white rounded-2xl border-2 sm:border-4 border-slate-200 shadow-inner p-2">
                                    <div className="grid grid-cols-3 grid-rows-3 gap-1 sm:gap-2 w-full h-full">
                                        {level.items.map((item) => <div key={item.id} className="relative w-full h-full flex items-center justify-center"><Figure {...item} /></div>)}
                                    </div>
                                    {showResult && (
                                        <div className="absolute inset-0 bg-white/40 flex items-center justify-center z-10 backdrop-blur-[1px] rounded-2xl">
                                            {isCorrectMove ? <Circle size={80} className="text-green-500 animate-bounce" strokeWidth={4} /> : <XCircle size={80} className="text-red-500 animate-pulse" strokeWidth={4} />}
                                        </div>
                                    )}
                                </div>
                            </div>
                            {/* SHAPE BUTTONS */}
                            <div className="flex flex-col justify-center gap-2 shrink-0">
                                {SHAPES.map(s => (
                                    <OptionButton key={s} isSelected={userSelection?.type === 'shape' && userSelection?.value === s} onClick={() => handleSelect('shape', s)} showResult={showResult} isCorrectAnswer={level.answer.type === 'shape' && level.answer.value === s}>
                                        {s === 'star' && <Star size="70%" className="fill-gray-800 text-gray-800" />}
                                        {s === 'circle' && <Circle size="70%" className="fill-gray-800 text-gray-800" />}
                                        {s === 'diamond' && <div className="w-[50%] h-[50%] bg-gray-800 rotate-45" />}
                                    </OptionButton>
                                ))}
                            </div>
                        </div>

                        {/* SIZE BUTTONS */}
                        {gameMode === 'normal' && (
                            <div className="h-auto py-2 flex justify-center items-center gap-4 z-20 shrink-0 border-t border-slate-200 bg-white/50">
                                {SIZES.map(s => (
                                    <OptionButton key={s} isSelected={userSelection?.type === 'size' && userSelection?.value === s} onClick={() => handleSelect('size', s)} showResult={showResult} isCorrectAnswer={level.answer.type === 'size' && level.answer.value === s}>
                                        <div className={`bg-gray-800 rounded-md shadow-sm ${s === 'L' ? 'w-[65%] h-[65%]' : s === 'M' ? 'w-[45%] h-[45%]' : 'w-[25%] h-[25%]'}`} />
                                    </OptionButton>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<Game />);
    </script>
</body>
</html>
